apiVersion: v1
kind: ConfigMap
metadata:
  name: mainloop-config
  namespace: mainloop
data:
  HOST: 0.0.0.0
  PORT: '8000'
  DB_HOST: mainloop-db-pooler.mainloop
  DB_PORT: '5432'
  DB_NAME: mainloop
  FRONTEND_DOMAIN: mainloop.example.com # Override in kustomize overlay
  # Merge tools and owner write routes remain off pending deployed authority proof.
  MAINLOOP_MERGE_TOOLS_ENABLED: 'false'
  MAINLOOP_MERGE_CONFIGURATIONS: '[]'
  # Pinned explicitly so a value baked into an image (e.g. by an ENV in a Dockerfile) can never
  # win over the deployed config. Enable only through this checked-in config, not the image.
  MAINLOOP_MERGE_PROTECTED_AUTO: 'false'
  # The live dev loop (dev_sync and the lease tools) stays off except where an overlay turns it on.
  MAINLOOP_DEVLOOP_ENABLED: 'false'
