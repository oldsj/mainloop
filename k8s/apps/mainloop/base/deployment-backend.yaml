apiVersion: apps/v1
kind: Deployment
metadata:
  name: mainloop-backend
  namespace: mainloop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mainloop-backend
  template:
    metadata:
      labels:
        app: mainloop-backend
    spec:
      serviceAccountName: mainloop-backend
      securityContext:
        fsGroup: 1000
      imagePullSecrets:
        - name: ghcr-secret
      initContainers:
        # Brings the schema to the latest version before any listener starts. `migrate up`
        # takes the migrator lock, so a restart racing another pod waits instead of failing.
        - name: migrate
          image: ghcr.io/oldsj/mainloop-backend:latest
          command: [/usr/local/bin/mainloop, migrate, up]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - configMapRef:
                name: mainloop-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mainloop-secrets
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mainloop-secrets
                  key: db-password
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 500m
      containers:
        - name: backend
          image: ghcr.io/oldsj/mainloop-backend:latest
          command: [/usr/local/bin/mainloop, serve-api]
          ports:
            - containerPort: 8000
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - configMapRef:
                name: mainloop-config
            - secretRef:
                name: mainloop-secrets
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mainloop-secrets
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mainloop-secrets
                  key: db-password
            - name: AGENT_TOKEN_KEY
              valueFrom:
                secretKeyRef:
                  name: mainloop-secrets
                  key: agent-token-key
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: mainloop-secrets
                  key: github-app-id
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: mainloop-secrets
                  key: github-app-private-key
          resources:
            requests:
              memory: 1Gi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: 1000m
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

        - name: mcp
          image: ghcr.io/oldsj/mainloop-backend:latest
          command: [/usr/local/bin/mainloop, serve-mcp]
          ports:
            - containerPort: 8002
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - configMapRef:
                name: mainloop-config
            - secretRef:
                name: mainloop-secrets
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mainloop-secrets
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mainloop-secrets
                  key: db-password
            - name: AGENT_TOKEN_KEY
              valueFrom:
                secretKeyRef:
                  name: mainloop-secrets
                  key: agent-token-key
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: mainloop-secrets
                  key: github-app-id
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: mainloop-secrets
                  key: github-app-private-key
          resources:
            requests:
              memory: 1Gi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: 1000m
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 10

        - name: git
          image: ghcr.io/oldsj/mainloop-backend:latest
          command: [/usr/local/bin/mainloop, serve-git]
          ports:
            - name: git-read
              containerPort: 8003
            - name: git-push
              containerPort: 8004
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - configMapRef:
                name: mainloop-config
            - secretRef:
                name: mainloop-secrets
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mainloop-secrets
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mainloop-secrets
                  key: db-password
            - name: AGENT_TOKEN_KEY
              valueFrom:
                secretKeyRef:
                  name: mainloop-secrets
                  key: agent-token-key
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: mainloop-secrets
                  key: github-app-id
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: mainloop-secrets
                  key: github-app-private-key
          volumeMounts:
            - name: git-spool
              mountPath: /var/lib/mainloop/git
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
              ephemeral-storage: 1Gi
            limits:
              memory: 2Gi
              cpu: 1000m
              ephemeral-storage: 3Gi
          # The read listener answers /health only when the process is up; a failing push
          # listener ends the process, so one probe covers both ports.
          readinessProbe:
            httpGet:
              path: /health
              port: git-read
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: git-read
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: git-spool
          emptyDir:
            sizeLimit: 3Gi
