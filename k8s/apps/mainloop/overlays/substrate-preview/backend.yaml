apiVersion: apps/v1
kind: Deployment
metadata:
  name: mainloop-backend
  namespace: mainloop-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mainloop-backend
  template:
    metadata:
      labels:
        app: mainloop-backend
    spec:
      serviceAccountName: mainloop-backend
      containers:
        - name: backend
          image: localhost:5001/mainloop-backend:substrate-preview
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - configMapRef:
                name: mainloop-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mainloop-db-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mainloop-db-app
                  key: password
          resources:
            requests:
              memory: 1Gi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: 1000m
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
