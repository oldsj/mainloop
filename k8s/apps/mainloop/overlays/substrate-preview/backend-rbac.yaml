apiVersion: v1
kind: ServiceAccount
metadata:
  name: mainloop-backend
  namespace: mainloop-control
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mainloop-read-shim-tokens
  namespace: mainloop-control
rules:
  - apiGroups: ['']
    resources: [secrets]
    resourceNames:
      - mainloop-shim-live-agent-gate-headless-claude-reproof
      - mainloop-shim-native-codex-headless-codex-reproof
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mainloop-read-shim-tokens
  namespace: mainloop-control
subjects:
  - kind: ServiceAccount
    name: mainloop-backend
    namespace: mainloop-control
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mainloop-read-shim-tokens
