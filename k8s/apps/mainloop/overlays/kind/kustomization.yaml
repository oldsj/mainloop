apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local Kind cluster for trying Mainloop out (docs/dev-environment.md#kind). Runs the Go server and
# React app with a local PostgreSQL. kagent, Substrate, the GitHub App and Tailscale exposure are
# not configured here, so the stack boots without them. Images are built on the host and loaded
# into Kind; nothing is pulled from ghcr.io.

resources:
  - ../../base
  - postgres.yaml

patches:
  - path: configmap.yaml
  - path: deployments.yaml

images:
  - name: ghcr.io/oldsj/mainloop-backend
    newName: mainloop-backend
    newTag: kind
  - name: ghcr.io/oldsj/mainloop-frontend
    newName: mainloop-frontend
    newTag: kind
