apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No namespace transformer: integration resources must remain in kagent.
resources:
  - ../../base
  - ../../../../integrations/kagent
  - ../../../../integrations/kagent/kind
  - postgres.yaml
patches:
  - path: configmap.yaml
  - path: deployments.yaml
  - path: services.yaml
images:
  - name: ghcr.io/oldsj/mainloop-backend
    newName: mainloop-backend
    newTag: kind
  - name: ghcr.io/oldsj/mainloop-frontend
    newName: mainloop-frontend
    newTag: kind
