# Kind loads the images onto the nodes and has no ghcr.io pull secret to use.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mainloop-backend
  namespace: mainloop
spec:
  template:
    spec:
      imagePullSecrets: null
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mainloop-frontend
  namespace: mainloop
spec:
  template:
    spec:
      imagePullSecrets: null
      containers:
        - name: frontend
          env:
            - name: ORIGIN
              value: http://localhost:5173
