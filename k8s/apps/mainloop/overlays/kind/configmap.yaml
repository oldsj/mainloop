apiVersion: v1
kind: ConfigMap
metadata:
  name: mainloop-config
  namespace: mainloop
data:
  # The browser reaches the web app at http://localhost:5173 and the API at http://localhost:8000
  # through port forwards. The Origin and Host checks compare these values exactly, so keep them
  # in step with the forwards and with the VITE_API_URL build argument.
  FRONTEND_SCHEME: http
  FRONTEND_DOMAIN: localhost:5173
  API_DOMAIN: localhost
  DB_HOST: mainloop-postgres
  # Lets `make dev-reset` run `mainloop migrate reset` against this throwaway database.
  MAINLOOP_ALLOW_RESET: '1'
