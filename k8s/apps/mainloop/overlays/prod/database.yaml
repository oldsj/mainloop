# Fresh CloudNativePG cluster. CNPG generates the application credentials in
# Secret mainloop-pg-app (keys username, password). The backend reads them from there.
# The backend connects to the rw Service directly: one instance, one client app, and no
# pooler whose pool could stall DBOS LISTEN/NOTIFY sessions.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mainloop-pg
  namespace: mainloop
spec:
  instances: 1
  storage:
    size: 10Gi
  bootstrap:
    initdb:
      database: mainloop
      owner: mainloop
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 1Gi
