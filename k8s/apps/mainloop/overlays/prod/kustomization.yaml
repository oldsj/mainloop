apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Generic production overlay. Site-specific values (domains, owner id, gateway
# routes, Secret sources) are supplied by the deployment repository; see
# docs/production-rollout.md for the contract. Image digests are supplied there too,
# or by the `release` branch, where the Publish images workflow adds an `images:`
# block to this file. Main never carries one.

namespace: mainloop

resources:
  - ../../base
  - database.yaml

patches:
  - path: config-patch.yaml
  - path: backend-patch.yaml
  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: mainloop-frontend
  - path: networkpolicy-patch.yaml
    target:
      kind: NetworkPolicy
      name: mainloop-backend-ingress
