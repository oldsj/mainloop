apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Generic production overlay. Site-specific values (domains, owner id, gateway
# routes, image digests, Secret sources) are supplied by the deployment
# repository; see docs/production-rollout.md for the contract.

namespace: mainloop

resources:
  - ../../base
  - database.yaml

patches:
  - path: config-patch.yaml
  - path: backend-patch.yaml
  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: mainloop-frontend
  - path: networkpolicy-patch.yaml
    target:
      kind: NetworkPolicy
      name: mainloop-backend-ingress
