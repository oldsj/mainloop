apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mainloop

resources:
  - ../../base
  - httproute.yaml # Tailscale Gateway routes (prod-only)
  - database.yaml # CloudNativePG (prod-only)
  - 1password.yaml # 1Password Connect integration

patches:
  # Stage 1 is inert. Promotion templates are deliberately not resources.
  - path: hold.yaml
  - path: configmap-patch.yaml
  - path: backend-config-patch.yaml
  - path: frontend-config-patch.yaml
  - path: ingress-patch.yaml
    target:
      kind: NetworkPolicy
      name: mainloop-backend-ingress
  # Patch CloudNativePG storage class
  - path: database-patch.yaml
    target:
      kind: Cluster
      name: mainloop-db
