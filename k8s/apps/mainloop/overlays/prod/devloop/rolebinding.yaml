# Binds the Role to the production backend's ServiceAccount, and to no other subject. See
# docs/specs/devloop.md.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mainloop-devloop
  namespace: mainloop-staging
subjects:
  - kind: ServiceAccount
    name: mainloop-backend
    namespace: mainloop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mainloop-devloop
