# Scopes the base ClusterRole mainloop-devloop to mainloop-dev alone, for the production backend
# only: no other overlay's ServiceAccount is named here, and this binding grants nothing outside
# this one namespace. See docs/specs/devloop.md.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mainloop-devloop
  namespace: mainloop-dev
subjects:
  - kind: ServiceAccount
    name: mainloop-backend
    namespace: mainloop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mainloop-devloop
