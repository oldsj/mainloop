apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No top-level `namespace:`: the RoleBinding below must stay in mainloop-staging even though this
# overlay's own resources render into `mainloop`. This mirrors
# overlays/staging/kagent/, a standalone kustomization for the same reason (a resource that must
# land in a namespace other than the one `../../base` renders into).
#
# Applied by Argo as a second source of `mainloop-staging-config`. Namespace mainloop-staging has a
# GitOps owner: the cluster repository's Argo Application `mainloop-staging-config` (automated prune
# and selfHeal, CreateNamespace). This directory is a second source of that Application, pinned to
# the same mainloop revision as the production app. Applied by hand it is not tracked by Argo,
# `make staging-purge` deletes it with the namespace, and nothing recreates it.
resources:
  - role.yaml
  - rolebinding.yaml
