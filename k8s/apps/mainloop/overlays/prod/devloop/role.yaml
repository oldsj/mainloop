# What the production backend may do in mainloop-dev: read pod status and logs, and exec into
# mainloop-dev's own containers to copy a synced commit and check the backend's /health. Namespaced
# on purpose (no ClusterRole), so nothing outside mainloop-dev is ever granted. See
# docs/specs/devloop.md.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mainloop-devloop
  namespace: mainloop-dev
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
  - apiGroups: ['']
    resources: [pods/exec]
    verbs: [create]
