apiVersion: apps/v1
kind: Deployment
metadata:
  name: mainloop-backend
  namespace: mainloop
spec:
  template:
    spec:
      containers:
        - name: backend
          # Do not import arbitrary/obsolete settings from mainloop-secrets.
          envFrom:
            - $patch: replace
            - configMapRef:
                name: mainloop-config
          env:
            - $patch: replace
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mainloop-feature-db-app
                  key: username
                  optional: false
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mainloop-feature-db-app
                  key: password
                  optional: false
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mainloop-secrets
                  key: github-token
                  optional: false
            - name: MAINLOOP_OWNER_ID
              valueFrom:
                secretKeyRef:
                  name: mainloop-runtime-auth
                  key: owner-id
                  optional: false
            - name: AGENT_TOKEN_KEY
              valueFrom:
                secretKeyRef:
                  name: mainloop-runtime-auth
                  key: agent-token-key
                  optional: false
        - name: mcp
          # Do not import arbitrary/obsolete settings from mainloop-secrets.
          envFrom:
            - $patch: replace
            - configMapRef:
                name: mainloop-config
          env:
            - $patch: replace
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mainloop-feature-db-app
                  key: username
                  optional: false
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mainloop-feature-db-app
                  key: password
                  optional: false
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mainloop-secrets
                  key: github-token
                  optional: false
            - name: MAINLOOP_OWNER_ID
              valueFrom:
                secretKeyRef:
                  name: mainloop-runtime-auth
                  key: owner-id
                  optional: false
            - name: AGENT_TOKEN_KEY
              valueFrom:
                secretKeyRef:
                  name: mainloop-runtime-auth
                  key: agent-token-key
                  optional: false
