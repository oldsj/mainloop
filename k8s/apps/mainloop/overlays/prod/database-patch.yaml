apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mainloop-db
  namespace: mainloop
  annotations:
    cnpg.io/hibernation: "on"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  # Reference 1Password-managed secret for app credentials
  bootstrap:
    initdb:
      secret:
        name: mainloop-db-credentials

  # Use local-path (node NVMe) for storage
  storage:
    storageClass: local-path
