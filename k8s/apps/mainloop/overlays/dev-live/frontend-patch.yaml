# Vite dev server with HMR (web/Dockerfile --target dev). The browser calls /api on the
# same host and Vite forwards it to the backend Service (MAINLOOP_API_PROXY, web/vite.config.ts).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mainloop-frontend
  namespace: mainloop
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      # The -dev images are public; drop the base ghcr-secret reference.
      imagePullSecrets: null
      containers:
        - name: frontend
          imagePullPolicy: Always
          command: [/app/web/node_modules/.bin/vite]
          workingDir: /app/web
          env:
            - $patch: replace
            - name: VITE_HOST
              value: 0.0.0.0
            - name: VITE_PORT
              value: '3000'
            - name: VITE_API_URL
              value: /api
            - name: MAINLOOP_API_PROXY
              value: http://mainloop-backend:8000
            # Vite rejects unknown Host headers; allow the gateway host.
            - name: __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
              value: mainloop-dev.olds.network
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '2'
              memory: 2Gi
          livenessProbe:
            initialDelaySeconds: 90
          readinessProbe:
            initialDelaySeconds: 20
            failureThreshold: 12
