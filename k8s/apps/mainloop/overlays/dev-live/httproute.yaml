# One tailnet host, like production. The browser reaches the API through Vite's
# /api proxy, so the backend needs no route. No timeouts: Vite HMR is a WebSocket.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mainloop-frontend
spec:
  parentRefs:
    - name: tailscale-gateway
      namespace: tailscale
  hostnames:
    - mainloop-dev.olds.network
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: mainloop-frontend
          port: 3000
      timeouts:
        request: 0s
        backendRequest: 0s
