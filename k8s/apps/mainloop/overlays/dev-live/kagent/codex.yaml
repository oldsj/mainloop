apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: codex-workspace-dev-harness
spec:
  codex: {}
  workload:
    # Production pin; `make dev-harness` overrides it through DevSpace.
    image: ghcr.io/oldsj/kagent-codex-harness:0.0.0-d8936d9@sha256:c8a18b9ec007edabef33f714ed5b1918f66b6413553fdadc04a2b0364a6d3761
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://ate-snapshots/kagent-dev/
      onQuiesce: Full
  sessionIdleTTL: 0s
  env:
    - name: KAGENT_RUNTIME_GENERATION
      value: '3'
    - name: GIT_CONFIG_COUNT
      value: '2'
    - name: GIT_CONFIG_KEY_0
      value: user.name
    - name: GIT_CONFIG_VALUE_0
      value: Mainloop dev agent
    - name: GIT_CONFIG_KEY_1
      value: user.email
    - name: GIT_CONFIG_VALUE_1
      value: 12104969+oldsj@users.noreply.github.com
  # No Git proxies: kagent's Harness CRD accepts only production's proxy origins, and
  # mainloop-dev keeps Git transport off.
  git:
    origins:
      - github.com
  extraHTTPSOrigins:
    - https://registry.npmjs.org
    - https://pypi.org
    - https://files.pythonhosted.org
    - https://proxy.golang.org
    - https://sum.golang.org
    - https://storage.googleapis.com
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: codex-workspace-dev-template
spec:
  modelConfig:
    name: codex-subscription-model
  description: mainloop-dev codex workspace
  systemPrompt: You are working in a persistent Mainloop development workspace. Work only
    in oldsj/testrepo. Preserve uncommitted and unpushed work. Use the repository and
    branch prepared for this Session.
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: mainloop-dev
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: codex-workspace-dev
spec:
  templateRef:
    name: codex-workspace-dev-template
  harnessRef:
    name: codex-workspace-dev-harness
