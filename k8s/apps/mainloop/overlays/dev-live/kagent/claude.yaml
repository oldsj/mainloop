apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: claude-workspace-dev-harness
spec:
  claude: {}
  workload:
    # Production pin; `make dev-harness` overrides it through DevSpace.
    image: ghcr.io/oldsj/kagent-claude-harness:0.0.0-4616d73@sha256:960e7d93aec31060a8e909d22eb5aebc394c966cf383569d47f2c47d30b09280
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://ate-snapshots/kagent-dev/
      onQuiesce: Data
  sessionIdleTTL: 0s
  env:
    - name: KAGENT_RUNTIME_GENERATION
      value: '3'
    - name: GIT_CONFIG_COUNT
      value: '2'
    - name: GIT_CONFIG_KEY_0
      value: user.name
    - name: GIT_CONFIG_VALUE_0
      value: Mainloop dev agent
    - name: GIT_CONFIG_KEY_1
      value: user.email
    - name: GIT_CONFIG_VALUE_1
      value: 12104969+oldsj@users.noreply.github.com
  # mainloop-dev's own Git read/push proxies, named like production's but under
  # mainloop-dev.svc.cluster.local (docs/dev-environment.md#live-dev-instance).
  git:
    origins:
      - github.com
    readProxyOrigin: http://mainloop-git-read.mainloop-dev.svc.cluster.local
    pushProxyOrigin: http://mainloop-git-push.mainloop-dev.svc.cluster.local
  extraHTTPSOrigins:
    - https://registry.npmjs.org
    - https://pypi.org
    - https://files.pythonhosted.org
    - https://proxy.golang.org
    - https://sum.golang.org
    - https://storage.googleapis.com
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: claude-workspace-dev-template
spec:
  modelConfig:
    name: claude-subscription-model
  description: mainloop-dev claude workspace
  systemPrompt: You are working in a persistent Mainloop development workspace. Work only
    in oldsj/testrepo. Preserve uncommitted and unpushed work. Use the repository and
    branch prepared for this Session.
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: mainloop-dev
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: claude-workspace-dev
spec:
  templateRef:
    name: claude-workspace-dev-template
  harnessRef:
    name: claude-workspace-dev-harness
