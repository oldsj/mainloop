apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: mainloop-dev
  labels:
    kagent.dev/discovery: disabled
spec:
  description: mainloop-dev control-plane tools with per-session gateway identity.
  protocol: STREAMABLE_HTTP
  url: http://mainloop-mcp.mainloop-dev.svc.cluster.local/mcp
  headersFrom:
    - name: Authorization
      value: Bearer kagent-credential-injected
