# Like the production overlay, envFrom replaces the base list so the whole
# mainloop-secrets Secret is not imported; env merges by name. Every key from
# mainloop-secrets is optional until the dev Secret exists. The commands match
# DevSpace's, so the pods also reload when started without `devspace dev`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mainloop-backend
  namespace: mainloop
spec:
  strategy:
    type: Recreate
  template:
    spec:
      # Images are published for arm64 only.
      nodeSelector:
        kubernetes.io/arch: arm64
      # The -dev images are public; drop the base ghcr-secret reference.
      imagePullSecrets: null
      containers:
        - name: backend
          imagePullPolicy: Always
          command:
            - uvicorn
            - mainloop.api:app
            - --host
            - 0.0.0.0
            - --port
            - '8000'
            - --reload
            - --reload-dir
            - /app/src
            - --reload-dir
            - /models
            - --timeout-graceful-shutdown
            - '3'
          envFrom: &envFrom
            - configMapRef:
                name: mainloop-config
          env: &env
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mainloop-pg-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mainloop-pg-app
                  key: password
            - name: AGENT_TOKEN_KEY
              valueFrom:
                secretKeyRef:
                  name: mainloop-secrets
                  key: agent-token-key
                  optional: true
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: mainloop-secrets
                  key: github-app-id
                  optional: true
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: mainloop-secrets
                  key: github-app-private-key
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
        - name: mcp
          imagePullPolicy: Always
          command:
            - uvicorn
            - mainloop.mcp_app:app
            - --host
            - 0.0.0.0
            - --port
            - '8002'
            - --reload
            - --reload-dir
            - /app/src
            - --reload-dir
            - /models
            - --timeout-graceful-shutdown
            - '3'
          envFrom: *envFrom
          env: *env
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
        - name: git
          imagePullPolicy: Always
          envFrom: *envFrom
          env: *env
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
