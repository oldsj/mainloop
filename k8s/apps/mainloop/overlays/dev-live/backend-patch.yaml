# Like the production overlay, envFrom replaces the base list so the whole
# mainloop-secrets Secret is not imported; env merges by name. GitHub App keys stay
# optional so the instance starts without them; AGENT_TOKEN_KEY is required by the
# server (there is no fallback), so mainloop-secrets must hold agent-token-key.
# Each server container runs watchexec over `go run` from /src, which DevSpace syncs
# server/ into; the same commands run when the pods start without `devspace dev`.
# Each container rebuilds into its own Go build cache, on top of the warm cache baked into
# the image, so each gets its own ephemeral-storage budget; the base 3Gi pod total was
# evicted after about ten hot reloads.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mainloop-backend
  namespace: mainloop
spec:
  strategy:
    type: Recreate
  template:
    spec:
      # Images are published for arm64 only.
      nodeSelector:
        kubernetes.io/arch: arm64
      # The -dev images are public; drop the base ghcr-secret reference.
      imagePullSecrets: null
      initContainers:
        # The dev image keeps the source it was built from at /src, so migrate runs the
        # image's own revision before the first sync.
        - name: migrate
          imagePullPolicy: Always
          command: [go, run, ./cmd/mainloop, migrate, up]
          workingDir: /src
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mainloop-pg-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mainloop-pg-app
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: '2'
              memory: 2Gi
              ephemeral-storage: 8Gi
      containers:
        - name: backend
          imagePullPolicy: Always
          command: &watch
            - watchexec
            - --restart
            - --exts
            - go,sql
            - --stop-timeout
            - 5s
            - --
            - go
            - run
            - ./cmd/mainloop
          args: [serve-api]
          workingDir: /src
          envFrom: &envFrom
            - configMapRef:
                name: mainloop-config
          env: &env
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mainloop-pg-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mainloop-pg-app
                  key: password
            - name: AGENT_TOKEN_KEY
              valueFrom:
                secretKeyRef:
                  name: mainloop-secrets
                  key: agent-token-key
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: mainloop-secrets
                  key: github-app-id
                  optional: true
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: mainloop-secrets
                  key: github-app-private-key
                  optional: true
          # `go run` compiles first, so the probes wait for a cold build.
          livenessProbe: &liveness
            initialDelaySeconds: 120
            failureThreshold: 6
          readinessProbe: &readiness
            initialDelaySeconds: 20
            failureThreshold: 60
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: '2'
              memory: 2Gi
              ephemeral-storage: 8Gi
        - name: mcp
          imagePullPolicy: Always
          command: *watch
          args: [serve-mcp]
          workingDir: /src
          envFrom: *envFrom
          env: *env
          livenessProbe: *liveness
          readinessProbe: *readiness
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 2Gi
        - name: git
          imagePullPolicy: Always
          command: *watch
          args: [serve-git]
          workingDir: /src
          envFrom: *envFrom
          env: *env
          livenessProbe: *liveness
          readinessProbe: *readiness
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: '2'
              memory: 2Gi
              ephemeral-storage: 8Gi
