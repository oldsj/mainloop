apiVersion: apps/v1
kind: Deployment
metadata:
  name: mainloop-backend
  namespace: mainloop
spec:
  template:
    spec:
      containers:
        - name: backend
          env: &env
            - name: KAGENT_GATEWAY_URL
              value: https://kagent-control.kagent.svc.cluster.local
            - name: KAGENT_USER_ID
              value: mainloop
            - name: KAGENT_CONTROL_TOKEN_FILE
              value: /run/kagent-control-auth/current
            - name: SSL_CERT_FILE
              value: /run/kagent-control-ca/ca-bundle.crt
          volumeMounts: &mounts
            - name: kagent-control-auth
              mountPath: /run/kagent-control-auth
              readOnly: true
            - name: kagent-control-ca
              mountPath: /run/kagent-control-ca
              readOnly: true
        - name: mcp
          env: *env
          volumeMounts: *mounts
        - name: git
          env: *env
          volumeMounts: *mounts
      volumes:
        - name: kagent-control-auth
          secret:
            secretName: kagent-control-token
            items:
              - key: current
                path: current
        - name: kagent-control-ca
          emptyDir:
            medium: Memory
            sizeLimit: 2Mi
        - name: kagent-control-root
          secret:
            secretName: kagent-control-ca
            items:
              - key: ca.crt
                path: ca.crt
      initContainers:
        # Appends the kagent control CA to the default roots for SSL_CERT_FILE.
        - name: kagent-control-trust-bundle
          image: ghcr.io/oldsj/mainloop-backend:latest
          command:
            - sh
            - -c
            - |
              cat /etc/ssl/certs/ca-certificates.crt > /run/kagent-control-ca/ca-bundle.crt
              echo >> /run/kagent-control-ca/ca-bundle.crt
              cat /run/kagent-control-root/ca.crt >> /run/kagent-control-ca/ca-bundle.crt
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - name: kagent-control-root
              mountPath: /run/kagent-control-root
              readOnly: true
            - name: kagent-control-ca
              mountPath: /run/kagent-control-ca
