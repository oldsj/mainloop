apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mainloop

resources:
  - ../../base
  - postgres-statefulset.yaml
  - nodeport-services.yaml

patches:
  - path: configmap-patch.yaml
    target:
      kind: ConfigMap
      name: mainloop-config

  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: mainloop-backend

  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: mainloop-frontend

  - path: agent-controller-patch.yaml
    target:
      kind: Deployment
      name: mainloop-agent-controller

# Override images to use local dev-tagged images (loaded into Kind, no registry)
images:
  - name: ghcr.io/oldsj/mainloop-backend
    newName: mainloop-backend
    newTag: dev
  - name: ghcr.io/oldsj/mainloop-frontend
    newName: mainloop-frontend
    newTag: dev
  - name: ghcr.io/oldsj/mainloop-agent-controller
    newName: mainloop-agent-controller
    newTag: dev
