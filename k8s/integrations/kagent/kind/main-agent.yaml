apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: mainloop-main-harness
  namespace: kagent
spec:
  claude: {}
  sessionIdleTTL: 0s
  substrate:
    snapshotPolicy: { location: s3://ate-snapshots/kagent/ }
    workerPoolRef: { name: kagent-default }
  workload:
    image: kagent-claude-harness:kind
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: mainloop-main-template
  namespace: kagent
spec:
  modelConfig: { name: claude-subscription-model }
  systemPrompt: You are the Mainloop main thread. Use the mainloop MCP tools when asked.
  tools:
    - mcp:
        server: { kind: RemoteMCPServer, name: mainloop }
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: mainloop-main
  namespace: kagent
spec:
  harnessRef: { name: mainloop-main-harness }
  templateRef: { name: mainloop-main-template }
