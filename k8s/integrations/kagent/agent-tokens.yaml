apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mainloop-agent-tokens
  namespace: kagent
rules:
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mainloop-agent-tokens
  namespace: kagent
subjects:
  - kind: ServiceAccount
    name: mainloop-backend
    namespace: mainloop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mainloop-agent-tokens
