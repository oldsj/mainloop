<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="AI agent orchestrator - one place to manage all AI work" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint (the app applies it again once mounted).
      try {
        var theme = localStorage.getItem('mainloop-theme');
        if (['eighties', 'dracula', 'nord', 'gruvbox', 'tokyo-night'].indexOf(theme) !== -1) {
          document.documentElement.className = 'theme-' + theme;
        }
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <body class="bg-neutral-50 text-neutral-900" data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
