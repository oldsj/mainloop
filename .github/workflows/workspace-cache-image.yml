name: Publish workspace cache image

# A cache image for production workspace sessions: the development image plus the Go module and
# build caches and the pnpm store for one commit of main, so a fresh clone compiles nothing.
#
#   ghcr.io/oldsj/mainloop-dev:cache-<full sha>   one per run
#   ghcr.io/oldsj/mainloop-dev:cache-main         moved only after the smoke check passes
#
# It runs when a merge changes what the image is built from (dependencies, the dev image, the
# cache Dockerfile or this workflow) and once a day otherwise. Every new digest is a new
# environment version that each workspace node pulls (about 380 MB of new layers) and prepares
# before its first session, so publishing per merge made the pull path the bottleneck
# (#274). Daily stays inside Go's five-day cache trim; a session on a day-old image rebuilds
# only the packages that changed since.
#
# Built natively for linux/arm64 (the workspace nodes): Go keys its cache on the compiler, so a
# cache built under emulation or for another architecture would miss. Only trusted main code runs
# here; there is no pull_request trigger. The environments service follows `cache-main`
# (docs/specs/environments.md, "Following a watched tag").

on:
  push:
    branches: [main]
    # The inputs of the image: its own definition, the dependency manifests it downloads, and the
    # dev image it builds on (the same paths as dev-image.yml, also listed in "Resolve base image").
    paths:
      - images/workspace-cache/**
      - .github/workflows/workspace-cache-image.yml
      - server/go.mod
      - server/go.sum
      - package.json
      - web/package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - .devcontainer/**
      - .trunk/**
      - scripts/with-timeout.mjs
      - .github/workflows/dev-image.yml
  schedule:
    - cron: 23 9 * * *
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

# Runs queue instead of cancelling each other: one runs, and the newest merge waits behind it, so a
# burst of merges still ends with `cache-main` moving. An older run that finishes after main has
# moved on leaves the tag alone (see "Move cache-main").
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish cache image (arm64)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      IMAGE: ghcr.io/oldsj/mainloop-dev
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Full history: the base image comes from the newest commit that touched its paths.
          fetch-depth: 0
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The base is the development image that the newest commit touching its paths published
      # (same paths as dev-image.yml), never `latest`: `latest` can still be the image from before
      # an earlier merge whose dev-image run has not finished. Wait for that commit's tag.
      - name: Resolve base image
        id: base
        shell: bash
        run: |
          set -euo pipefail
          paths=(.devcontainer .trunk scripts/with-timeout.mjs package.json pnpm-lock.yaml pnpm-workspace.yaml .npmrc .github/workflows/dev-image.yml)
          ref=$(git log -1 --format=%H "$GITHUB_SHA" -- "${paths[@]}")
          [[ "$ref" =~ ^[a-f0-9]{40}$ ]]
          echo "The dev image comes from $ref; waiting for $IMAGE:$ref"
          found=false
          for _ in $(seq 1 60); do
            if docker buildx imagetools inspect "$IMAGE:$ref" > /dev/null 2>&1; then
              found=true
              break
            fi
            sleep 15
          done
          if [[ "$found" != true ]]; then
            echo "::error::$IMAGE:$ref was not published within 15 minutes; check the Mainloop dev image run for that commit"
            exit 1
          fi
          digest=$(docker buildx imagetools inspect "$IMAGE:$ref" --format '{{json .Manifest}}' | jq -er '.digest')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Only the dependency stage is worth caching: it depends on the lock files and the base, so
      # most merges reuse it. The build stage changes with every commit and is never reused, so
      # exporting it would only churn the repository's Actions cache. The second build below finds
      # these layers in this builder's own cache.
      - name: Build the dependency layers
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/workspace-cache/Dockerfile
          target: deps
          platforms: linux/arm64
          push: false
          provenance: false
          sbom: false
          build-args: |
            BASE=${{ env.IMAGE }}@${{ steps.base.outputs.digest }}
          cache-from: type=gha,scope=workspace-cache-deps-arm64
          cache-to: type=gha,mode=min,scope=workspace-cache-deps-arm64

      - name: Build and push cache-${{ github.sha }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/workspace-cache/Dockerfile
          target: cache
          platforms: linux/arm64
          push: true
          # A single-platform manifest, with no attestation index beside it.
          provenance: false
          sbom: false
          build-args: |
            BASE=${{ env.IMAGE }}@${{ steps.base.outputs.digest }}
            SOURCE_SHA=${{ github.sha }}
          tags: ${{ env.IMAGE }}:cache-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.base.name=${{ env.IMAGE }}:${{ steps.base.outputs.ref }}
            org.opencontainers.image.base.digest=${{ steps.base.outputs.digest }}
          cache-from: type=gha,scope=workspace-cache-deps-arm64

      # A fresh clone of this commit, at the path sessions use, must compile nothing.
      - name: Smoke check a fresh clone compiles nothing
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker run --rm --platform linux/arm64 --user 65532:65532 \
            -v "$PWD/.git:/src/.git:ro" -e SOURCE_SHA="$GITHUB_SHA" \
            "$IMAGE@$DIGEST" bash -euo pipefail -c '
              export GIT_CONFIG_GLOBAL="$(mktemp)"
              git config --global --add safe.directory "*"
              git clone --quiet --depth 1 file:///src /data/workspace
              cd /data/workspace
              test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
              for var in GOMODCACHE GOCACHE npm_config_store_dir npm_config_virtual_store_dir; do
                [[ "${!var}" == /opt/cache/* ]] || { echo "$var is ${!var:-unset}, not under /opt/cache"; exit 1; }
              done
              cd server
              go build -x ./... 2> /tmp/build.log
              go test -x -exec /bin/true -run XXX_none ./... > /tmp/test.log 2>&1
              build=$(grep -c "/compile " /tmp/build.log || true)
              tests=$(grep -c "/compile " /tmp/test.log || true)
              echo "compiles: go build=$build, go test=$tests"
              test "$build" -eq 0 && test "$tests" -eq 0
              (cd ../web && pnpm install --frozen-lockfile --offline > /dev/null)
            '

      # `cache-main` moves only for the newest commit of main, so a re-run of an old workflow
      # cannot move it backwards.
      - name: Move cache-main
        id: main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$head" == "$GITHUB_SHA" ]]; then
            docker buildx imagetools create --tag "$IMAGE:cache-main" "$IMAGE@$DIGEST"
            echo "moved=true" >> "$GITHUB_OUTPUT"
          else
            echo "main has moved on to $head; leaving cache-main alone"
            echo "moved=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record published digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          BASE_DIGEST: ${{ steps.base.outputs.digest }}
          MOVED: ${{ steps.main.outputs.moved }}
        run: |
          {
            printf '### Workspace cache image (linux/arm64)\n\n'
            printf 'Source commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'Base: `%s@%s`\n\n' "$IMAGE" "$BASE_DIGEST"
            printf 'Tags: `%s:cache-%s`%s\n\n' "$IMAGE" "$GITHUB_SHA" "$([[ "$MOVED" == true ]] && printf ', `%s:cache-main`' "$IMAGE")"
            printf 'Immutable image: `%s@%s`\n' "$IMAGE" "$DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
