name: Publish images

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish ${{ matrix.image }} (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: server
            file: server/Dockerfile
            target: prod
            build-args: REVISION=${{ github.sha }}
          - image: frontend
            context: .
            file: web/Dockerfile
            target: ''
            build-args: VITE_API_URL=https://mainloop-api.olds.network
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Compute image tag
        id: tag
        shell: bash
        run: echo "sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          build-args: ${{ matrix.build-args }}
          tags: ghcr.io/oldsj/mainloop-${{ matrix.image }}:${{ steps.tag.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=publish-${{ matrix.image }}-arm64
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.image }}-arm64

      - name: Record published digest
        shell: bash
        env:
          IMAGE: ghcr.io/oldsj/mainloop-${{ matrix.image }}
          TAG: ${{ steps.tag.outputs.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            printf '### %s (linux/arm64)\n\n' "$IMAGE"
            printf 'Source commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'Tag: `%s:%s`\n\n' "$IMAGE" "$TAG"
            printf 'Digest: `%s`\n\n' "$DIGEST"
            printf 'Pin: `%s@%s`\n' "$IMAGE" "$DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

  # Pins production to this commit's images. The release branch is the main commit plus one commit
  # that adds an images block to the prod overlay; Argo tracks it. Pushes made with GITHUB_TOKEN do
  # not start workflows, so this cannot loop. A run releases only while its commit is still the tip of
  # main, so a cancelled, failed or re-run older run cannot roll production back. Each release is also
  # tagged release-<sha7>: the release branch is rewritten every time, and the tag keeps the
  # previous release reachable for a rollback.
  release:
    name: Release to the release branch
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read
    env:
      OVERLAY: k8s/apps/mainloop/overlays/prod
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin the prod overlay to the published digests
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_SHA:0:7}"
          main_now="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$main_now" != "$GITHUB_SHA" ]]; then
            echo "::notice::main is at ${main_now}, not ${GITHUB_SHA}; the run for the newer commit releases"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q '^images:' "${OVERLAY}/kustomization.yaml"; then
            echo "::error::${OVERLAY}/kustomization.yaml already has an images: key; merge the release block by hand"
            exit 1
          fi
          digest_of() {
            local d
            d="$(docker buildx imagetools inspect "ghcr.io/oldsj/mainloop-$1:${tag}" --format '{{.Manifest.Digest}}')"
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest for mainloop-$1:${tag}: '${d}'" >&2; exit 1; }
            printf '%s' "$d"
          }
          backend="$(digest_of backend)"
          frontend="$(digest_of frontend)"
          {
            printf '\nimages:\n'
            printf '  - name: ghcr.io/oldsj/mainloop-backend\n    digest: %s\n' "$backend"
            printf '  - name: ghcr.io/oldsj/mainloop-frontend\n    digest: %s\n' "$frontend"
          } >> "${OVERLAY}/kustomization.yaml"
          rendered="$(kubectl kustomize "${OVERLAY}")"
          grep -qF "mainloop-backend@${backend}" <<<"$rendered"
          grep -qF "mainloop-frontend@${frontend}" <<<"$rendered"
          {
            printf '### Release %s\n\n' "$tag"
            printf 'Backend: `%s`\n\n' "$backend"
            printf 'Frontend: `%s`\n' "$frontend"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update the release branch
        if: steps.pin.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_SHA:0:7}"
          # The previous release's subject is "Release <sha7>"; its tag is release-<sha7>.
          prev=""
          if [[ -n "$(git ls-remote origin refs/heads/release)" ]]; then
            git fetch --quiet --depth=1 origin refs/heads/release
            prev="$(git log -1 --format=%s FETCH_HEAD | sed -n 's/^Release \([0-9a-f]\{7\}\)$/\1/p')"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release ${tag}" -m "Source: ${GITHUB_SHA}"
          git push --atomic --force origin HEAD:refs/heads/release "HEAD:refs/tags/release-${tag}"
          {
            printf '\nRelease commit: `%s` (tag `release-%s`)\n\n' "$(git rev-parse HEAD)" "$tag"
            if [[ -n "$prev" ]]; then
              printf 'Roll back to the previous release:\n\n'
              printf '```\ngit fetch origin tag release-%s && git push --force origin release-%s:refs/heads/release\n```\n' "$prev" "$prev"
            else
              printf 'No previous release to roll back to.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
