name: Publish images

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: backend
            context: server
            file: server/Dockerfile
            target: prod
            build-args: REVISION=${{ github.sha }}
          - image: frontend
            context: .
            file: web/Dockerfile
            target: ''
            build-args: VITE_API_URL=https://mainloop-api.olds.network
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Compute image tag
        id: tag
        shell: bash
        run: echo "sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          push: true
          build-args: ${{ matrix.build-args }}
          tags: ghcr.io/oldsj/mainloop-${{ matrix.image }}:${{ steps.tag.outputs.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=publish-${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.image }}-${{ matrix.arch }}

      - name: Record published digest
        shell: bash
        env:
          IMAGE: ghcr.io/oldsj/mainloop-${{ matrix.image }}
          TAG: ${{ steps.tag.outputs.sha }}-${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            printf '### %s (linux/%s)\n\n' "$IMAGE" "${{ matrix.arch }}"
            printf 'Source commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'Tag: `%s:%s`\n\n' "$IMAGE" "$TAG"
            printf 'Digest: `%s`\n\n' "$DIGEST"
            printf 'Pin: `%s@%s`\n' "$IMAGE" "$DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

  # Joins the two native builds into one multi-arch index under the plain tag, so pods pull the
  # right one on arm64 (worker-01) and amd64 (k8s-worker-b550).
  merge:
    name: Publish ${{ matrix.image }} multi-arch index
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Create the index
        shell: bash
        env:
          IMAGE: ghcr.io/oldsj/mainloop-${{ matrix.image }}
        run: |
          set -euo pipefail
          tag="${GITHUB_SHA:0:7}"
          docker buildx imagetools create --tag "$IMAGE:${tag}" \
            "$IMAGE:${tag}-amd64" "$IMAGE:${tag}-arm64"
          docker buildx imagetools inspect "$IMAGE:${tag}" --format '{{json .Manifest}}' \
            | jq -e '[.manifests[].platform.architecture] | (index("amd64") and index("arm64"))' >/dev/null
          printf '### %s:%s (linux/amd64, linux/arm64)\n' "$IMAGE" "$tag" >> "$GITHUB_STEP_SUMMARY"

  # Publishes charts/mainloop to oci://ghcr.io/oldsj/charts/mainloop as 0.1.<run number>, with this
  # commit's image digests pinned in its values. Deployments track the newest 0.1.* version. Run
  # numbers only grow, so a re-run or a late older run never outranks a newer commit's chart.
  chart:
    name: Publish the chart
    needs: merge
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push
        shell: bash
        env:
          VERSION: 0.1.${{ github.run_number }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_SHA:0:7}"
          digest_of() {
            local d
            d="$(docker buildx imagetools inspect "ghcr.io/oldsj/mainloop-$1:${tag}" --format '{{.Manifest.Digest}}')"
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest for mainloop-$1:${tag}: '${d}'" >&2; exit 1; }
            printf '%s' "$d"
          }
          backend="$(digest_of backend)" frontend="$(digest_of frontend)"
          values=charts/mainloop/values.yaml
          yq -i ".images.backend.tag = \"${tag}\" | .images.backend.digest = \"${backend}\"" "$values"
          yq -i ".images.frontend.tag = \"${tag}\" | .images.frontend.digest = \"${frontend}\"" "$values"
          rendered="$(helm template mainloop charts/mainloop)"
          grep -qF "mainloop-backend@${backend}" <<<"$rendered"
          grep -qF "mainloop-frontend@${frontend}" <<<"$rendered"
          helm package charts/mainloop --version "$VERSION" --app-version "$tag" --destination "$RUNNER_TEMP"
          helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GHCR_TOKEN"
          helm push "$RUNNER_TEMP/mainloop-${VERSION}.tgz" oci://ghcr.io/oldsj/charts
          {
            printf '### Chart mainloop %s\n\n' "$VERSION"
            printf 'Pull: `oci://ghcr.io/oldsj/charts/mainloop --version %s`\n\n' "$VERSION"
            printf 'Backend: `%s`\n\n' "$backend"
            printf 'Frontend: `%s`\n' "$frontend"
          } >> "$GITHUB_STEP_SUMMARY"
