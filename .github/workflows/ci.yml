name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  backend-tests:
    name: Backend unit and PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mainloop
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mainloop -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MAINLOOP_TEST_DATABASE_URL: postgresql://mainloop:ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/postgres
      AGENT_TOKEN_KEY: ci-key-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.34.1
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --frozen --python 3.13
      - name: Run offline fixtures and scratch PostgreSQL tests
        working-directory: backend
        run: uv run --no-sync python -m unittest discover -s tests -t . -v

  frontend-unit:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend unit tests
        working-directory: frontend
        run: node --test src/lib/*.test.ts

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write # Required for trunk-action to post annotations
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: trunk-io/trunk-action@v1
        with:
          # PR mode assumes a merge checkout; compare explicit SHAs on the exact head.
          check-mode: push
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GITHUB_EVENT_AFTER: ${{ github.event.pull_request.head.sha || github.event.after }}

  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            file: backend/Dockerfile
            context: .
            tag: mainloop-backend:test
          - image: frontend
            file: frontend/Dockerfile
            context: .
            tag: mainloop-frontend:test
            build-args: VITE_API_URL=http://localhost:8081
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
