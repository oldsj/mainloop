name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  command-deadlines:
    name: Command deadline and cleanup tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test command deadlines and process cleanup
        run: make test-timeouts

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write # Required for trunk-action to post annotations
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: trunk-io/trunk-action@v1
        with:
          # PR mode assumes a merge checkout; compare explicit SHAs on the exact head.
          check-mode: push
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GITHUB_EVENT_AFTER: ${{ github.event.pull_request.head.sha || github.event.after }}
