name: Publish live dev images

# --target=dev images for the shared mainloop-dev instance (`make dev-live`).
# DevSpace pulls the mutable tag and syncs the working tree over the image source.
#
#   mainloop-server-dev:<sha7> and :main
#   mainloop-web-dev:<sha7> and :main
#
# The dev-live overlay pins :main, so the mutable tag is what the shared instance pulls.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish ${{ matrix.image }}-dev (${{ matrix.arch }})
    # Dev pods pull a mutable tag, so only main publishes (also via workflow_dispatch).
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: [server, web]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: server
            context: server
            dockerfile: server/Dockerfile
          - image: web
            context: .
            dockerfile: web/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Compute image tag
        id: tag
        shell: bash
        run: echo "sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: dev
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/oldsj/mainloop-${{ matrix.image }}-dev:${{ steps.tag.outputs.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=live-dev-${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=live-dev-${{ matrix.image }}-${{ matrix.arch }}

      - name: Record published digest
        shell: bash
        env:
          IMAGE: ghcr.io/oldsj/mainloop-${{ matrix.image }}-dev
          TAG: ${{ steps.tag.outputs.sha }}-${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            printf '### %s (linux/%s, --target=dev)\n\n' "$IMAGE" "${{ matrix.arch }}"
            printf 'Source commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'Tag: `%s:%s`\n\n' "$IMAGE" "$TAG"
            printf 'Digest: `%s`\n' "$DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

  # Joins the two native builds into one multi-arch index under the plain tag, so pods pull the
  # right one on arm64 (worker-01) and amd64 (k8s-worker-b550).
  merge:
    name: Publish ${{ matrix.image }} multi-arch index
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        image: [server, web]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Create the index
        shell: bash
        env:
          IMAGE: ghcr.io/oldsj/mainloop-${{ matrix.image }}-dev
        run: |
          set -euo pipefail
          tag="${GITHUB_SHA:0:7}"
          docker buildx imagetools create --tag "$IMAGE:${tag}" --tag "$IMAGE:main" \
            "$IMAGE:${tag}-amd64" "$IMAGE:${tag}-arm64"
          docker buildx imagetools inspect "$IMAGE:${tag}" --format '{{json .Manifest}}' \
            | jq -e '[.manifests[].platform.architecture] | (index("amd64") and index("arm64"))' >/dev/null
          printf '### %s:%s (linux/amd64, linux/arm64)\n' "$IMAGE" "$tag" >> "$GITHUB_STEP_SUMMARY"
