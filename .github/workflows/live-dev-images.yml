name: Publish live dev images

# --target=dev images for the shared mainloop-dev instance (`make dev-live`).
# DevSpace pulls the mutable tag and syncs the working tree over the image source.
#
#   mainloop-server-dev:<sha7> and :main
#   mainloop-web-dev:<sha7> and :main
#   mainloop-server-dev:go-react and mainloop-web-dev:go-react (transitional alias)
#
# The dev-live overlay still pins go-react, the tag of the retired migration branch.
# The alias stays until the overlay and its render test move to main together.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish ${{ matrix.image }}-dev (arm64)
    # Dev pods pull a mutable tag, so only main publishes (also via workflow_dispatch).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            context: server
            dockerfile: server/Dockerfile
          - image: web
            context: .
            dockerfile: web/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Compute image tag
        id: tag
        shell: bash
        run: echo "sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: dev
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/oldsj/mainloop-${{ matrix.image }}-dev:${{ steps.tag.outputs.sha }}
            ghcr.io/oldsj/mainloop-${{ matrix.image }}-dev:main
            ghcr.io/oldsj/mainloop-${{ matrix.image }}-dev:go-react
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=live-dev-${{ matrix.image }}-arm64
          cache-to: type=gha,mode=max,scope=live-dev-${{ matrix.image }}-arm64

      - name: Record published digest
        shell: bash
        env:
          IMAGE: ghcr.io/oldsj/mainloop-${{ matrix.image }}-dev
          TAG: ${{ steps.tag.outputs.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            printf '### %s (linux/arm64, --target=dev)\n\n' "$IMAGE"
            printf 'Source commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'Tags: `%s:%s`, `%s:main`, `%s:go-react`\n\n' "$IMAGE" "$TAG" "$IMAGE" "$IMAGE"
            printf 'Digest: `%s`\n' "$DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
