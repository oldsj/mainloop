name: Workspace environment images

# Environment images projects select for their workspaces (docs/specs/environments.md). Each is
# built on PRs that touch it and published by digest from main. Registration takes the digest
# reference from the run summary; a mutable tag is never registered.
on:
  pull_request:
    branches: [main]
    paths:
      - images/opencozy-next-env/**
      - .github/workflows/env-images.yml
  push:
    branches: [main]
    paths:
      - images/opencozy-next-env/**
      - .github/workflows/env-images.yml

permissions:
  contents: read

concurrency:
  group: env-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opencozy-next-env:
    name: opencozy-next-env (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: images/opencozy-next-env/Dockerfile
          platforms: linux/amd64
          load: true
          tags: opencozy-next-env:ci
          cache-from: type=gha,scope=opencozy-next-env
          cache-to: type=gha,mode=max,scope=opencozy-next-env
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run --rm opencozy-next-env:ci bash -euo pipefail -c '
            [[ $(id -u):$(id -g) == 65532:65532 ]]
            go version | grep -q "go1.27.4 "
            [[ $(node --version) == v26.13.0 ]]
            [[ $(pnpm --version) == 12.18.0 ]]
            postgres --version | grep -q " 18.6 "
            agent-browser --version
            (ocn-postgres >/tmp/pg.log 2>&1 &)
            for i in $(seq 1 30); do pg_isready -h 127.0.0.1 -p 54329 -q && break; sleep 1; done
            PGPASSWORD=app-dev-only psql -h 127.0.0.1 -p 54329 -U app -d app -tAc "select 1" | grep -qx 1'
      - name: Publish by digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: images/opencozy-next-env/Dockerfile
          platforms: linux/amd64
          tags: ghcr.io/oldsj/opencozy-next-env:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=opencozy-next-env
      - name: Record digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf '### opencozy-next-env\n\nImmutable image: `ghcr.io/oldsj/opencozy-next-env@%s`\n' "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
