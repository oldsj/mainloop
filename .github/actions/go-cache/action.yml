name: Go build cache
description: >
  Restore and save the Go build and module caches. Keyed on the commit SHA so every run saves an
  updated cache, with a go.sum-scoped restore-key so a later run still gets the most recent match.
inputs:
  go-sum:
    description: Path to the go.sum file the cache is scoped to.
    required: true
    default: server/go.sum
runs:
  using: composite
  steps:
    - id: paths
      shell: bash
      run: |
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          ${{ steps.paths.outputs.build }}
          ${{ steps.paths.outputs.mod }}
        key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles(inputs.go-sum) }}-${{ github.sha }}
        restore-keys: |
          go-${{ runner.os }}-${{ github.job }}-${{ hashFiles(inputs.go-sum) }}-
