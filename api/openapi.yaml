components:
  schemas:
    ActivityItem:
      properties:
        id:
          type: string
          title: Id
        title:
          type: string
          title: Title
        content:
          type: string
          title: Content
        href:
          anyOf:
            - type: string
            - type: 'null'
          title: Href
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
        - id
        - title
        - content
        - created_at
      title: ActivityItem
    AskUserAnswer:
      properties:
        answer:
          items:
            type: string
            maxLength: 8192
          type: array
          maxItems: 100
          title: Answer
      additionalProperties: false
      type: object
      required:
        - answer
      title: AskUserAnswer
    AskUserResponse:
      properties:
        type:
          type: string
          const: ask_user_response
          title: Type
        id:
          type: string
          maxLength: 2048
          minLength: 1
          title: Id
        answers:
          items:
            $ref: '#/components/schemas/AskUserAnswer'
          type: array
          maxItems: 100
          minItems: 1
          title: Answers
      additionalProperties: false
      type: object
      required:
        - type
        - id
        - answers
      title: AskUserResponse
    AttentionItem:
      properties:
        id:
          type: string
          title: Id
        kind:
          type: string
          enum:
            - approval
            - question
            - owner_decision
          title: Kind
        title:
          type: string
          title: Title
        needed:
          type: string
          title: Needed
        href:
          type: string
          title: Href
        session_ids:
          # No cap in the code: unpaginated owner-scoped list
          items:
            type: string
          type: array
          title: Session Ids
        task_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Task Id
        queue_item:
          anyOf:
            - $ref: '#/components/schemas/QueueItem'
            - type: 'null'
      type: object
      required:
        - id
        - kind
        - title
        - needed
        - href
      title: AttentionItem
    AttentionSnapshot:
      properties:
        items:
          # No cap in the code: unpaginated owner-scoped list
          items:
            $ref: '#/components/schemas/AttentionItem'
          type: array
          title: Items
        count:
          type: integer
          title: Count
          default: 0
        sessions:
          # No cap in the code: unpaginated owner-scoped list
          items:
            $ref: '#/components/schemas/Session'
          type: array
          title: Sessions
      type: object
      title: AttentionSnapshot
    CapabilityResult:
      properties:
        capability:
          type: string
          minLength: 1
          title: Capability
        state:
          $ref: '#/components/schemas/CapabilityState'
          default: unknown
        scope:
          type: string
          enum:
            - fixture
            - live
            - unverified
          title: Scope
          default: unverified
        evidence_ref:
          anyOf:
            - type: string
              minLength: 1
            - type: 'null'
          title: Evidence Ref
        detail:
          anyOf:
            - type: string
            - type: 'null'
          title: Detail
      additionalProperties: false
      type: object
      required:
        - capability
      title: CapabilityResult
    CapabilityState:
      type: string
      enum:
        - proved
        - partial
        - unsupported
        - unknown
      title: CapabilityState
    ChatRequest:
      properties:
        message:
          type: string
          title: Message
          description: User message
        conversation_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Conversation Id
          description: Existing conversation ID
      type: object
      required:
        - message
      title: ChatRequest
      description: Request model for sending a message.
    ChatResponse:
      properties:
        conversation_id:
          type: string
          title: Conversation Id
        message:
          anyOf:
            - $ref: '#/components/schemas/Message'
            - type: 'null'
        spawned_session_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Spawned Session Id
        pending:
          type: boolean
          title: Pending
          default: false
        delivery_message_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Delivery Message Id
      type: object
      required:
        - conversation_id
      title: ChatResponse
      description: Response model for chat interaction.
    CommitSummary:
      properties:
        sha:
          type: string
          title: Sha
        message:
          type: string
          title: Message
        author:
          type: string
          title: Author
        date:
          type: string
          format: date-time
          title: Date
        url:
          type: string
          title: Url
      type: object
      required:
        - sha
        - message
        - author
        - date
        - url
      title: CommitSummary
      description: Summary of a commit.
    Conversation:
      properties:
        id:
          type: string
          title: Id
          description: Unique conversation ID
        user_id:
          type: string
          title: User Id
          description: Owner ID (the single configured owner)
        title:
          anyOf:
            - type: string
            - type: 'null'
          title: Title
          description: Conversation title
        summary:
          anyOf:
            - type: string
            - type: 'null'
          title: Summary
          description: Compacted summary of older messages
        summarized_through_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Summarized Through Id
          description: ID of last message included in summary
        message_count:
          type: integer
          title: Message Count
          description: Total message count for compaction threshold
          default: 0
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: Last update timestamp
      type: object
      required:
        - id
        - user_id
      title: Conversation
      description: A conversation thread.
    ConversationResponse:
      properties:
        conversation:
          $ref: '#/components/schemas/Conversation'
        messages:
          # No cap in the code: unpaginated owner-scoped list
          items:
            $ref: '#/components/schemas/Message'
          type: array
          title: Messages
      type: object
      required:
        - conversation
      title: ConversationResponse
      description: Response model for conversation with messages.
    CreateWorkspaceRequest:
      properties:
        project_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Project Id
        repo:
          anyOf:
            - type: string
            - type: 'null'
          title: Repo
        branch:
          type: string
          title: Branch
          default: ''
        ref:
          type: string
          title: Ref
          default: ''
        depth:
          type: integer
          maximum: 1000.0
          minimum: 0.0
          title: Depth
          default: 0
        dev:
          $ref: '#/components/schemas/WorkspaceDev'
          default:
            ports: []
            idle_timeout_minutes: 30
        agent_kind:
          type: string
          maxLength: 80
          minLength: 1
          pattern: ^[a-z][a-z0-9_-]*$
          title: Agent Kind
          default: claude
      additionalProperties: false
      type: object
      title: CreateWorkspaceRequest
    DefinitionReference:
      properties:
        repository:
          type: string
          maxLength: 2048
          minLength: 1
          title: Repository
        commit_sha:
          type: string
          pattern: ^[0-9a-f]{40}$
          title: Commit Sha
        path:
          type: string
          maxLength: 1024
          minLength: 1
          title: Path
      additionalProperties: false
      type: object
      required:
        - repository
        - commit_sha
        - path
      title: DefinitionReference
    GrantRequest:
      properties:
        permission:
          type: string
          enum:
            - use
            - derive
          title: Permission
      additionalProperties: false
      type: object
      required:
        - permission
      title: GrantRequest
    HITLDecisionInput:
      properties:
        action_id:
          type: string
          maxLength: 2048
          minLength: 1
          title: Action Id
        response:
          oneOf:
            - $ref: '#/components/schemas/ToolApprovalResponse'
            - $ref: '#/components/schemas/AskUserResponse'
          title: Response
          discriminator:
            propertyName: type
            mapping:
              ask_user_response: '#/components/schemas/AskUserResponse'
              tool_approval_response: '#/components/schemas/ToolApprovalResponse'
      additionalProperties: false
      type: object
      required:
        - action_id
        - response
      title: HITLDecisionInput
    HTTPValidationError:
      properties:
        detail:
          # No cap in the code: FastAPI-generated validation error list
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    TopicLine:
      type: object
      properties:
        name:
          type: string
        status_line:
          type: string
        pending:
          type: integer
          minimum: 0
          description: Open pending records in the topic.
      required:
        - name
        - status_line
        - pending
      additionalProperties: false
    MainThreadInfo:
      properties:
        mode:
          type: string
          title: Mode
        session_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Session Id
        conversation_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Conversation Id
        native:
          anyOf:
            - $ref: '#/components/schemas/NativeSessionInfo'
            - type: 'null'
        topics:
          # No cap in the code: unpaginated owner-scoped list
          items:
            $ref: '#/components/schemas/TopicLine'
          type: array
          title: Topics
          default: []
      type: object
      required:
        - mode
      title: MainThreadInfo
    MergePolicy:
      type: string
      enum:
        - auto
        - approval
      title: MergePolicy
    MergePolicyUpdate:
      properties:
        merge_policy:
          $ref: '#/components/schemas/MergePolicy'
        expected_version:
          type: integer
          minimum: 1.0
          title: Expected Version
      additionalProperties: false
      type: object
      required:
        - merge_policy
        - expected_version
      title: MergePolicyUpdate
    MergePolicyView:
      properties:
        writes_enabled:
          type: boolean
          title: Writes Enabled
          default: false
        merge_policy:
          $ref: '#/components/schemas/MergePolicy'
        merge_policy_version:
          type: integer
          minimum: 1.0
          title: Merge Policy Version
        protected_globs:
          items:
            type: string
          type: array
          title: Protected Globs
          default:
            - k8s/**
            - .github/**
            - '**/migrations/**'
          maxItems: 3
        protected_globs_version:
          type: integer
          const: 1
          title: Protected Globs Version
          default: 1
      type: object
      required:
        - merge_policy
        - merge_policy_version
      title: MergePolicyView
    Message:
      properties:
        id:
          type: string
          title: Id
          description: Unique message ID
        conversation_id:
          type: string
          title: Conversation Id
          description: Parent conversation ID
        role:
          type: string
          enum:
            - user
            - assistant
          title: Role
          description: Message role
        content:
          type: string
          title: Content
          description: Message content
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Creation timestamp
      type: object
      required:
        - id
        - conversation_id
        - role
        - content
      title: Message
      description: A single message in a conversation.
    NativeDeliveryInfo:
      properties:
        message_id:
          type: string
          title: Message Id
        state:
          type: string
          title: State
          description: queued|recorded|sending|delivered|completed|uncertain|failed|cancelled
        task_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Task Id
        evidence_ref:
          anyOf:
            - type: string
            - type: 'null'
          title: Evidence Ref
        detail:
          anyOf:
            - type: string
            - type: 'null'
          title: Detail
        source:
          type: string
          title: Source
          default: user
      type: object
      required:
        - message_id
        - state
      title: NativeDeliveryInfo
      description: Delivery ledger row for one message sent to a native agent.
    NativeSessionInfo:
      properties:
        session_id:
          type: string
          title: Session Id
        kind:
          type: string
          maxLength: 80
          minLength: 1
          pattern: ^[a-z][a-z0-9_-]*$
          title: Kind
        role:
          type: string
          title: Role
          default: agent
        parent_session_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Parent Session Id
        topic:
          anyOf:
            - type: string
            - type: 'null'
          title: Topic
        agent_name:
          type: string
          title: Agent Name
        kagent_session_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Kagent Session Id
        session_state:
          anyOf:
            - type: string
            - type: 'null'
          title: Session State
        model:
          anyOf:
            - type: string
            - type: 'null'
          title: Model
        turns:
          type: integer
          title: Turns
          default: 0
        turn_in_flight:
          type: boolean
          title: Turn In Flight
          default: false
        deliveries:
          # No cap in the code: unpaginated owner-scoped list
          items:
            $ref: '#/components/schemas/NativeDeliveryInfo'
          type: array
          title: Deliveries
        note:
          anyOf:
            - type: string
            - type: 'null'
          title: Note
      type: object
      required:
        - session_id
        - kind
        - agent_name
      title: NativeSessionInfo
      description: Identity strip for a session bound to a native agent session in kagent.
    Project:
      properties:
        id:
          type: string
          title: Id
          description: Unique project ID
        user_id:
          type: string
          title: User Id
          description: User who owns this project
        merge_policy:
          $ref: '#/components/schemas/MergePolicy'
          default: auto
        merge_policy_version:
          type: integer
          minimum: 1.0
          title: Merge Policy Version
          default: 1
        owner:
          type: string
          title: Owner
          description: GitHub owner/org
        name:
          type: string
          title: Name
          description: Repository name
        full_name:
          type: string
          title: Full Name
