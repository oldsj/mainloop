# trunk-ignore-begin(checkov/CKV_OPENAPI_4,checkov/CKV_OPENAPI_5): no global security scheme; auth is
# network reachability plus the Host/Origin guards, so the empty security list is intended.
# Mainloop API contract, v1 (OpenAPI 3.1). Source of truth for the Go server and the React client.
# Exported from the Python app, then typed: every response has a schema, errors are HTTPError or
# TaskError, and Pydantic limits are copied in.
# Auth is not an HTTP security scheme: owner identity comes from network reachability plus the
# Host and Origin guards, so the root security requirement is empty on purpose.
openapi: 3.1.0
info:
  title: Mainloop API
  description: Mainloop control-plane API
  version: 0.2.0
servers:
  - url: /
security: []
# trunk-ignore-end(checkov/CKV_OPENAPI_4,checkov/CKV_OPENAPI_5)
tags:
  - name: health
    description: Liveness and orchestration-health rollups.
  - name: events
    description: Owner-scoped live update stream (server-sent events).
  - name: chat
    description: Main thread and chat delivery.
  - name: attention
    description: Needs-you items, activity and queue responses.
  - name: hitl
    description: Native approvals and questions, and observer status.
  - name: projects
    description: Projects, merge policy, provider preference and smoke data.
  - name: sessions
    description: Native-bound sessions and provider profiles.
  - name: workspaces
    description: Workspace lifecycle and preview ports.
  - name: environments
    description: Development environments, versions, grants and selection.
  - name: tasks
    description: Task reads, task operations and task actions.
  - name: schedules
    description: Scheduled agent runs proxied from kagent; schedules, triggers and executions.
