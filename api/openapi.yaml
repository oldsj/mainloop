    WorkerLimit:
      type: object
      additionalProperties: false
      description: >-
        A project's limit on worker tasks (every child task of the project, the standing
        supervisor's included) holding a slot at once (docs/specs/tasks.md#capacity).
      properties:
        project_id:
          type: string
        max_workers:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 100
            - type: 'null'
          description: The project's own limit, or null for the default.
        default_max_workers:
          type: integer
          minimum: 1
          description: The limit of a project that sets none (TASK_MAX_WORKERS_PER_PROJECT).
        effective_max_workers:
          type: integer
          minimum: 1
          description: >-
            The most workers the project can have: max_workers or else the default, capped by
            global_max_workers.
        global_max_workers:
          type: integer
          minimum: 1
          description: >-
            The owner-wide limit on child tasks across all projects (TASK_MAX_CHILDREN_GLOBAL). It
            applies as well; effective_max_workers is already capped by it. Other projects' workers
            count against it too.
