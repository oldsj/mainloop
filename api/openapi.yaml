        reason:
          anyOf:
            - type: string
            - type: 'null'
        version:
          type: integer
        current_attempt_id:
          anyOf:
            - type: string
            - type: 'null'
        held_attempt_id:
          type: string
        attempt_state:
          type: string
      required:
        - task_id
        - title
        - status
        - reason
        - version
        - current_attempt_id
        - held_attempt_id
        - attempt_state
      additionalProperties: false
    TaskError:
