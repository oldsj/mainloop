            - type: 'null'
          title: Started At
          description: Start timestamp
        completed_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Completed At
          description: Completion timestamp
        archived_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Archived At
          description: When the session was cleared from the list; kept for audit, never deleted
        summary:
          anyOf:
            - type: string
            - type: 'null'
          title: Summary
          description: Summary posted to main thread on completion
        error:
          anyOf:
