            minLength: 1
            maxLength: 4096
          title: Command
          description: >-
            argv of the service; the first element is resolved through PATH in the workspace's
            environment. Empty declares no service. A workspace runs it through env(1) with
            MAINLOOP_WORKSPACE_ID and MAINLOOP_PREVIEW_URLS (`<port>=<url>` per declared port,
            comma-separated) set, which is why it takes at most 61 arguments.
