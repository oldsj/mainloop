      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /environments/{environment_id}/versions:
    get:
      tags:
        - environments
      summary: Versions
      operationId: listEnvironmentVersions
      parameters:
        - name: environment_id
          in: path
          required: true
          schema:
            type: string
            title: Environment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /environments/{environment_id}/versions/{version_id}:
    get:
      tags:
        - environments
