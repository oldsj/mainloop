  /hitl/{request_id}/merge/{proposal_id}/details:
    get:
      tags:
        - hitl
      summary: Get Hitl Merge Details
      description: Read bounded, immutable proposal details for this owner's exact HITL card.
      operationId: getHITLMergeDetails
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
            title: Request Id
        - name: proposal_id
          in: path
          required: true
          schema:
            type: string
            title: Proposal Id
        - name: section
          in: query
          required: true
          schema:
            enum:
              - description
              - files
              - checks
            type: string
            title: Section
        - name: cursor
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
            title: Cursor
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 50
            minimum: 1
            default: 50
            title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
