        - session_id
        - message_id
        - delivery
        - reopened
        - version
      title: TaskFollowUpResult
    TaskCheckout:
      properties:
        branch:
          type: string
          maxLength: 255
          minLength: 1
          title: Branch
        ref:
          type: string
          maxLength: 255
          title: Ref
          default: ''
        depth:
          type: integer
          maximum: 1000.0
          minimum: 0.0
          title: Depth
          default: 0
      additionalProperties: false
      type: object
      required:
        - branch
      title: TaskCheckout
    TaskCreate:
      properties:
        request_id:
          type: string
          maxLength: 100
          minLength: 1
          title: Request Id
        title:
          type: string
          maxLength: 200
          minLength: 1
          title: Title
        brief:
          type: string
          maxLength: 16384
          minLength: 1
          title: Brief
        mode:
          type: string
          enum:
            - code
            - coordination
          title: Mode
        project_id:
          anyOf:
            - type: string
              maxLength: 100
              minLength: 1
            - type: 'null'
          title: Project Id
        topic_id:
          anyOf:
            - type: string
              maxLength: 100
              minLength: 1
            - type: 'null'
          title: Topic Id
        provider_profile_id:
          anyOf:
            - type: string
              maxLength: 80
              minLength: 1
              pattern: ^[a-z][a-z0-9_-]*$
            - type: 'null'
          title: Provider Profile Id
        model:
          anyOf:
            - type: string
              pattern: ^[A-Za-z0-9._:/-]{1,200}$
            - type: 'null'
          title: Model
          description: >-
            One of the resolved provider profile's models. Unset keeps the profile's
            default_model. 422 with the allowed models if the profile does not offer it.
        effort:
          anyOf:
            - $ref: '#/components/schemas/EffortLevel'
            - type: 'null'
          title: Effort
          description: >-
            One of the resolved provider profile's effort_levels. Unset keeps the profile's
            default_effort. 422 with the allowed levels if the profile does not offer it.
        checkout:
          anyOf:
            - $ref: '#/components/schemas/TaskCheckout'
            - type: 'null'
        web_fetch:
          type: boolean
          default: false
          title: Web Fetch
          description: >-
            Give every attempt of this task the open-web web_fetch MCP tool
            (docs/specs/web-fetch.md). Its child tasks do not inherit it.
      additionalProperties: false
      type: object
      required:
        - request_id
        - title
        - brief
        - mode
      title: TaskCreate
    TaskReassign:
      properties:
        request_id:
          type: string
          maxLength: 100
          minLength: 1
          title: Request Id
        expected_version:
          type: integer
          minimum: 1.0
          title: Expected Version
        expected_attempt_id:
          anyOf:
            - type: string
              maxLength: 100
              minLength: 1
            - type: 'null'
          title: Expected Attempt Id
        target_profile_id:
          type: string
          maxLength: 80
          minLength: 1
          pattern: ^[a-z][a-z0-9_-]*$
          title: Target Profile Id
      additionalProperties: false
      type: object
      required:
        - request_id
        - expected_version
        - expected_attempt_id
        - target_profile_id
      title: TaskReassign
    ToolApproval:
      properties:
        id:
          type: string
          maxLength: 2048
          minLength: 1
          title: Id
        approved:
          type: boolean
          title: Approved
        rejection_reason:
          anyOf:
            - type: string
              maxLength: 8192
            - type: 'null'
          title: Rejection Reason
      additionalProperties: false
      type: object
      required:
        - id
        - approved
      title: ToolApproval
    ToolApprovalResponse:
      properties:
        type:
          type: string
          const: tool_approval_response
          title: Type
        approvals:
          items:
            $ref: '#/components/schemas/ToolApproval'
          type: array
          maxItems: 100
          minItems: 1
          title: Approvals
        reviewed_context:
          additionalProperties:
            type: string
            pattern: ^[0-9a-f]{64}$
          propertyNames:
            maxLength: 2048
            minLength: 1
          type: object
          maxProperties: 100
          title: Reviewed Context
      additionalProperties: false
      type: object
      required:
        - type
        - approvals
      title: ToolApprovalResponse
    ValidationError:
      properties:
        loc:
          # no cap in the code: FastAPI-generated error location path
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
    WorkspaceDev:
      properties:
        ports:
          # no cap in the code: ports are unique per workspace, but their number is not limited.
          # No default: the request validator fills defaults in, and an empty list would replace
          # the project's ports.
          items:
            $ref: '#/components/schemas/WorkspacePort'
          type: array
          title: Ports
          description: The workspace's preview ports. Absent, the workspace takes its project's workspace-service ports; an empty list declares none.
        idle_timeout_minutes:
          type: integer
          description: Recorded only. kagent decides when an idle runtime sleeps; Mainloop no longer suspends a workspace after this time.
          maximum: 1440.0
          minimum: 1.0
          title: Idle Timeout Minutes
          default: 30
      additionalProperties: false
      type: object
      title: WorkspaceDev
      description: 'Dev server settings: which ports the preview URL may reach, and when to idle out.'
    WorkspaceEnvironment:
      properties:
        environment_id:
          type: string
          title: Environment Id
        version_id:
          type: string
          title: Version Id
        image:
          type: string
          maxLength: 512
          pattern: ^[A-Za-z0-9][A-Za-z0-9./_:-]*@sha256:[a-f0-9]{64}$
          title: Image
        platform:
          type: string
          pattern: ^linux/(amd64|arm64)$
          title: Platform
        policy_identity:
          type: string
          maxLength: 256
          minLength: 1
          title: Policy Identity
      additionalProperties: false
      type: object
      required:
        - environment_id
        - version_id
        - image
        - platform
        - policy_identity
      title: WorkspaceEnvironment
    WorkspaceLifecycle:
      properties:
        workspace_id:
          type: string
          minLength: 1
          title: Workspace Id
        session_id:
          type: string
          minLength: 1
          title: Session Id
        publication_mode:
          type: string
          enum:
            - read_only
            - branch
          title: Publication Mode
          default: read_only
        publication_reason:
          anyOf:
            - type: string
              enum:
                - default_branch
                - protected_branch
                - missing_metadata
                - no_grant
                - disabled
            - type: 'null'
          title: Publication Reason
          default: disabled
        observed_state:
          $ref: '#/components/schemas/WorkspaceObservedState'
        detail:
          anyOf:
            - type: string
            - type: 'null'
          title: Detail
        manifest:
          $ref: '#/components/schemas/WorkspaceManifest'
        last_activity_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Last Activity At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      additionalProperties: false
      type: object
      required:
        - workspace_id
        - session_id
        - observed_state
        - manifest
        - updated_at
        - publication_mode
        - publication_reason
        - detail
        - last_activity_at
      title: WorkspaceLifecycle
      description: A workspace as last observed from kagent. Nothing here is stored except the manifest.
    WorkspaceManifest:
      properties:
        repo_url:
          type: string
          maxLength: 2048
          minLength: 1
          title: Repo Url
        ref:
          type: string
          maxLength: 255
          title: Ref
          default: ''
        branch:
          type: string
          maxLength: 255
          minLength: 1
          title: Branch
        depth:
          type: integer
          maximum: 1000.0
          minimum: 0.0
          title: Depth
          default: 0
        agent_kind:
          type: string
          maxLength: 80
          minLength: 1
          pattern: ^[a-z][a-z0-9_-]*$
          title: Agent Kind
          default: claude
        dev:
          $ref: '#/components/schemas/WorkspaceDevOutput'
          default:
            ports: []
            idle_timeout_minutes: 30
        development_environment:
          anyOf:
            - $ref: '#/components/schemas/WorkspaceEnvironment'
            - type: 'null'
      additionalProperties: false
      type: object
      required:
        - repo_url
        - branch
        - ref
        - depth
        - agent_kind
        - dev
        - development_environment
      title: WorkspaceManifest
      description: |-
        What kagent clones into the harness (``repo_url``/``ref``/``branch``/``depth``), which
        agent runs there, and the dev server settings.

        The repository fields are the Session's ``workspace``. They are stored once and resent
        unchanged if the Session is replaced.
    WorkspaceObservedState:
      type: string
      description: |-
        `running`: the Session is ready and its runtime is awake. `suspended`: the Session is ready
        and asleep; kagent parks an idle runtime itself, and the next message, preview or live attach
        wakes it (there is no suspend or resume request). `resuming`: starting, or kagent is doing its
        own brief lifecycle work. `suspending` is no longer reported.
      enum:
        - running
        - suspending
        - suspended
        - resuming
        - failed
        - unknown
      title: WorkspaceObservedState
    WorkspacePort:
      properties:
        name:
          type: string
          minLength: 1
          pattern: ^[a-z][a-z0-9-]{0,31}$
          title: Name
        number:
          type: integer
          maximum: 65535.0
          minimum: 1.0
          title: Number
      additionalProperties: false
      type: object
      required:
        - name
        - number
      title: WorkspacePort
    HTTPError:
      type: object
      properties:
        detail:
          type: string
          description: Human-readable error message.
      required:
        - detail
      additionalProperties: false
      description: 'FastAPI HTTPException body: `{detail: string}`.'
    CodedHTTPError:
      type: object
      properties:
        detail:
          type: string
          description: Human-readable error message.
        code:
          type: string
          enum:
            - busy
            - pending
            - unconfirmed
            - unresolved
            - agent_unavailable
          description: >-
            Stable machine code for a refused main-thread provider switch or a message refused
            because one is pending; absent on other conflicts. `busy`: the main has open work or
            changed while the request ran. `pending`: a switch is pending and the request needs it
            settled or recoverable first. `unconfirmed`: kagent could not confirm the main idle, the
            old Session suspended, or the pending target absent. `unresolved`: a native create for
            the main is unresolved. `agent_unavailable`: the target Agent is missing or not ready.
      required:
        - detail
      additionalProperties: false
      description: '`{detail: string}` with an optional stable `code`.'
    TaskErrorDetail:
      type: object
      properties:
        reason:
          type: string
          description: Stable machine code, for example stale_task_attempt.
        limit:
          type: integer
          description: parent_capacity only.
        held_tasks:
          # no cap in the code: bounded by `limit`, which is configuration
          type: array
          items:
            $ref: '#/components/schemas/TaskCapacityHolder'
          description: 'parent_capacity only: tasks holding the capacity.'
        recovery:
          type: string
          description: 'parent_capacity only: how to free capacity.'
        allowed_models:
          type: array
          items:
            type: string
          description: "model_unavailable only: the resolved profile's offered model ids."
        allowed_effort_levels:
          type: array
          items:
            $ref: '#/components/schemas/EffortLevel'
          description: "effort_unavailable only: the resolved profile's offered effort levels."
      required:
        - reason
      additionalProperties: true
      description: Task error payload. `reason` is always present; some reasons add detail fields.
    TaskCapacityHolder:
      type: object
      properties:
        task_id:
          type: string
        title:
          anyOf:
            - type: string
            - type: 'null'
        status:
          type: string
        reason:
          anyOf:
            - type: string
            - type: 'null'
        version:
          type: integer
        current_attempt_id:
          anyOf:
            - type: string
            - type: 'null'
        held_attempt_id:
          type: string
        attempt_state:
          type: string
      required:
        - task_id
        - title
        - status
        - reason
        - version
        - current_attempt_id
        - held_attempt_id
        - attempt_state
      additionalProperties: false
    TaskLoopList:
      type: object
      additionalProperties: false
      properties:
        loops:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/TaskLoop'
      required:
        - loops
    TaskLoop:
      type: object
      additionalProperties: false
      description: A durable wake-up armed by main or a supervisor (docs/specs/loops.md).
      properties:
        id:
          type: string
        state:
          type: string
          enum:
            - armed
            - paused
            - done
            - exhausted
            - expired
            - stopped
            - ended
        trigger:
          type: string
          enum:
            - task
            - pull_request
            - quiet
            - time
        task_id:
          description: The task it watches; null for a time loop without one.
          anyOf:
            - type: string
            - type: 'null'
        recipient:
          type: string
          enum:
            - main
            - supervisor
          description: Who it wakes, main or the supervisor of recipient_task_id.
        recipient_task_id:
          description: The supervisor's task, for recipient supervisor.
          anyOf:
            - type: string
            - type: 'null'
        note:
          type: string
          maxLength: 2000
        statuses:
          type: array
          maxItems: 7
          items:
            type: string
        pr_conditions:
          type: array
          maxItems: 4
          items:
            type: string
            enum:
              - ci_success
              - ci_failure
              - merged
              - closed
        every_minutes:
          anyOf:
            - type: integer
            - type: 'null'
        quiet_minutes:
          anyOf:
            - type: integer
            - type: 'null'
        expect_change:
          type: boolean
        stop_reason:
          description: no_progress when a loop armed with expect_change stopped for finding its task unchanged.
          anyOf:
            - type: string
              enum:
                - no_progress
            - type: 'null'
        firings:
          type: integer
        max_firings:
          type: integer
        min_interval_seconds:
          type: integer
        next_fire_at:
          description: A live time loop's next timer, or a live quiet loop's next fire if its task stays unchanged; null for a loop that waits on a change.
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        last_fired_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        recent_firings:
          type: array
          maxItems: 5
          description: The latest firings, newest first.
          items:
            $ref: '#/components/schemas/LoopFiring'
      required:
        - id
        - state
        - trigger
        - task_id
        - recipient
        - recipient_task_id
        - note
        - statuses
        - pr_conditions
        - every_minutes
        - quiet_minutes
        - expect_change
        - stop_reason
        - firings
        - max_firings
        - min_interval_seconds
        - next_fire_at
        - last_fired_at
        - expires_at
        - created_at
        - updated_at
        - recent_firings
    LoopFiring:
      type: object
      additionalProperties: false
      properties:
        number:
          type: integer
        facts:
          type: array
          maxItems: 10
          items:
            type: string
        folded:
          type: integer
          description: Occurrences folded in beyond the facts kept.
        delivery_state:
          type: string
          enum:
            - pending
            - queued
            - delivered
            - uncertain
            - cancelled
        stops_loop:
          anyOf:
            - type: string
              enum:
                - no_progress
            - type: 'null'
        created_at:
          type: string
          format: date-time
      required:
        - number
        - facts
        - folded
        - delivery_state
        - stops_loop
        - created_at
    LoopFireRequest:
      type: object
      additionalProperties: false
      properties:
        request_id:
          type: string
          maxLength: 100
          minLength: 1
          description: The same id again fires nothing more.
      required:
        - request_id
    TaskError:
      type: object
      properties:
        detail:
          $ref: '#/components/schemas/TaskErrorDetail'
      required:
        - detail
      additionalProperties: false
      description: 'Task route error body: `{detail: {reason, ...}}`. Raised as TaskError in the store.'
    StatusOk:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
      required:
        - status
      additionalProperties: false
      description: Acknowledgement.
    QueueRespondResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
        message:
          type: string
          enum:
            - Response sent
      required:
        - status
        - message
      additionalProperties: false
    SessionMessageResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - queued
            - steered
          description: '`queued`: recorded durably behind an open turn, and delivered in its own turn once that one ends; `ok`: admitted at once; `steered`: recorded to join the running turn (if it cannot, it runs as the next turn).'
        message_id:
          type: string
      required:
        - status
        - message_id
      additionalProperties: false
    SessionCancelResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - completed
            - failed
            - cancelled
          description: Session status after the call; the unchanged status when it had already finished.
        agent:
          type: string
          enum:
            - stopped
            - not_running
            - unknown
          description: '`not_running` when the session had already finished; otherwise the runtime outcome.'
      required:
        - status
        - agent
      additionalProperties: false
    SessionStopTurnResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - stopped
            - finished
            - no_open_turn
      required:
        - status
      additionalProperties: false
    SessionDotfilesRefreshRequest:
      type: object
      properties:
        request_id:
          type: string
          format: uuid
          description: Idempotency key chosen by the caller; repeat it to retry the same refresh.
      required:
        - request_id
      additionalProperties: false
    SessionDotfilesRefresh:
      type: object
      description: One refresh of a session's agent dotfiles.
      properties:
        id:
          type: string
          maxLength: 64
          description: The refresh's request id.
        state:
          type: string
          enum:
            - pending
            - applied
            - failed
          description: |-
            `pending` until kagent holds the dotfiles (`applied`) or the refresh cannot apply
            (`failed`).
        reason:
          type: string
          enum:
            - ''
            - no_bundle
            - not_deliverable
            - session_gone
            - unsupported
          description: |-
            Why it failed, empty otherwise. `no_bundle`: the source gave no bundle (see the pin's
            `status` and `reason`). `not_deliverable`: the Session cannot download a bundle from
            Mainloop (no MCP credential). `session_gone`: the native Session it targeted no longer
            runs. `unsupported`: kagent cannot update a Session's dotfiles.
        dotfiles:
          anyOf:
            - $ref: '#/components/schemas/SessionDotfiles'
            - type: 'null'
          description: The dotfiles the refresh pinned; null until it has pinned them.
        created_at:
          type: string
          format: date-time
      required:
        - id
        - state
        - reason
        - dotfiles
        - created_at
      additionalProperties: false
    DotfilesHead:
      type: object
      description: A session's dotfiles source as it is now, and the commit its ref names.
      properties:
        repository:
          type: string
          maxLength: 140
        ref:
          type: string
          maxLength: 255
        path:
          type: string
          maxLength: 255
        commit:
          anyOf:
            - type: string
              pattern: ^[0-9a-f]{40}$
            - type: 'null'
          description: The commit `ref` names now; null when it could not be resolved (see `reason`).
        reason:
          type: string
          maxLength: 64
          description: Why `commit` is null; one of `app_not_installed`, `ref_not_found` or `repository_unavailable`.
      required:
        - repository
        - ref
        - path
        - commit
        - reason
      additionalProperties: false
    SessionDotfilesInfo:
      type: object
      properties:
        current:
          anyOf:
            - $ref: '#/components/schemas/SessionDotfiles'
            - type: 'null'
          description: The dotfiles the session's native Session holds; null when none were recorded.
        source:
          anyOf:
            - $ref: '#/components/schemas/DotfilesHead'
            - type: 'null'
          description: The source that applies to the session now; null when none does.
        behind:
          type: boolean
          description: Whether a refresh would give the Session other dotfiles than `current`.
        refreshable:
          type: boolean
          description: Whether POST /sessions/{session_id}/dotfiles/refresh applies to the session.
        refresh:
          anyOf:
            - $ref: '#/components/schemas/SessionDotfilesRefresh'
            - type: 'null'
          description: The session's latest refresh, if any.
      required:
        - current
        - source
        - behind
        - refreshable
        - refresh
      additionalProperties: false
    SessionRestartRequest:
      type: object
      properties:
        request_id:
          type: string
          format: uuid
          description: Idempotency key chosen by the caller; repeat it to retry the same restart.
      required:
        - request_id
      additionalProperties: false
    SessionRestartResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - restarted
            - no_native_session
        failed_message_ids:
          description: The open turns the restart settled as failed (their messages are not resent).
          type: array
          items:
            type: string
          maxItems: 100
      required:
        - status
        - failed_message_ids
      additionalProperties: false
    SessionArchiveResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - archived
      required:
        - status
      additionalProperties: false
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - healthy
        database:
          type: string
        revision:
          type: string
          description: Git commit the server image was built from; `dev` for an unstamped build.
      required:
        - status
        - database
      additionalProperties: false
      description: 'Liveness: `status` is always `healthy`; `database` is `ok` while the database answers.'
    HITLObserverDiagnostic:
      type: object
      properties:
        runtime_session_id:
          type: string
        detail:
          type: string
        observed_at:
          type: string
          format: date-time
      required:
        - runtime_session_id
        - detail
        - observed_at
      additionalProperties: false
    HITLObserverStatus:
      type: object
      properties:
        pending_task_count:
          type: integer
        oldest_task_check:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/HITLObserverDiagnostic'
          maxItems: 100
      required:
        - pending_task_count
        - oldest_task_check
        - diagnostics
      additionalProperties: false
    WorkspacePreviewPort:
      type: object
      properties:
        port:
          type: integer
          minimum: 1
          maximum: 65535
        name:
          type: string
        url:
          type: string
      required:
        - port
        - name
        - url
      additionalProperties: false
    PreviewGrantRequest:
      type: object
      properties:
        path:
          type: string
          maxLength: 2048
          description: Path (with query) on the preview host to open after sign-in. Must start with a single `/`. Defaults to `/`.
      additionalProperties: false
    PreviewGrant:
      type: object
      properties:
        url:
          type: string
          description: The preview host's sign-in URL, carrying the one-minute sign-in in its fragment. Open it as a top-level navigation.
        expires_at:
          type: string
          format: date-time
      required:
        - url
        - expires_at
      additionalProperties: false
    WorkspacePortsResponse:
      type: object
      properties:
        ports:
          # no cap in the code: mirrors the workspace's configured ports; not limited
          type: array
          items:
            $ref: '#/components/schemas/WorkspacePreviewPort'
      required:
        - ports
      additionalProperties: false
    RegisteredEnvironment:
      type: object
      properties:
        environment:
          $ref: '#/components/schemas/DevEnvironment'
        version:
          $ref: '#/components/schemas/EnvironmentVersion'
      required:
        - environment
        - version
      additionalProperties: false
    SmokeDelivery:
      type: object
      properties:
        message_id:
          type: string
        state:
          type: string
      required:
        - message_id
        - state
      additionalProperties: false
    Device:
      type: object
      description: A registered device. Only public facts; no key material beyond the key's thumbprint.
      properties:
        id:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 100
        platform:
          type: string
          enum: [ios]
        key_thumbprint:
          type: string
          description: RFC 7638 SHA-256 thumbprint of the request key, unpadded base64url.
          maxLength: 64
        created_at:
          type: string
          format: date-time
        last_seen_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        revoked_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        current:
          type: boolean
          description: True when this request was signed by this device.
        push:
          description: The device's APNs token, if it set one. Null when it has none.
          anyOf:
            - $ref: '#/components/schemas/DevicePush'
            - type: 'null'
        approval_key:
          description: >-
            The device's Touch ID approval key, registered with the device; null for a device
            registered without one. Public: the owner pins it in the executor's configuration.
          anyOf:
            - $ref: '#/components/schemas/DeviceApprovalKey'
            - type: 'null'
      required:
        - id
        - name
        - platform
        - key_thumbprint
        - created_at
        - last_seen_at
        - revoked_at
        - current
        - push
        - approval_key
      additionalProperties: false
    DeviceApprovalKey:
      type: object
      description: A device's approval key, which signs approvals of privileged actions behind Touch ID.
      properties:
        thumbprint:
          type: string
          description: RFC 7638 SHA-256 thumbprint of the key, unpadded base64url.
          maxLength: 64
        jwk:
          $ref: '#/components/schemas/DeviceKey'
      required:
        - thumbprint
        - jwk
      additionalProperties: false
    DevicePush:
      type: object
      description: A device's APNs token, without the token itself.
      properties:
        environment:
          $ref: '#/components/schemas/APNsEnvironment'
        updated_at:
          type: string
          format: date-time
        invalid_at:
          description: When APNs said the token is no longer valid; pushes stop until the device sets a new one.
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
      required:
        - environment
        - updated_at
        - invalid_at
      additionalProperties: false
    DeviceWebSession:
      type: object
      description: A device's web session; the token is shown once.
      required:
        - cookie_name
        - token
        - expires_at
      properties:
        cookie_name:
          type: string
          description: The cookie the web view sends the token in.
          example: mainloop-device
        token:
          type: string
          description: The session's secret, 43 base64url characters. Set it HttpOnly and Secure.
          minLength: 32
          maxLength: 128
        expires_at:
          type: string
          format: date-time
    DevicePushRegistration:
      type: object
      description: An APNs device token, as the app received it, in lower-case hex.
      properties:
        token:
          type: string
          pattern: '^[0-9a-f]{64,200}$'
          minLength: 64
          maxLength: 200
        environment:
          $ref: '#/components/schemas/APNsEnvironment'
      required:
        - token
        - environment
      additionalProperties: false
    APNsEnvironment:
      type: string
      description: The APNs environment the app was built for (its aps-environment entitlement).
      enum: [development, production]
    DeviceKey:
      type: object
      description: A P-256 public key as a JWK (RFC 7517), coordinates unpadded base64url.
      properties:
        kty:
          type: string
          enum: [EC]
        crv:
          type: string
          enum: [P-256]
        x:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
        y:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
      required:
        - kty
        - crv
        - x
        - y
      additionalProperties: false
    DeviceRegistration:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        platform:
          type: string
          enum: [ios]
        request_key:
          $ref: '#/components/schemas/DeviceKey'
        approval_key:
          description: >-
            A second key, which signs approvals of privileged actions and needs Touch ID for each
            signature. Optional; it must differ from the request key and can't be added later.
          $ref: '#/components/schemas/DeviceKey'
      required:
        - name
        - platform
        - request_key
      additionalProperties: false
    DevloopLease:
      type: object
      properties:
        status:
          type: string
          enum: [free, acquired, queued]
        holder_session:
          type: string
        acquired_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        idle_timeout_seconds:
          type: integer
        queue_length:
          type: integer
      required:
        - status
        - idle_timeout_seconds
        - queue_length
      additionalProperties: false
    DevloopOperation:
      type: object
      properties:
        id:
          type: string
        session_id:
          type: string
        commit_sha:
          type: string
        state:
          type: string
          enum: [pending, succeeded, failed, unknown]
        detail:
          type: string
          description: Why the sync failed, or what it is waiting on.
        health_ok:
          type: boolean
          description: Whether mainloop-dev's backend reported healthy after the copy. Absent until the check ran.
        migrate_ok:
          type: boolean
          description: Whether migrate up succeeded after the copy. Absent until it ran.
        smoke:
          $ref: '#/components/schemas/DevloopSmoke'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - session_id
        - commit_sha
        - state
        - created_at
        - updated_at
      additionalProperties: false
    DevloopSmoke:
      type: object
      properties:
        passed:
          type: boolean
        summary:
          type: string
          description: The smoke run's own summary line, or the tail of its output when it failed.
      required:
        - passed
        - summary
      additionalProperties: false
    DevloopSyncPath:
      type: object
      description: >-
        One container a sync copies into: a repository subtree (prefix) lands at dest inside
        container, in the pod selector matches, excluding the listed paths under prefix.
      properties:
        selector:
          type: string
          description: A Kubernetes label selector identifying the pod, e.g. "app=mainloop-backend".
        container:
          type: string
        prefix:
          type: string
          description: The repository subtree this path copies from, relative to the project root.
        dest:
          type: string
          description: Where prefix lands inside container.
        exclude:
          type: array
          items:
            type: string
          description: >-
            Paths under prefix a copy never writes or deletes: a trailing slash excludes a
            top-level directory, anything else is a glob matched against a path's base name.
          default: []
      required:
        - selector
        - container
        - prefix
        - dest
      additionalProperties: false
    DevloopTargetKind:
      type: string
      enum: [namespace, vcluster]
      description: >-
        How to reach the target's Kubernetes location: a plain namespace, or a namespace inside a
        vcluster reached through its own API server.
    DevloopTarget:
      type: object
      description: >-
        A project's staging target: Mainloop-side configuration (never a file in the project's own
        repository) describing where its code runs and the commands dev_sync uses to bring it up
        to date. See docs/specs/devloop.md.
      properties:
        id:
          type: string
        project_id:
          type: string
        kind:
          $ref: '#/components/schemas/DevloopTargetKind'
        namespace:
          type: string
          description: >-
            The Kubernetes namespace the workload runs in for kind "namespace", or the host
            namespace holding the vcluster for kind "vcluster".
        vcluster_name:
          type: string
          description: Set only for kind "vcluster".
        vcluster_namespace:
          type: string
          description: The namespace inside the vcluster's own API server. Set only for kind "vcluster".
        vcluster_server:
          type: string
          description: >-
            Optional, kind "vcluster" only. Overrides the server the vcluster's own kubeconfig
            Secret names, for a vcluster whose exportKubeConfig.server only resolves from inside
            the vcluster's own pod (e.g. https://localhost:8443). Normally unset: the infra side
            should set the vcluster's exportKubeConfig.server to its in-cluster Service URL
            instead, which makes this override unnecessary.
        workload:
          type: string
          description: >-
            A label selector identifying the pod that restart_cmd, migrate_cmd, health_cmd and
            smoke_cmd run in, inside command_container.
        command_container:
          type: string
        sync_paths:
          type: array
          items:
            $ref: '#/components/schemas/DevloopSyncPath'
          default: []
        restart_cmd:
          type: string
          description: Run after copying, before migrate. Optional; a target without one skips this step.
        migrate_cmd:
          type: string
          description: Optional; a target without one skips this step.
        health_cmd:
          type: string
          description: >-
            Optional. The commit marker is always checked regardless; a target without a health
            command gets only that check, not a liveness probe.
        smoke_cmd:
          type: string
          description: Expected to be read-only. Optional; a target without one skips this step.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - project_id
        - kind
        - namespace
        - workload
        - command_container
        - sync_paths
        - created_at
        - updated_at
      additionalProperties: false
    DevloopTargetUpdate:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/DevloopTargetKind'
        namespace:
          type: string
        vcluster_name:
          type: string
        vcluster_namespace:
          type: string
        vcluster_server:
          type: string
        workload:
          type: string
        command_container:
          type: string
        sync_paths:
          type: array
          items:
            $ref: '#/components/schemas/DevloopSyncPath'
          default: []
        restart_cmd:
          type: string
        migrate_cmd:
          type: string
        health_cmd:
          type: string
        smoke_cmd:
          type: string
      required:
        - kind
        - namespace
        - workload
        - command_container
        - sync_paths
      additionalProperties: false
    SmokePush:
      type: object
      properties:
        request_id:
          type: string
        state:
          type: string
        branch:
          type: string
      required:
        - request_id
        - state
        - branch
      additionalProperties: false
    SmokeObservations:
      type: object
      properties:
        parent_capacity:
          type: integer
        capacity_holders:
          # no cap in the code: bounded by `parent_capacity`, which is configuration
          type: array
          items:
            type: string
        global_capacity_available:
          type: boolean
        deliveries_busy:
          type: boolean
        deliveries_truncated:
          type: boolean
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/SmokeDelivery'
          maxItems: 100
        push_confirmed:
          type: boolean
        pushes_truncated:
          type: boolean
        pushes:
          type: array
          items:
            $ref: '#/components/schemas/SmokePush'
          maxItems: 100
      required:
        - parent_capacity
        - capacity_holders
        - global_capacity_available
        - deliveries_busy
        - deliveries_truncated
        - deliveries
        - push_confirmed
        - pushes_truncated
        - pushes
      additionalProperties: false
      description: Sanitized ledger facts for an operator smoke run.
    DevEnvironment:
      additionalProperties: false
      properties:
        id:
          title: Id
          type: string
        owner_id:
          title: Owner Id
          type: string
        name:
          title: Name
          type: string
        source_kind:
          enum:
            - prebuilt_image
            - definition_repo
            - operator_default
          title: Source Kind
          type: string
        watched_tag:
          anyOf:
            - type: string
            - type: 'null'
          default: null
          title: Watched Tag
        follow_watched_tag:
          type: boolean
          title: Follow Watched Tag
        accepted_default_version_id:
          anyOf:
            - type: string
            - type: 'null'
          default: null
          title: Accepted Default Version Id
        definition:
          anyOf:
            - $ref: '#/components/schemas/DefinitionReference'
            - type: 'null'
          default: null
      required:
        - id
        - owner_id
        - name
        - source_kind
        - watched_tag
        - follow_watched_tag
        - accepted_default_version_id
        - definition
      title: DevEnvironment
      type: object
    PackageDeclaration:
      additionalProperties: false
      properties:
        manager:
          enum:
            - apt
            - apk
          title: Manager
          type: string
        packages:
          # no cap in the code: the model sets a minimum but no maximum
          items:
            $ref: '#/components/schemas/PackageSpec'
          minItems: 1
          title: Packages
          type: array
        policy_id:
          title: Policy Id
          type: string
        policy_version:
          minimum: 1
          title: Policy Version
          type: integer
        repositories:
          # no cap in the code: the model sets no limit
          items:
            type: string
          title: Repositories
          type: array
        generator_version:
          anyOf:
            - type: string
            - type: 'null'
          default: null
          title: Generator Version
        metadata_hashes:
          # no cap in the code: one digest per repository; the model sets no limit
          items:
            pattern: ^sha256:[0-9a-f]{64}$
            type: string
          title: Metadata Hashes
          type: array
        project_id:
          anyOf:
            - type: string
            - type: 'null'
          default: null
          title: Project Id
        task_id:
          anyOf:
            - type: string
            - type: 'null'
          default: null
          title: Task Id
      required:
        - manager
        - packages
        - policy_id
        - policy_version
        - repositories
        - generator_version
        - metadata_hashes
        - project_id
        - task_id
      title: PackageDeclaration
      type: object
    PackageSpec:
      additionalProperties: false
      properties:
        name:
          pattern: ^[a-z0-9][a-z0-9+.-]*(?::(?:amd64|arm64|all))?$
          title: Name
          type: string
        requested_version:
          anyOf:
            - pattern: ^[A-Za-z0-9.+:~_-]+$
              type: string
            - type: 'null'
          default: null
          title: Requested Version
        resolved_version:
          anyOf:
            - pattern: ^[A-Za-z0-9.+:~_-]+$
              type: string
            - type: 'null'
          default: null
          title: Resolved Version
      required:
        - name
        - requested_version
        - resolved_version
      title: PackageSpec
      type: object
    EnvironmentVersion:
      additionalProperties: false
      properties:
        id:
          title: Id
          type: string
        environment_id:
          title: Environment Id
          type: string
        registry:
          anyOf:
            - type: string
            - type: 'null'
          default: null
          title: Registry
        repository:
          anyOf:
            - type: string
            - type: 'null'
          default: null
          title: Repository
        index_digest:
          anyOf:
            - pattern: ^sha256:[0-9a-f]{64}$
              type: string
            - type: 'null'
          default: null
          title: Index Digest
        platform_manifest_digest:
          anyOf:
            - pattern: ^sha256:[0-9a-f]{64}$
              type: string
            - type: 'null'
          default: null
          title: Platform Manifest Digest
        config_digest:
          anyOf:
            - pattern: ^sha256:[0-9a-f]{64}$
              type: string
            - type: 'null'
          default: null
          title: Config Digest
        declared_user:
          anyOf:
            - type: string
            - type: 'null'
          default: null
          title: Declared User
        architecture:
          anyOf:
            - enum:
                - amd64
                - arm64
              type: string
            - type: 'null'
          default: null
          title: Architecture
        capability_profile:
          additionalProperties:
            type: string
          title: Capability Profile
          type: object
        validation_status:
          enum:
            - pending_build
            - static_validated
          title: Validation Status
          type: string
        validation_result:
          additionalProperties:
            type: string
          title: Validation Result
          type: object
        validator_version:
          title: Validator Version
          type: string
        provenance_kind:
          enum:
            - user_pushed
            - mainloop_built
            - operator
          title: Provenance Kind
          type: string
        base_provenance:
          default: unknown
          enum:
            - supplied
            - verified
            - unknown
          title: Base Provenance
          type: string
        parent_version_id:
          anyOf:
            - type: string
            - type: 'null'
          default: null
          title: Parent Version Id
        package_declaration:
          anyOf:
            - $ref: '#/components/schemas/PackageDeclaration'
            - type: 'null'
          default: null
        approval_reference:
          anyOf:
            - type: string
            - type: 'null'
          default: null
          title: Approval Reference
        definition:
          anyOf:
            - $ref: '#/components/schemas/DefinitionReference'
            - type: 'null'
          default: null
      required:
        - id
        - environment_id
        - validation_status
        - validator_version
        - provenance_kind
        - registry
        - repository
        - index_digest
        - platform_manifest_digest
        - config_digest
        - declared_user
        - architecture
        - capability_profile
        - validation_result
        - base_provenance
        - parent_version_id
        - package_declaration
        - approval_reference
        - definition
      title: EnvironmentVersion
      type: object
    ProjectEnvironmentGrant:
      additionalProperties: false
      properties:
        environment_id:
          title: Environment Id
          type: string
        project_id:
          title: Project Id
          type: string
        permission:
          enum:
            - use
            - derive
          title: Permission
          type: string
      required:
        - environment_id
        - project_id
        - permission
      title: ProjectEnvironmentGrant
      type: object
    ProjectEnvironmentSelection:
      additionalProperties: false
      properties:
        project_id:
          title: Project Id
          type: string
        environment_id:
          title: Environment Id
          type: string
        version_id:
          anyOf:
            - type: string
            - type: 'null'
          default: null
          title: Version Id
        follow_default:
          default: false
          title: Follow Default
          type: boolean
        revision:
          minimum: 1
          title: Revision
          type: integer
        access_revoked:
          default: false
          title: Access Revoked
          type: boolean
        resolved_version_id:
          anyOf:
            - type: string
            - type: 'null'
          default: null
          title: Resolved Version Id
      required:
        - project_id
        - environment_id
        - revision
        - version_id
        - follow_default
        - access_revoked
        - resolved_version_id
      title: ProjectEnvironmentSelection
      type: object
    OwnerDecision:
      additionalProperties: false
      description: An unresolved report request, independent of native attention observations.
      properties:
        attempt_id:
          maxLength: 100
          minLength: 1
          title: Attempt Id
          type: string
        report_id:
          maxLength: 100
          minLength: 1
          title: Report Id
          type: string
        action:
          maxLength: 4000
          minLength: 1
          title: Action
          type: string
      required:
        - attempt_id
        - report_id
        - action
      title: OwnerDecision
      type: object
    Task:
      additionalProperties: false
      properties:
        id:
          maxLength: 100
          minLength: 1
          title: Id
          type: string
        owner_id:
          maxLength: 100
          minLength: 1
          title: Owner Id
          type: string
        project_id:
          anyOf:
            - maxLength: 100
              minLength: 1
              type: string
            - type: 'null'
          default: null
          title: Project Id
        topic_id:
          anyOf:
            - maxLength: 100
              minLength: 1
              type: string
            - type: 'null'
          default: null
          title: Topic Id
        parent_task_id:
          anyOf:
            - maxLength: 100
              minLength: 1
              type: string
            - type: 'null'
          default: null
          title: Parent Task Id
        root_task_id:
          maxLength: 100
          minLength: 1
          title: Root Task Id
          type: string
        creator_binding_id:
          anyOf:
            - maxLength: 100
              minLength: 1
              type: string
            - type: 'null'
          default: null
          title: Creator Binding Id
        title:
          title: Title
          type: string
        brief:
          title: Brief
          type: string
        mode:
          enum:
            - code
            - coordination
          title: Mode
          type: string
        assigned_profile_id:
          maxLength: 80
          minLength: 1
          pattern: ^[a-z][a-z0-9_-]*$
          title: Assigned Profile Id
          type: string
        model:
          anyOf:
            - type: string
            - type: 'null'
          default: null
          title: Model
          description: >-
            The model the create request chose, validated against assigned_profile_id. Null
            means the profile's default_model.
        effort:
          anyOf:
            - $ref: '#/components/schemas/EffortLevel'
            - type: 'null'
          default: null
          description: >-
            The reasoning effort the create request chose, validated against
            assigned_profile_id. Null means the profile's default_effort.
        held_until:
          anyOf:
            - format: date-time
              type: string
            - type: 'null'
          default: null
          title: Held Until
          description: >-
            Set while the main thread has the task on hold. A held task is left out of the
            owner's Working and Needs you views until then; the hold ends early when the task
            fails, blocks or ends, or something needs the owner about it.
        held_reason:
          anyOf:
            - maxLength: 500
              type: string
            - type: 'null'
          default: null
          title: Held Reason
          description: Why the main thread put the task on hold, in its own words.
        capacity_tier:
          enum:
            - base
            - overflow
          default: base
          title: Capacity Tier
          type: string
          description: >-
            Which part of the global child limit admission last gave this task a slot in: base
            (TASK_MAX_CHILDREN_GLOBAL) or overflow (TASK_MAX_CHILDREN_OVERFLOW, above base). Root
            tasks and every task while the overflow tier is 0 are base.
        runtime_wait_since:
          anyOf:
            - format: date-time
              type: string
            - type: 'null'
          default: null
          title: Runtime Wait Since
          description: >-
            Set while an overflow-tier task waits for runtime capacity: from when it was given
            its slot (or its attempt was replaced) until kagent first accepts a message for its
            current attempt. A send kagent refuses meanwhile is retried, not failed. A task still
            waiting after TASK_OVERFLOW_WAIT_SECONDS fails and its slot is released.
        selection_source:
          enum:
            - explicit
            - project_default
            - installation_default
            - inherited
          title: Selection Source
          type: string
        provider_constraint:
          anyOf:
            - maxLength: 80
              minLength: 1
              pattern: ^[a-z][a-z0-9_-]*$
              type: string
            - type: 'null'
          default: null
          title: Provider Constraint
        accepted_environment:
          anyOf:
            - $ref: '#/components/schemas/WorkspaceEnvironment'
            - type: 'null'
          default: null
        standing:
          type: boolean
          default: false
          title: Standing
          description: >-
            True for a project's standing supervisor: a root coordination task, one per project, that
            never completes (docs/specs/project-supervisor.md).
        web_fetch:
          type: boolean
          default: false
          title: Web Fetch
          description: Every attempt of this task holds the open-web web_fetch MCP tool (docs/specs/web-fetch.md).
        status:
          default: queued
          enum:
            - queued
            - running
            - waiting
            - blocked
            - completed
            - failed
            - cancelled
          title: Status
          type: string
        reason:
          anyOf:
            - enum:
                - owner_decision
                - awaiting_child
                - approval
                - ci
                - publication
                - handoff
                - reconciliation
                - provisioning_unavailable
                - handoff_unavailable
                - cancel_unavailable
                - session_lost
                - stalled
                - runtime_limit
                - idle
              type: string
            - type: 'null'
          default: null
          title: Reason
        owner_decision:
          anyOf:
            - $ref: '#/components/schemas/OwnerDecision'
            - type: 'null'
          default: null
        current_attempt_id:
          anyOf:
            - maxLength: 100
              minLength: 1
              type: string
            - type: 'null'
          default: null
          title: Current Attempt Id
        version:
          default: 1
          minimum: 1
          title: Version
          type: integer
        checkout:
          anyOf:
            - $ref: '#/components/schemas/TaskCheckoutOutput'
            - type: 'null'
          default: null
        created_at:
          format: date-time
          title: Created At
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
        - id
        - owner_id
        - root_task_id
        - title
        - brief
        - mode
        - assigned_profile_id
        - model
        - effort
        - selection_source
        - created_at
        - updated_at
        - project_id
        - topic_id
        - parent_task_id
        - creator_binding_id
        - provider_constraint
        - accepted_environment
        - status
        - reason
        - owner_decision
        - current_attempt_id
        - version
        - checkout
        - standing
      title: Task
      type: object
    TaskArtifact:
      additionalProperties: false
      properties:
        id:
          maxLength: 100
          minLength: 1
          title: Id
          type: string
        operation_id:
          maxLength: 100
          minLength: 1
          title: Operation Id
          type: string
        kind:
          enum:
            - checkpoint
            - handoff_manifest
            - unverified_provider_summary
            - retention_receipt
          title: Kind
          type: string
        sha256:
          title: Sha256
          type: string
        payload:
          additionalProperties: true
          title: Payload
          type: object
