              schema:
                $ref: '#/components/schemas/HTTPError'
  /transcripts/search:
    get:
      tags:
        - transcripts
      summary: Search Transcripts
      description: >-
        Full-text search over the owner's stored transcript entries, best match first. Credentials
        were redacted before entries were stored and indexed, so they are never found.
      operationId: searchTranscripts
      parameters:
        - name: q
          in: query
          required: true
          description: A web-search style query (quoted phrases, `or`, `-word`).
          schema:
            type: string
            minLength: 1
            maxLength: 200
            title: Q
        - name: project_id
          in: query
          required: false
          schema:
            type: string
            title: Project Id
        - name: session_id
          in: query
          required: false
          schema:
            type: string
            title: Session Id
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptSearchResults'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  securitySchemes:
    pocketId:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        The owner's Pocket ID token (ID or access token), signed by the configured issuer, with the
        configured audience, and the owner's subject. The admin gateway forwards it after its login.
    pocketIdCookie:
      type: apiKey
      in: cookie
      name: mainloop-id
      description: >-
        The same Pocket ID ID token in the gateway's login cookie (MAINLOOP_AUTH_OIDC_COOKIE). A write
        authenticated this way also needs an X-Mainloop-Client header and the frontend's Origin.
    serviceAccount:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        A projected Kubernetes ServiceAccount token with the configured audience, checked with a
        TokenReview. Each allowed ServiceAccount has a fixed scope (owner, read or canary).
    ownerDevice:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        A request token a registered device signs with its Secure Enclave key (docs/specs/devices.md):
        a JWT with header `alg` ES256, `typ` mainloop-device+jwt and `kid` the device id, and claims
        `iss` mainloop-device, `sub` the device id, `aud` mainloop-api, `iat`, `exp` at most 60 seconds
        after `iat`, a unique `jti`, `htm` the method, `htu` the path and query the API sees, and `bh`
        the unpadded base64url SHA-256 of the body. Each token is good for one request.
  responses:
    Unauthorized:
      description: No valid identity came with the request.
      headers:
        WWW-Authenticate:
          description: Bearer challenge.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPError'
  schemas:
    ActivityItem:
      properties:
        id:
          type: string
          title: Id
        title:
          type: string
          title: Title
        content:
          type: string
          title: Content
        href:
          anyOf:
            - type: string
            - type: 'null'
          title: Href
        created_at:
          type: string
          format: date-time
          title: Created At
        queue_item_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Queue Item Id
          description: The queue item behind this row, if any. Pass it to `dismissQueueDiagnostic`.
        dismissible:
          type: boolean
          title: Dismissible
          description: True when the owner may dismiss this row (an input notice with no structured request). The server decides; clients do not copy the rule.
      type: object
      required:
        - id
        - title
        - content
        - created_at
        - href
        - queue_item_id
        - dismissible
      title: ActivityItem
    PrivilegedActionState:
      type: string
      enum:
        - requested
        - pending_approval
        - preflight_failed
        - approved
        - executing
        - succeeded
        - failed
        - stale
        - denied
        - expired
        - cancelled
        - uncertain
      title: PrivilegedActionState
    PrivilegedActionSummary:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          description: The catalog type, e.g. github.pr_merge or onepassword.item_to_secret.
        state:
          $ref: '#/components/schemas/PrivilegedActionState'
        title:
          type: string
          description: The card's title once the facts are frozen; the type before.
        requester_role:
          type: string
        requester_session_id:
          type: string
        requester_task_id:
          anyOf:
            - type: string
            - type: 'null'
        reason:
          type: string
          description: The agent's claim, never checked by Mainloop.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        decided_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        finished_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        decision_note:
          anyOf:
            - type: string
            - type: 'null'
        last_error:
          anyOf:
            - type: string
            - type: 'null'
      required:
        - id
        - type
        - state
        - title
        - requester_role
        - requester_session_id
        - requester_task_id
        - reason
        - created_at
        - expires_at
        - decided_at
        - finished_at
        - decision_note
        - last_error
      title: PrivilegedActionSummary
    PrivilegedActionDetail:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/PrivilegedActionSummary'
        body:
          type: string
          description: The card's text as the owner saw it; empty before the facts are frozen.
        args:
          type: object
          additionalProperties: true
          description: The canonical arguments.
        frozen_facts:
          anyOf:
            - type: object
              additionalProperties: true
            - type: 'null'
          description: What preflight read, which the approval's digest covers. Never a secret value.
        digest:
          anyOf:
            - type: string
            - type: 'null'
        canonical_record:
          description: >-
            The canonical JSON the digest is the SHA-256 of: the type and its version, the arguments, the frozen facts,
            the requester, the action id, the expiry and the catalog version. A phone hashes these bytes itself and shows
            what it parsed from them before it signs an approval. Null before the facts are frozen.
          anyOf:
            - type: string
            - type: 'null'
        result:
          anyOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        attempts:
          type: integer
        delivery_state:
          type: string
          enum: [none, pending, delivered, undeliverable]
        events:
          type: array
          items:
            $ref: '#/components/schemas/PrivilegedActionEvent'
        approval:
          description: The device signature the approval carried; null for an approval from the web app, or none.
          anyOf:
            - $ref: '#/components/schemas/PrivilegedActionApproval'
            - type: 'null'
      required:
        - action
        - body
        - args
        - frozen_facts
        - digest
        - canonical_record
        - result
        - attempts
        - delivery_state
        - events
        - approval
      title: PrivilegedActionDetail
    PrivilegedActionApproval:
      type: object
      description: An approval signed with a device's Touch ID approval key.
      properties:
        device_id:
          type: string
          maxLength: 64
        signed_at:
          type: string
          format: date-time
      required:
        - device_id
        - signed_at
      additionalProperties: false
    PrivilegedActionEvent:
      type: object
      properties:
        id:
          type: integer
          format: int64
        step:
          type: string
        detail:
          type: string
        created_at:
          type: string
          format: date-time
      required:
        - id
        - step
        - detail
        - created_at
      title: PrivilegedActionEvent
    AskUserAnswer:
      properties:
        answer:
          items:
            type: string
            maxLength: 8192
          type: array
          maxItems: 100
          title: Answer
      additionalProperties: false
      type: object
      required:
        - answer
      title: AskUserAnswer
    AskUserResponse:
      properties:
        type:
          type: string
          const: ask_user_response
          title: Type
        id:
          type: string
          maxLength: 2048
          minLength: 1
          title: Id
        answers:
          items:
            $ref: '#/components/schemas/AskUserAnswer'
          type: array
          maxItems: 100
          minItems: 1
          title: Answers
      additionalProperties: false
      type: object
      required:
        - type
        - id
        - answers
      title: AskUserResponse
    AttentionItem:
      properties:
        reason_code:
          description: Closed reason for reconciliation or merge approval attention; absent for other sources.
          type: string
          enum:
            - reconciliation
            - runtime_stop_unresolved
            - merge_approval
            - session_lost
            - stalled
            - runtime_limit
        id:
          type: string
          title: Id
        kind:
          # approval, question and owner_decision are real owner decisions; review is a low-priority
          # one (an agent's proposal, such as project memory, with nothing blocked on it): counted,
          # listed after the others, never pushed; problem is Mainloop's own recovery work (a stall,
          # an unconfirmed stop) with no decision yet for the owner to make.
          type: string
          enum:
            - approval
            - question
            - owner_decision
            - problem
            - review
          title: Kind
        title:
          type: string
          title: Title
        needed:
          type: string
          title: Needed
        href:
          type: string
          title: Href
        session_ids:
          # no cap in the code: sessions behind one item; limited only by the owner's data
          items:
            type: string
          type: array
          title: Session Ids
        task_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Task Id
        queue_item:
          anyOf:
            - $ref: '#/components/schemas/QueueItem'
            - type: 'null'
      type: object
      required:
        - id
        - kind
        - title
        - needed
        - href
        - session_ids
        - task_id
        - queue_item
      title: AttentionItem
    AttentionSnapshot:
      properties:
        items:
          # no cap in the code: one entry per open item; not paginated
          items:
            $ref: '#/components/schemas/AttentionItem'
          type: array
          title: Items
        count:
          # open, visible items that are a real owner decision (kind != problem, review included); a problem item is
          # not counted here, even while it is open and listed in items
          type: integer
          title: Count
          default: 0
        sessions:
          # the owner's session list (every unfinished session and the newest finished ones, as GET /sessions), each with its own needs_owner; not paginated
          items:
            $ref: '#/components/schemas/Session'
          type: array
          title: Sessions
      type: object
      title: AttentionSnapshot
      required:
        - items
        - count
        - sessions
    CapabilityResult:
      properties:
        capability:
          type: string
          minLength: 1
          title: Capability
        state:
          $ref: '#/components/schemas/CapabilityState'
          default: unknown
        scope:
          type: string
          enum:
            - fixture
            - live
            - unverified
          title: Scope
          default: unverified
        evidence_ref:
          anyOf:
            - type: string
              minLength: 1
            - type: 'null'
          title: Evidence Ref
        detail:
          anyOf:
            - type: string
            - type: 'null'
          title: Detail
      additionalProperties: false
      type: object
      required:
        - capability
        - state
        - scope
        - evidence_ref
        - detail
      title: CapabilityResult
    CapabilityState:
      type: string
      enum:
        - proved
        - partial
        - unsupported
        - unknown
      title: CapabilityState
    ChatImageUpload:
      properties:
        media_type:
          type: string
          enum:
            - image/png
            - image/jpeg
            - image/webp
            - image/gif
          title: Media Type
          description: The image's MIME type. Anthropic's Messages API accepts these four formats.
        data:
          type: string
          format: byte
          title: Data
          description: Base64-encoded image bytes.
      type: object
      required:
        - media_type
        - data
      title: ChatImageUpload
      description: Request model for uploading an image to attach to the next main-chat message.
    ChatImageUploadResponse:
      properties:
        id:
          type: string
          title: Id
          description: The uploaded image's id, attached to a message via ChatRequest.image_ids.
        media_type:
          type: string
          title: Media Type
        size_bytes:
          type: integer
          title: Size Bytes
      type: object
      required:
        - id
        - media_type
        - size_bytes
      title: ChatImageUploadResponse
      description: Response model for an uploaded chat image.
    ChatMessageImage:
      properties:
        id:
          type: string
          title: Id
        media_type:
          type: string
          title: Media Type
        data:
          type: string
          format: byte
          title: Data
          description: Base64-encoded image bytes.
      type: object
      required:
        - id
        - media_type
        - data
      title: ChatMessageImage
      description: An image attached to a chat message.
    ChatRequest:
      properties:
        message:
          type: string
          title: Message
          description: User message
        conversation_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Conversation Id
          description: Existing conversation ID
        image_ids:
          items:
            type: string
          type: array
          title: Image Ids
          description: >-
            IDs of images uploaded with POST /chat/images (still unattached) to attach to this
            message, in order. The message may be empty when at least one image is given.
      type: object
      required:
        - message
      title: ChatRequest
      description: Request model for sending a message.
    ChatResponse:
      properties:
        conversation_id:
          type: string
          title: Conversation Id
        message:
          anyOf:
            - $ref: '#/components/schemas/Message'
            - type: 'null'
        spawned_session_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Spawned Session Id
        pending:
          type: boolean
          title: Pending
          default: false
        delivery_message_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Delivery Message Id
        status:
          type: string
          enum:
            - ok
            - queued
          default: ok
          description: '`queued`: recorded durably behind an open turn, and delivered in its own turn once that one ends; `ok`: admitted at once.'
      type: object
      required:
        - conversation_id
        - message
        - spawned_session_id
        - pending
        - delivery_message_id
        - status
      title: ChatResponse
      description: Response model for chat interaction.
    CommitSummary:
      properties:
        sha:
          type: string
          title: Sha
        message:
          type: string
          title: Message
        author:
          type: string
          title: Author
        date:
          type: string
          format: date-time
          title: Date
        url:
          type: string
          title: Url
      type: object
      required:
        - sha
        - message
        - author
        - date
        - url
      title: CommitSummary
      description: Summary of a commit.
    Conversation:
      properties:
        id:
          type: string
          title: Id
          description: Unique conversation ID
        user_id:
          type: string
          title: User Id
          description: Owner ID (the single configured owner)
        title:
          anyOf:
            - type: string
            - type: 'null'
          title: Title
          description: Conversation title
        summary:
          anyOf:
            - type: string
            - type: 'null'
          title: Summary
          description: Compacted summary of older messages
        summarized_through_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Summarized Through Id
          description: ID of last message included in summary
        message_count:
          type: integer
          title: Message Count
          description: Total message count for compaction threshold
          default: 0
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: Last update timestamp
      type: object
      required:
        - id
        - user_id
        - title
        - summary
        - summarized_through_id
        - message_count
        - created_at
        - updated_at
      title: Conversation
      description: A conversation thread.
    ConversationResponse:
      properties:
        conversation:
          $ref: '#/components/schemas/Conversation'
        messages:
          # no cap in the code: the whole transcript; not paginated
          items:
            $ref: '#/components/schemas/Message'
          type: array
          title: Messages
      type: object
      required:
        - conversation
        - messages
      title: ConversationResponse
      description: Response model for conversation with messages.
    CreateWorkspaceRequest:
      properties:
        project_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Project Id
        repo:
          anyOf:
            - type: string
            - type: 'null'
          title: Repo
        branch:
          type: string
          title: Branch
          default: ''
        ref:
          type: string
          title: Ref
          default: ''
        depth:
          type: integer
          maximum: 1000.0
          minimum: 0.0
          title: Depth
          default: 0
        dev:
          $ref: '#/components/schemas/WorkspaceDev'
        agent_kind:
          type: string
          maxLength: 80
          minLength: 1
          pattern: ^[a-z][a-z0-9_-]*$
          title: Agent Kind
          default: claude
      additionalProperties: false
      type: object
      title: CreateWorkspaceRequest
    DefinitionReference:
      properties:
        repository:
          type: string
          maxLength: 2048
          minLength: 1
          title: Repository
        commit_sha:
          type: string
          pattern: ^[0-9a-f]{40}$
          title: Commit Sha
        path:
          type: string
          maxLength: 1024
          minLength: 1
          title: Path
      additionalProperties: false
      type: object
      required:
        - repository
        - commit_sha
        - path
      title: DefinitionReference
    GrantRequest:
      properties:
        permission:
          type: string
          enum:
            - use
            - derive
          title: Permission
      additionalProperties: false
      type: object
      required:
        - permission
      title: GrantRequest
    HITLDecisionInput:
      properties:
        action_id:
          type: string
          maxLength: 2048
          minLength: 1
          title: Action Id
        response:
          oneOf:
            - $ref: '#/components/schemas/ToolApprovalResponse'
            - $ref: '#/components/schemas/AskUserResponse'
          title: Response
          discriminator:
            propertyName: type
            mapping:
              ask_user_response: '#/components/schemas/AskUserResponse'
              tool_approval_response: '#/components/schemas/ToolApprovalResponse'
      additionalProperties: false
      type: object
      required:
        - action_id
        - response
      title: HITLDecisionInput
    HTTPValidationError:
      properties:
        detail:
          # no cap in the code: FastAPI-generated validation error list
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    TopicLine:
      type: object
      properties:
        name:
          type: string
        status_line:
          type: string
        pending:
          type: integer
          minimum: 0
          description: Open pending records in the topic.
      required:
        - name
        - status_line
        - pending
      additionalProperties: false
    MainProvider:
      type: string
      enum:
        - claude
        - codex
      title: MainProvider
    MainProviderSelection:
      properties:
        provider:
          $ref: '#/components/schemas/MainProvider'
        restart_failed:
          type: boolean
          title: Restart Failed
          default: false
          description: >-
            Admit a fresh native identity for a pending target that is `recoverable`. Ignored
            otherwise: the original create contract is recovered.
      type: object
      required:
        - provider
      additionalProperties: false
      title: MainProviderSelection
    MainProviderHistoryEntry:
      properties:
        provider:
          type: string
          title: Provider
        kagent_session_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Kagent Session Id
      type: object
      required:
        - provider
        - kagent_session_id
      title: MainProviderHistoryEntry
    MainProviderInfo:
      properties:
        session_id:
          type: string
          title: Session Id
        desired_provider:
          $ref: '#/components/schemas/MainProvider'
        effective_provider:
          anyOf:
            - $ref: '#/components/schemas/MainProvider'
            - type: 'null'
          description: The provider whose native Session is confirmed; null while none is.
        status:
          type: string
          enum:
            - not_started
            - pending
            - ready
            - failed
          title: Status
        kagent_session_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Kagent Session Id
        error:
          anyOf:
            - type: string
              maxLength: 300
            - type: 'null'
          title: Error
        recoverable:
          type: boolean
          title: Recoverable
          default: false
        history:
          # one entry per provider switch of the main thread; not paginated
          items:
            $ref: '#/components/schemas/MainProviderHistoryEntry'
          type: array
          title: History
          default: []
      type: object
      required:
        - session_id
        - desired_provider
        - effective_provider
        - status
        - kagent_session_id
        - error
        - recoverable
        - history
      title: MainProviderInfo
    MainThreadInfo:
      properties:
        mode:
          type: string
          title: Mode
        session_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Session Id
        conversation_id:
          anyOf:
