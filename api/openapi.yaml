# trunk-ignore-begin(checkov/CKV_OPENAPI_5): GET /health declares `security: []` on purpose (kubelet
# probes address the pod by IP with no credential); every other operation inherits the root security.
# Mainloop API contract, v1 (OpenAPI 3.1). Source of truth for the Go server and the React client.
# Exported from the Python app, then typed: every response has a schema, errors are HTTPError or
# TaskError, and Pydantic limits are copied in.
# Every operation except /health requires an identity the backend verifies itself (see
# docs/specs/authentication.md): the owner's Pocket ID token, as a bearer or the gateway's login
# cookie, or a Kubernetes ServiceAccount token. Network position is not identity.
openapi: 3.1.0
info:
  title: Mainloop API
  description: Mainloop control-plane API
  version: 0.2.0
servers:
  - url: /
security:
  - pocketId: []
  - pocketIdCookie: []
  - serviceAccount: []
  - ownerDevice: []
# trunk-ignore-end(checkov/CKV_OPENAPI_5)
tags:
  - name: health
    description: Liveness and orchestration-health rollups.
  - name: events
    description: Owner-scoped live update stream (server-sent events).
  - name: chat
    description: Main thread and chat delivery.
  - name: attention
    description: Needs-you items, activity and queue responses.
  - name: hitl
    description: Native approvals and questions, and observer status.
  - name: projects
    description: Projects, merge policy, provider preference and smoke data.
  - name: sessions
    description: Native-bound sessions and provider profiles.
  - name: seen
    description: The owner's seen state across devices.
  - name: workspaces
    description: Workspace lifecycle and preview ports.
  - name: environments
    description: Development environments, versions, grants and selection.
  - name: tasks
    description: Task reads, task operations and task actions.
  - name: schedules
    description: Scheduled agent runs proxied from kagent; schedules, triggers and executions.
  - name: dotfiles
    description: The agent dotfiles source, owner-wide and per project.
  - name: devloop
    description: The one live-sync lease on the shared mainloop-dev instance.
  - name: transcripts
    description: Stored session transcripts and their search.
  - name: privileged
    description: The owner's audit of privileged actions agents asked for.
  - name: devices
    description: The owner's registered phones, whose keys sign their API requests (docs/specs/devices.md).
  - name: owner-memory
    description: The owner's own standing preferences, loaded into every session (docs/specs/owner-memory.md).
paths:
  /activity:
    get:
      tags:
        - attention
      summary: Owner Activity
      operationId: listActivity
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ActivityItem'
                type: array
                title: Response Owner Activity Activity Get
                maxItems: 100
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
  /attention:
    get:
      tags:
        - attention
      summary: Owner Attention
      operationId: getAttention
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttentionSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
  /chat:
    post:
      tags:
        - chat
      summary: Chat
      description: Record and deliver a message to the user's native main session.
      operationId: sendMessage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Request Entity Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '202':
          description: 'Accepted: recorded durably as queued behind an open turn, and delivered once that turn ends.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedHTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /chat/images:
    post:
      tags:
        - chat
      summary: Upload Chat Image
      description: >-
        Upload an image, scoped to the main session, to attach to the next message sent with
        POST /chat. Unattached uploads are not shown anywhere until a message claims them.
      operationId: uploadChatImage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatImageUpload'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatImageUploadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '413':
          description: Request Entity Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /conversations/{conversation_id}:
    get:
      tags:
        - chat
      summary: Get Conversation
      description: Get a conversation with its messages.
      operationId: getConversation
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
            title: Conversation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /devices:
    get:
      tags:
        - devices
      summary: List Devices
      description: The owner's registered devices, newest first, revoked ones included. A device sees itself marked `current`.
      operationId: listDevices
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
    post:
      tags:
        - devices
      summary: Register Device
      description: >-
        Registers a phone and its request key (docs/specs/devices.md). Only the owner's own Pocket ID
        token sent as a bearer may call this, issued within the last 10 minutes: the native app signs in
        once with its own OIDC client (MAINLOOP_AUTH_DEVICE_CLIENT_ID), whose tokens are good for this
        operation only. A device key, the login cookie or a ServiceAccount is refused with 403. The
        response's `id` is the `kid` and `sub` of the device's request tokens.
      operationId: registerDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegistration'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '409':
          description: This request key is already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /devices/current:
    get:
      tags:
        - devices
      summary: Get Current Device
      description: The device whose key signed this request. 404 when the request was not signed by a device.
      operationId: getCurrentDevice
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
  /devices/current/web-session:
    post:
      tags:
        - devices
      summary: Create Device Web Session
      description: >-
        Starts a web session for the device that signed this request (docs/specs/devices.md, "The app's web
        view"). The iPhone app shows the web app in a web view, which can't sign its requests; it sets the
        returned token as the HttpOnly cookie `cookie_name`, and every request carrying it acts as this
        device until `expires_at` (an hour on), the session is replaced or ended, or the device is revoked.
        A new session ends the device's earlier ones. Only a request the device key signed starts one, never
        a web session or a sign-in. The token is returned once; the server keeps only its SHA-256.
      operationId: createDeviceWebSession
      responses:
        '201':
          description: The new session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceWebSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
    delete:
      tags:
        - devices
      summary: End Device Web Sessions
      description: >-
        Ends every web session of the device that signed this request, and the streams they hold open. Only a
        request the device key signed may call it, never a web session.
      operationId: endDeviceWebSessions
      responses:
        '204':
          description: Ended (also when there were none)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
  /devices/current/push:
    put:
      tags:
        - devices
      summary: Set Device Push Token
      description: >-
        Sets the APNs device token of the device that signed this request (docs/specs/push-notifications.md).
        Replaces any token it had; a token another device had moves to this one. Only a request the device key
        signed may call it, never the device's web session.
      operationId: setDevicePush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevicePushRegistration'
      responses:
        '200':
          description: The device, with its push token's status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
        - devices
      summary: Clear Device Push Token
      description: >-
        Stops pushes to the device that signed this request. Clearing a device with no token succeeds. Only a
        request the device key signed may call it, never the device's web session.
      operationId: clearDevicePush
      responses:
        '204':
          description: Cleared
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
  /devices/{device_id}:
    delete:
      tags:
        - devices
      summary: Revoke Device
      description: >-
        Revokes a device: its request key stops working at once. The owner may revoke any device; a device
        may revoke only itself (signing out). Revoking a revoked device succeeds and changes nothing.
      operationId: revokeDevice
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
            title: Device Id
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /devloop/lease:
    get:
      tags:
        - devloop
      summary: Get Devloop Lease
      description: Read the mainloop-dev live-sync lease without acquiring it or joining its queue.
      operationId: getDevloopLease
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevloopLease'
  /devloop/lease/acquire:
    post:
      tags:
        - devloop
      summary: Acquire Devloop Lease
      description: Acquire the mainloop-dev lease as the owner, or report the owner's place in its FIFO queue.
      operationId: acquireDevloopLease
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevloopLease'
  /devloop/lease/release:
    post:
      tags:
        - devloop
      summary: Release Devloop Lease
      description: Release the mainloop-dev lease if the owner holds it; a no-op otherwise.
      operationId: releaseDevloopLease
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevloopLease'
  /devloop/operations:
    get:
      tags:
        - devloop
      summary: List Devloop Syncs
      description: >-
        The dev_sync operations on mainloop-dev, newest first (at most 50): the commit, the verdict, and
        what the health and smoke checks said. session_id narrows to one task session.
      operationId: listDevloopOperations
      parameters:
        - name: session_id
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  $ref: '#/components/schemas/DevloopOperation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
  /environments:
    get:
      tags:
        - environments
      summary: List Environments
      operationId: listEnvironments
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                # trunk-ignore(checkov/CKV_OPENAPI_21): no cap in the code: unpaginated owner-scoped list
                type: array
                items:
                  $ref: '#/components/schemas/DevEnvironment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
    post:
      tags:
        - environments
      summary: Register
      operationId: registerEnvironment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterEnvironment'
        required: true
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Request Entity Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredEnvironment'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/HTTPValidationError'
                  - $ref: '#/components/schemas/HTTPError'
  /environments/{environment_id}:
    get:
      tags:
        - environments
      summary: Get Environment
      operationId: getEnvironment
      parameters:
        - name: environment_id
          in: path
          required: true
          schema:
            type: string
            title: Environment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevEnvironment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
        - environments
      summary: Update Environment
      description: Turns following the watched tag on or off. Turning it on needs a prebuilt image and a watched tag.
      operationId: updateEnvironment
      parameters:
        - name: environment_id
          in: path
          required: true
          schema:
            type: string
            title: Environment Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEnvironment'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Request Entity Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevEnvironment'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/HTTPValidationError'
                  - $ref: '#/components/schemas/HTTPError'
  /environments/{environment_id}/default:
    put:
      tags:
        - environments
      summary: Set Default
      operationId: acceptEnvironmentDefault
      parameters:
        - name: environment_id
          in: path
          required: true
          schema:
            type: string
            title: Environment Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Request Entity Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevEnvironment'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/HTTPValidationError'
                  - $ref: '#/components/schemas/HTTPError'
  /environments/{environment_id}/grants/{project_id}:
    put:
      tags:
        - environments
      summary: Grant
      operationId: grantEnvironmentToProject
      parameters:
        - name: environment_id
          in: path
          required: true
          schema:
            type: string
            title: Environment Id
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Request Entity Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEnvironmentGrant'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
        - environments
      summary: Revoke
      operationId: revokeEnvironmentFromProject
      parameters:
        - name: environment_id
          in: path
          required: true
          schema:
            type: string
            title: Environment Id
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            title: Project Id
      responses:
        '204':
          description: Successful Response
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Not Found
          content:
