        - xhigh
        - max
      title: EffortLevel
      description: >-
        A reasoning-effort level. Which of these a profile actually offers is its own
        `effort_levels`: Mainloop's built-in Claude profile offers low, medium, high, xhigh, max;
        its built-in Codex profile offers low, medium, high. Setting a level the
        session's profile does not offer is `422`.
