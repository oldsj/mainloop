        - timestamp
      additionalProperties: false
      description: '`heartbeat`: sent after 30 seconds without another event.'
    EventInboxUpdated:
      type: object
      properties:
        item_id:
          type: string
        unread_count:
          type: integer
          minimum: 0
      additionalProperties: false
      description: '`inbox:updated`: either field is omitted when unknown.'
    EventScheduleUpdated:
      type: object
      properties:
        schedule_id:
          type: string
      required:
        - schedule_id
      additionalProperties: false
      description: '`schedule:updated`: names a change; read the schedule with getSchedule or its executions with listScheduleExecutions.'
    EventSessionMessage:
      type: object
      properties:
        session_id:
          type: string
        message_id:
          type: string
        role:
          type: string
          enum:
            - assistant
      required:
        - session_id
        - message_id
        - role
      additionalProperties: false
      description: '`session:message`: a session turn ended. `message_id` is the mirrored reply, or, when the turn produced no text (it failed, or was not sent again), the id of the user message it answered. The client re-reads the session.'
    EventSessionProgress:
      type: object
      properties:
        session_id:
          type: string
        message_id:
          type: string
          description: The user message the running turn answers.
        reply_id:
          type: string
          description: >-
            Only in the last frame (`active` false): the id of the conversation message that holds the turn's outcome, a reply or a stop note, which the client keeps showing the live state for until that message is in the conversation. Omitted when the turn wrote no message.
        seq:
          type: integer
          minimum: 1
          description: Orders the frames of one turn. Clients keep the highest.
        active:
          type: boolean
          description: False in the last frame of a turn. That frame repeats the last text and tool lines, so the client can keep showing them until the stored reply is read, and is sent after the turn's final state is stored.
        started_at:
          type: string
          description: When the turn's live progress began, UTC ISO-8601 without an offset. The elapsed time is measured from it.
        status:
          $ref: '#/components/schemas/SessionProgressStatus'
        text:
          type: string
          description: The reply so far, as markdown. At most 16 KiB; when longer, the end is kept and `text_truncated` is true.
        text_truncated:
          type: boolean
        tools:
          type: array
          maxItems: 30
          description: The latest tool calls of the turn, oldest first.
          items:
            $ref: '#/components/schemas/SessionProgressTool'
      required:
        - session_id
        - message_id
        - seq
        - active
        - started_at
        - status
        - text
        - text_truncated
        - tools
      additionalProperties: false
      description: >-
        `session:progress`: the live state of a running session turn. Never stored and carries no event id; the
        durable reply still arrives once, as the `session:message` that ends the turn. At most four frames a second
        per session are sent.
    SessionProgressStatus:
      type: object
      properties:
        kind:
          type: string
          enum:
            - thinking
            - writing
            - tool
            - waiting
          description: '`thinking`: no text or tool yet. `writing`: the reply is growing. `tool`: a tool call is running. `waiting`: the turn waits for the owner.'
        label:
          type: string
          maxLength: 160
          description: 'Display text, such as `Thinking…`, `Running Bash: go test ./...` or `Waiting for you`.'
      required:
        - kind
        - label
      additionalProperties: false
    SessionProgressTool:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        label:
          type: string
          maxLength: 160
          description: A one-line summary of the call, such as `Read server/main.go`.
        state:
          type: string
          enum:
            - running
            - done
            - error
      required:
        - id
        - name
        - label
        - state
      additionalProperties: false
    EventWorkspaceUpdated:
      type: object
      properties:
        workspace:
          $ref: '#/components/schemas/WorkspaceLifecycle'
      required:
        - workspace
      additionalProperties: false
      description: '`workspace:updated`: the durable lifecycle projection.'
    EventTaskUpdated:
      allOf:
        - $ref: '#/components/schemas/TaskUpdated'
      description: '`task:updated`: names a change; read the task with getTask.'
    TaskCheckoutOutput:
      properties:
        branch:
          type: string
          maxLength: 255
          minLength: 1
          title: Branch
        ref:
          type: string
          maxLength: 255
          title: Ref
          default: ''
        depth:
          type: integer
          maximum: 1000.0
          minimum: 0.0
          title: Depth
          default: 0
      additionalProperties: false
      type: object
      required:
        - branch
        - ref
        - depth
      title: TaskCheckout
    ToolApprovalOutput:
      properties:
        id:
          type: string
          maxLength: 2048
          minLength: 1
          title: Id
        approved:
          type: boolean
          title: Approved
        rejection_reason:
          anyOf:
            - type: string
              maxLength: 8192
            - type: 'null'
          title: Rejection Reason
      additionalProperties: false
      type: object
      required:
        - id
        - approved
        - rejection_reason
      title: ToolApproval
    ToolApprovalResponseOutput:
      properties:
        type:
          type: string
          const: tool_approval_response
          title: Type
        approvals:
          items:
            $ref: '#/components/schemas/ToolApprovalOutput'
          type: array
          maxItems: 100
          minItems: 1
          title: Approvals
        reviewed_context:
          additionalProperties:
            type: string
            pattern: ^[0-9a-f]{64}$
          propertyNames:
            maxLength: 2048
            minLength: 1
          type: object
          maxProperties: 100
          title: Reviewed Context
      additionalProperties: false
      type: object
      required:
        - type
        - approvals
        - reviewed_context
      title: ToolApprovalResponse
    WorkspaceDevOutput:
      properties:
        ports:
          # no cap in the code: ports are unique per workspace, but their number is not limited
          items:
            $ref: '#/components/schemas/WorkspacePort'
          type: array
          title: Ports
          default: []
        idle_timeout_minutes:
          type: integer
          description: Recorded only. kagent decides when an idle runtime sleeps; Mainloop no longer suspends a workspace after this time.
          maximum: 1440.0
          minimum: 1.0
          title: Idle Timeout Minutes
          default: 30
      additionalProperties: false
      type: object
      title: WorkspaceDev
      description: 'Dev server settings: which ports the preview URL may reach, and when to idle out.'
      required:
        - ports
        - idle_timeout_minutes
