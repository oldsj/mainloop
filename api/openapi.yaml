      type: object
      description: One kagent Session the session's transcript is copied from.
      properties:
        state:
          type: string
          enum:
            - active
            - complete
            - unavailable
        reason:
          type: string
          description: Why an unavailable source stopped being copied.
        scanned_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        stored_bytes:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time
      required:
        - state
        - reason
        - scanned_at
        - stored_bytes
        - created_at
      additionalProperties: false
