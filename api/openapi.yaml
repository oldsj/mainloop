              schema:
                $ref: '#/components/schemas/HTTPError'
    put:
      tags:
        - dotfiles
      summary: Set Dotfiles Source
      description: >-
        Set or clear (`repository: null`) the owner-wide source: a compare-and-swap on `version`
        (`expected_version` 0 when none was ever set), `409` when stale. `ref` empty means the
        repository's default branch; `path` empty means its root. A new value reaches sessions
        created after it; a running session keeps the commit it was given.
