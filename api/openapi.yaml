              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
    put:
      tags:
        - sessions
      summary: Set Session Default
      description: >-
        Set the default model and effort for one role and provider profile. `null` leaves that
        field to the provider; both `null` removes the default. The provider must be a configured
        profile and the effort one of its `effort_levels` (`GET /providers`); otherwise `422`.
        Returns every default.
      operationId: setSessionDefault
      requestBody:
        required: true
