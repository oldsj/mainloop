        - parent_session_id
        - topic
        - agent_kind
        - status
        - needs_owner
        - created_at
        - started_at
        - completed_at
        - archived_at
        - summary
        - error
        - repo_url
        - project_id
        - branch_name
        - base_branch
        - model
        - commit_sha
        - color
        - result
      title: Session
