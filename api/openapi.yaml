      title: ScheduledRunPage
    ScheduledRunExecutionPage:
      properties:
        items:
          # kagent PageRequest.limit is at most 100 per page
          items:
            $ref: '#/components/schemas/ScheduledRunExecutionOutput'
          type: array
          maxItems: 100
          title: Items
        next_page_token:
          anyOf:
            - type: string
              maxLength: 128
            - type: 'null'
          title: Next Page Token
          description: Send as page_token for the next page; null on the last page.
      additionalProperties: false
      type: object
      required:
        - items
        - next_page_token
      title: ScheduledRunExecutionPage
