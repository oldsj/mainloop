      summary: Set Session Web Fetch
      description: >-
        Turn the open-web `web_fetch` MCP tool on or off for this session's agent
        (docs/specs/web-fetch.md). Off by default for every session. An agent also has the tool when
        the task it runs was created with `web_fetch` (`from_task`); this call changes only the
        session's own flag. Turning it off takes effect at the agent's next tool call; turning it on,
        when the agent next lists its tools. The main thread is a session like any other here.
      operationId: setSessionWebFetch
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            title: Session Id
      requestBody:
        required: true
