            - type: 'null'
        task_id:
          anyOf:
            - type: string
            - type: 'null'
        attempt_id:
          anyOf:
            - type: string
            - type: 'null'
        task_title:
          anyOf:
            - type: string
            - type: 'null'
        totals:
          $ref: '#/components/schemas/HealthTotals'
      required:
        - session_id
        - provider
        - project_id
        - task_id
        - attempt_id
        - totals
      additionalProperties: false
      description: Sessions without a task have task_title and title null; rows for tasks without a session omit title.
    HealthReport:
      type: object
      properties:
        id:
          type: string
        task_id:
          type: string
        attempt_id:
          type: string
        outcome:
          type: string
          enum:
            - blocked
            - failed
      required:
        - id
        - task_id
        - attempt_id
        - outcome
      additionalProperties: false
    HealthApproval:
      type: object
      properties:
        id:
          type: string
        runtime_session_id:
          anyOf:
            - type: string
            - type: 'null'
        state:
          anyOf:
            - type: string
            - type: 'null'
      required:
        - id
        - runtime_session_id
        - state
      additionalProperties: false
    HealthRow:
      type: object
      properties:
        id:
          type: string
        task_id:
          anyOf:
            - type: string
            - type: 'null'
        project_id:
          anyOf:
            - type: string
            - type: 'null'
        title:
          anyOf:
            - type: string
            - type: 'null'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/HealthSession'
          maxItems: 1000
        turns:
          type: array
          items:
            $ref: '#/components/schemas/HealthTurnRow'
          maxItems: 2000
        totals:
          $ref: '#/components/schemas/HealthTotals'
        reports:
          # No cap in the code: unpaginated owner-scoped list
          type: array
          items:
            $ref: '#/components/schemas/HealthReport'
        approvals:
          # No cap in the code: unpaginated owner-scoped list
          type: array
          items:
            $ref: '#/components/schemas/HealthApproval'
        gaps:
          # No cap in the code: unpaginated owner-scoped list
          type: array
          items:
            type: string
        expected_receipts:
          type: integer
      required:
        - id
        - task_id
        - project_id
        - title
        - sessions
        - turns
        - totals
        - reports
        - approvals
        - gaps
        - expected_receipts
      additionalProperties: false
    HealthView:
      type: object
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/HealthRow'
          maxItems: 3000
        hours:
          type: integer
          minimum: 1
          maximum: 8760
        partial:
          type: boolean
        unsupported:
          type: array
          items:
            type: string
            enum:
              - cache
              - exact_approval_wait
              - codex_usage
              - native_child_attribution
          maxItems: 4
        retention:
          type: object
          properties:
            events_days:
              type: integer
            summaries_days:
              type: integer
          required:
            - events_days
            - summaries_days
          additionalProperties: false
      required:
        - rows
        - hours
        - partial
        - unsupported
        - retention
      additionalProperties: false
    HealthEventRow:
      type: object
      properties:
        event_id:
          type: string
        task_id:
          anyOf:
            - type: string
            - type: 'null'
        attempt_id:
          anyOf:
            - type: string
            - type: 'null'
        received_at:
          type: string
          format: date-time
        payload:
          $ref: '#/components/schemas/HealthEvent'
      required:
        - event_id
        - task_id
        - attempt_id
        - received_at
        - payload
      additionalProperties: false
    HealthEvents:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/HealthEventRow'
          maxItems: 200
        partial:
          type: boolean
      required:
        - events
        - partial
      additionalProperties: false
    EventConnected:
      type: object
      properties:
        user_id:
          type: string
        timestamp:
          type: string
          description: UTC ISO-8601 without an offset.
      required:
        - user_id
        - timestamp
      additionalProperties: false
      description: '`connected`: first frame of every stream.'
    EventHeartbeat:
      type: object
      properties:
        timestamp:
          type: string
          description: UTC ISO-8601 without an offset.
      required:
        - timestamp
      additionalProperties: false
      description: '`heartbeat`: sent after 30 seconds without another event.'
    EventInboxUpdated:
      type: object
      properties:
        item_id:
          type: string
        unread_count:
          type: integer
          minimum: 0
      additionalProperties: false
      description: '`inbox:updated`: either field is omitted when unknown.'
    EventSessionMessage:
      type: object
      properties:
        session_id:
          type: string
        message_id:
          type: string
        role:
          type: string
          enum:
            - assistant
      required:
        - session_id
        - message_id
        - role
      additionalProperties: false
      description: '`session:message`: a mirrored reply landed in a session conversation.'
    EventWorkspaceUpdated:
      type: object
      properties:
        workspace:
          $ref: '#/components/schemas/WorkspaceLifecycle'
      required:
        - workspace
      additionalProperties: false
      description: '`workspace:updated`: the durable lifecycle projection.'
    EventTaskUpdated:
      allOf:
        - $ref: '#/components/schemas/TaskUpdated'
      description: '`task:updated`: names a change; read the task with getTask.'
