                  - $ref: '#/components/schemas/HTTPValidationError'
                  - $ref: '#/components/schemas/HTTPError'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
    put:
      tags:
        - schedules
      summary: Update Schedule
      description: Replace the schedule configuration. Requires If-Match with the etag from the last read; a stale etag returns 412 and no If-Match returns 428. A deleted schedule returns 409.
      operationId: updateSchedule
      x-served-by: go
      parameters:
        - name: schedule_id
          in: path
          required: true
          schema:
            type: string
            title: Schedule Id
        - name: If-Match
          in: header
          # the server returns 428 when this header is missing, so it is not required here
          required: false
          description: Quoted etag from the last read, for example "3f1c...". Required in practice; a missing header returns 428.
          schema:
            type: string
            title: If-Match
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduledRunConfigInput'
        required: true
      responses:
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '413':
          description: Request Entity Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '200':
          description: Successful Response
          headers:
            ETag:
              description: Quoted etag of the schedule after the update. Send it back as If-Match on the next update.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledRunOutput'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '412':
          description: Precondition Failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
