    HTTPError:
      type: object
      properties:
        detail:
          type: string
          description: Human-readable error message.
      required:
        - detail
      additionalProperties: false
      description: 'FastAPI HTTPException body: `{detail: string}`.'
    CodedHTTPError:
      type: object
      properties:
        detail:
          type: string
          description: Human-readable error message.
        code:
          type: string
          enum:
            - busy
            - pending
            - unconfirmed
            - unresolved
            - agent_unavailable
          description: >-
            Stable machine code for a refused main-thread provider switch or a message refused
            because one is pending; absent on other conflicts. `busy`: the main has open work or
            changed while the request ran. `pending`: a switch is pending and the request needs it
            settled or recoverable first. `unconfirmed`: kagent could not confirm the main idle, the
            old Session suspended, or the pending target absent. `unresolved`: a native create for
            the main is unresolved. `agent_unavailable`: the target Agent is missing or not ready.
      required:
        - detail
      additionalProperties: false
      description: '`{detail: string}` with an optional stable `code`.'
    TaskErrorDetail:
      type: object
      properties:
        reason:
          type: string
          description: Stable machine code, for example stale_task_attempt.
        limit:
          type: integer
          description: parent_capacity only.
        held_tasks:
          # no cap in the code: bounded by `limit`, which is configuration
          type: array
          items:
            $ref: '#/components/schemas/TaskCapacityHolder'
          description: 'parent_capacity only: tasks holding the capacity.'
        recovery:
          type: string
          description: 'parent_capacity only: how to free capacity.'
      required:
        - reason
      additionalProperties: true
      description: Task error payload. `reason` is always present; some reasons add detail fields.
    TaskCapacityHolder:
