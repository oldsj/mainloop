        - sessions
      summary: Set Session Effort
      description: >-
        Set, or clear (`null`, "default"), this session's reasoning-effort override. The level
        must be one the session's current provider offers (`GET /providers` lists each profile's
        `effort_levels`); any other level is `422`. Sticky until changed and durable across
        reloads and restarts. Takes effect from the session's next turn; a turn already sending
        keeps the value it started with. The main thread is a session like any other here.
      operationId: setSessionEffort
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionEffortRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionModelEffort'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
