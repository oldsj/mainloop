          title: Ports
          description: >-
            Preview ports for the project's workspaces, unique by name and number. A workspace
            created without its own dev.ports (tasks never send any) declares these, so its
            preview URLs and MAINLOOP_PREVIEW_URLS list them. At most 16, so the preview URLs fit
            one 4096-byte argument. Independent of the command: ports without a service are
            allowed.
