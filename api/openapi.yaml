      description: One model a provider profile offers, for /model's listing and autocomplete.
    ProviderProfile:
      properties:
        id:
          type: string
          maxLength: 80
          minLength: 1
          pattern: ^[a-z][a-z0-9_-]*$
          title: Id
        display_name:
          type: string
          maxLength: 200
          minLength: 1
          title: Display Name
        runtime_adapter:
          type: string
          const: kagent
          title: Runtime Adapter
          default: kagent
        native_provider:
          type: string
          enum:
            - claude
            - codex
          title: Native Provider
        configuration_revision:
          type: string
          minLength: 1
          title: Configuration Revision
        agents:
          additionalProperties:
            $ref: '#/components/schemas/ProviderAgentRef'
          propertyNames:
            enum:
              - main
              - supervisor
              - child
              - agent
              - agent-overflow
          type: object
          title: Agents
          description: >-
            The kagent Agent for each role. agent-overflow, when present, runs a code child task
            given an overflow capacity slot (TASK_MAX_CHILDREN_OVERFLOW) in place of agent, so it is
            placed on the overflow worker pool; without it such a task runs on agent.
        aliases:
          # no cap in the code: profile ids are unique, but their number is not limited
          items:
            type: string
            maxLength: 80
            minLength: 1
            pattern: ^[a-z][a-z0-9_-]*$
          type: array
          title: Aliases
          default: []
        enabled:
          type: boolean
          title: Enabled
          default: true
        capabilities:
          # no cap in the code: capability names are unique, but their number is not limited
          items:
            $ref: '#/components/schemas/CapabilityResult'
          type: array
          title: Capabilities
          default: []
        models:
          # no cap in the code: models are unique by id, but their number is not limited
          items:
            $ref: '#/components/schemas/ProviderModel'
          type: array
          title: Models
          default: []
        default_model:
          anyOf:
            - type: string
            - type: 'null'
          title: Default Model
          description: One of models' ids, or null when models is empty.
        effort_levels:
          # no cap in the code: levels are unique, but their number is not limited
          items:
            $ref: '#/components/schemas/EffortLevel'
          type: array
          title: Effort Levels
          default: []
        default_effort:
          anyOf:
            - $ref: '#/components/schemas/EffortLevel'
            - type: 'null'
          title: Default Effort
          description: One of effort_levels, or null when effort_levels is empty.
      additionalProperties: false
      type: object
      required:
        - id
        - display_name
        - native_provider
        - configuration_revision
        - agents
        - runtime_adapter
        - aliases
        - enabled
        - capabilities
        - models
        - default_model
        - effort_levels
        - default_effort
      title: ProviderProfile
