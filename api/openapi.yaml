      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/TranscriptEntry'
          maxItems: 500
        has_more:
          type: boolean
          description: Stored entries follow the last one returned.
        has_earlier:
          type: boolean
          description: Stored entries come before the first one returned.
