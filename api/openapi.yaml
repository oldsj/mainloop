      description: >-
        The owner-wide agent dotfiles source: a GitHub repository, a ref and a directory in it
        whose `AGENTS.md`, skills, subagents and commands every agent session receives as native
        user-level files (see docs/specs/agent-dotfiles.md). A project's own source, when set,
        replaces it for that project. With none set, `repository` is `null` at version 0.
