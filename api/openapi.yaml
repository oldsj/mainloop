# trunk-ignore-begin(checkov/CKV_OPENAPI_4,checkov/CKV_OPENAPI_5): no global security scheme; auth is
# network reachability plus the Host/Origin guards, so the empty security list is intended.
# Mainloop API contract, v1 (OpenAPI 3.1). Source of truth for the Go server and the React client.
# Baseline exported from the Python app; response typing and error schemas follow in C1b.
# Auth is not an HTTP security scheme: owner identity comes from network reachability plus the
# Host and Origin guards, so the root security requirement is empty on purpose.
openapi: 3.1.0
info:
  title: Mainloop API
  description: Mainloop control-plane API
  version: 0.2.0
servers:
  - url: /
security: []
# trunk-ignore-end(checkov/CKV_OPENAPI_4,checkov/CKV_OPENAPI_5)
tags:
  - name: health
    description: Liveness and orchestration-health rollups.
  - name: events
    description: Owner-scoped live update stream (server-sent events).
  - name: chat
    description: Main thread and chat delivery.
  - name: attention
    description: Needs-you items, activity and queue responses.
  - name: hitl
    description: Native approvals and questions, and observer status.
  - name: projects
    description: Projects, merge policy, provider preference and smoke data.
  - name: sessions
    description: Native-bound sessions and provider profiles.
  - name: workspaces
    description: Workspace lifecycle and preview ports.
  - name: environments
    description: Development environments, versions, grants and selection.
  - name: tasks
    description: Task reads, task operations and task actions.
# trunk-ignore-begin(checkov/CKV_OPENAPI_21): the other arrays have no code-level cap yet;
# C1b types the responses and copies the Pydantic limits, then this block is removed.
paths:
  /activity:
    get:
      tags:
        - attention
      summary: Owner Activity
      operationId: listActivity
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ActivityItem'
                type: array
                title: Response Owner Activity Activity Get
  /attention:
    get:
      tags:
        - attention
      summary: Owner Attention
      operationId: getAttention
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttentionSnapshot'
  /chat:
    post:
      tags:
        - chat
      summary: Chat
      description: Record and deliver a message to the user's native main session.
      operationId: sendMessage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /conversations/{conversation_id}:
    get:
      tags:
        - chat
      summary: Get Conversation
