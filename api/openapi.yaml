    # kagent ScheduledRunService (fork commit ce402bf): proto/kagent/api/v1alpha1/scheduled_runs.proto.
    # Field limits are copied from that file; cron and time-zone rules are from go/api/scheduledrun/schedule.go.
    ScheduledRunAgentRef:
      # kagent: common.proto ResourceReference (the agent to run)
      properties:
        namespace:
          type: string
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          title: Namespace
        name:
          type: string
          maxLength: 253
          minLength: 1
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
          title: Name
      additionalProperties: false
      type: object
      required:
        - namespace
        - name
      title: ScheduledRunAgentRef
    ScheduledRunConfigInput:
      # kagent ScheduledRunConfig, input side: omitted fields take kagent's defaults
      properties:
        name:
          type: string
          maxLength: 200
          title: Name
          default: ''
        schedule:
          type: string
          maxLength: 256
          minLength: 1
          title: Schedule
          description: Five-field cron expression (minute hour day-of-month month day-of-week). Macros such as @daily are rejected.
        time_zone:
          type: string
          maxLength: 253
          title: Time Zone
          default: UTC
          description: IANA time zone name, for example Europe/London. Blank means UTC; Local is rejected.
        prompt:
          type: string
          maxLength: 32768
          minLength: 1
          pattern: \S
          title: Prompt
          description: Sent to the agent on each firing. At most 32768 bytes; maxLength counts characters, so the server also checks the byte count.
        paused:
          type: boolean
          title: Paused
          default: false
          description: Pauses the schedule. Config changes apply only to executions reserved after the update.
        execution_timeout_seconds:
          type: number
          format: double
          minimum: 0.000001
          maximum: 9223372036
          title: Execution Timeout Seconds
          default: 900
          description: Includes queueing and provisioning. Default 900 (15 minutes); the minimum is one microsecond.
      additionalProperties: false
      type: object
      required:
        - schedule
        - prompt
      title: ScheduledRunConfigInput
    ScheduledRunConfigOutput:
      # kagent ScheduledRunConfig, output side: every field is always sent
      properties:
        name:
          type: string
          maxLength: 200
          title: Name
        schedule:
          type: string
          maxLength: 256
          minLength: 1
          title: Schedule
          description: Five-field cron expression (minute hour day-of-month month day-of-week).
        time_zone:
          type: string
          maxLength: 253
          title: Time Zone
        prompt:
          type: string
          maxLength: 32768
          minLength: 1
          pattern: \S
          title: Prompt
        paused:
          type: boolean
          title: Paused
        execution_timeout_seconds:
          type: number
          format: double
          minimum: 0.000001
          maximum: 9223372036
          title: Execution Timeout Seconds
      additionalProperties: false
      type: object
      required:
        - name
        - schedule
        - time_zone
        - prompt
        - paused
        - execution_timeout_seconds
      title: ScheduledRunConfigOutput
    ScheduledRunCreate:
      # kagent CreateScheduledRunRequest: agent, request_id (1-128) and config are required
      properties:
        request_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Request Id
          description: Idempotency key for this create. Use a new value per create; a retry must reuse it.
        agent:
          $ref: '#/components/schemas/ScheduledRunAgentRef'
        config:
          $ref: '#/components/schemas/ScheduledRunConfigInput'
      additionalProperties: false
      type: object
      required:
        - request_id
        - agent
        - config
      title: ScheduledRunCreate
    ScheduledRunOutput:
      # kagent ScheduledRun. Omitted on purpose: creator (always the caller), request_hash (internal)
      # and deleted_at (a deleted schedule is returned as 404).
      properties:
        id:
          type: string
          title: Id
          description: Schedule UUID.
        agent:
          $ref: '#/components/schemas/ScheduledRunAgentRef'
        config:
          $ref: '#/components/schemas/ScheduledRunConfigOutput'
        etag:
          type: string
          title: Etag
          description: UUID that changes on every update. Send it back quoted as If-Match.
        next_execution_time:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Next Execution Time
          description: Null when kagent has no next firing time.
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      additionalProperties: false
      type: object
      required:
        - id
        - agent
        - config
        - etag
        - next_execution_time
        - created_at
        - updated_at
      title: ScheduledRunOutput
    ScheduledRunTriggerRequest:
      # kagent TriggerScheduledRunRequest.request_id: 1-128 characters
      properties:
        request_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Request Id
          description: Idempotency key. A repeated request_id returns the execution it already created.
      additionalProperties: false
      type: object
      required:
        - request_id
      title: ScheduledRunTriggerRequest
    ScheduledRunExecutionOutput:
      # kagent ScheduledRunExecution. Omitted: creator (the schedule's owner) and the
      # UNSPECIFIED state, which a stored execution never has.
      properties:
        id:
          type: string
          title: Id
          description: Execution UUIDv7, so ids are time-ordered.
        scheduled_run_id:
          type: string
          title: Scheduled Run Id
        scheduled_time:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Scheduled Time
          description: Set for a cron firing; null for a manual trigger.
        manual_request_id:
          anyOf:
            - type: string
              maxLength: 128
              minLength: 1
            - type: 'null'
          title: Manual Request Id
          description: Set for a manual trigger; null for a cron firing.
        prompt:
          type: string
          title: Prompt
          description: The prompt this execution was reserved with.
        created_at:
          type: string
          format: date-time
          title: Created At
        deadline:
          type: string
          format: date-time
          title: Deadline
          description: When the execution times out if it has not finished.
        session_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Session Id
          description: The Mainloop session the execution became; null until it is adopted, which happens within one sweep period of kagent reserving a session for it. Kept after that session is deleted, so it is history, not proof the session still exists.
        state:
          type: string
          enum:
            - pending
            - running
            - succeeded
            - failed
            - timed_out
          title: State
        task_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Task Id
          description: Original A2A task. Null until set; does not change when the conversation continues.
        completed_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Completed At
        failure_reason:
          anyOf:
            - type: string
            - type: 'null'
          title: Failure Reason
          description: Stable explanation of a failure; null when there is none.
      additionalProperties: false
      type: object
      required:
        - id
        - scheduled_run_id
        - scheduled_time
        - manual_request_id
        - prompt
        - created_at
        - deadline
        - session_id
        - state
        - task_id
        - completed_at
        - failure_reason
      title: ScheduledRunExecutionOutput
    ScheduledRunPage:
      properties:
        items:
          # no cap in kagent beyond PageRequest.limit (at most 100 per page)
          items:
            $ref: '#/components/schemas/ScheduledRunOutput'
          type: array
          maxItems: 100
          title: Items
        next_page_token:
          anyOf:
            - type: string
              maxLength: 128
            - type: 'null'
          title: Next Page Token
          description: Send as page_token for the next page; null on the last page.
      additionalProperties: false
      type: object
      required:
        - items
