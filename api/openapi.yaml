  /projects/{project_id}/supervisor:
    post:
      tags:
        - projects
      summary: Start the project's standing supervisor
      description: >-
        Ensures the project's standing supervisor exists, creating it on first use, and answers its
        task. Idempotent: a project has one standing supervisor for its life, and a call when it
        exists answers the same task without changing it. See docs/specs/project-supervisor.md.
      operationId: ensureProjectSupervisor
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            title: Project Id
      responses:
        '200':
          description: The project's standing supervisor task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskError'
        '422':
          description: The project's provider profile cannot run a supervisor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskError'
  /projects/{project_id}/supervisor/restart:
    post:
      tags:
        - projects
      summary: Restart the project's standing supervisor
      description: >-
        Replaces the standing supervisor's attempt with a new one on the same task, in a new native
        session, keeping its children running (a rolling handoff). The new session's brief carries a
        continuation: the supervisor's last report, its open children and loops read from the
        database, and the newest messages it received after that report. With `fresh: true` (reset)
        the last report and messages are left out. Reuse request_id to retry. See
        docs/specs/project-supervisor.md.
      operationId: restartProjectSupervisor
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupervisorRestart'
      responses:
        '202':
          description: The restart's task operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskOperation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The project, or its standing supervisor, does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskError'
        '409':
          description: Conflict (an operation is pending, the supervisor is settling, or the request id was used with another body).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/HTTPValidationError'
                  - $ref: '#/components/schemas/TaskError'
  /projects/{project_id}/supervisor/retire:
    post:
      tags:
        - projects
      summary: Retire the project's standing supervisor
      description: >-
        Owner only. Ends the project's standing supervisor: its open children are cancelled now, and
        the supervisor is cancelled once its session is stopped (the operation drains until then).
        The project then has no supervisor; its next first use (POST /projects/{project_id}/supervisor,
        or main's supervisor_send) starts a new one, with no continuation. Reuse request_id to retry.
        See docs/specs/project-supervisor.md.
      operationId: retireProjectSupervisor
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupervisorRetire'
      responses:
        '202':
          description: The retire's task operation (kind cancel).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskOperation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The project does not exist, or has no standing supervisor that is not already retired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskError'
        '409':
          description: Conflict (the request id was used with another body).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/HTTPValidationError'
                  - $ref: '#/components/schemas/TaskError'
  /projects/{project_id}/supervisor/settings:
    get:
      tags:
        - projects
      summary: Get the project's supervisor settings
      description: >-
        The provider, model and effort of the project's standing supervisor: the project's own
        choices (null is the default) and what they resolve to. See
        docs/specs/project-supervisor.md#settings.
      operationId: getProjectSupervisorSettings
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            title: Project Id
      responses:
        '200':
          description: The project's supervisor settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupervisorSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The project does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskError'
    put:
      tags:
        - projects
      summary: Set the project's supervisor settings
      description: >-
        Replaces the provider, model and effort of the project's standing supervisor (null returns
        one to the default). They are validated as delegate validates them, against the provider
        they resolve to. A running supervisor takes a model or effort change in its current session
        at once; a provider change is a reassign handoff that keeps its children, whose operation is
        in the answer. A supervisor started later starts on them. Setting the same values changes
        nothing. See docs/specs/project-supervisor.md#settings.
      operationId: updateProjectSupervisorSettings
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupervisorSettingsUpdate'
      responses:
        '200':
          description: The project's supervisor settings after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupervisorSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The project does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskError'
        '409':
          description: >-
            Conflict: a provider change cannot hand the supervisor off now (an operation is pending,
            or the hourly restart limit for main is reached). Nothing was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskError'
        '422':
          description: >-
            Validation Error, or a provider, model or effort the resolved provider does not offer
            (provider_unknown, provider_role_unavailable, provider_disabled, model_unavailable with
            allowed_models, effort_unavailable with allowed_effort_levels).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/HTTPValidationError'
                  - $ref: '#/components/schemas/TaskError'
