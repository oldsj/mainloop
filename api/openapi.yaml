          type: string
          description: Empty until kagent's ForkSession is confirmed (accepted_at set).
        checkpoint_id:
          type: string
        requested_at:
          type: string
          format: date-time
          description: When this fork's intent was recorded.
        accepted_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          description: When kagent's ForkSession confirmed the forked Session.
        ready_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          description: >-
            When the forked runtime was observed READY: time-to-running is ready_at minus
