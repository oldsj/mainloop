        - checkpoint_id
        - requested_at
        - accepted_at
        - ready_at
      additionalProperties: false
    TaskAction:
      properties:
        request_id:
          type: string
          maxLength: 100
          minLength: 1
          title: Request Id
        expected_version:
          type: integer
          minimum: 1.0
          title: Expected Version
        expected_attempt_id:
          anyOf:
            - type: string
              maxLength: 100
              minLength: 1
            - type: 'null'
          title: Expected Attempt Id
      additionalProperties: false
      type: object
      required:
        - request_id
        - expected_version
        - expected_attempt_id
      title: TaskAction
    TaskFollowUp:
      properties:
        request_id:
          type: string
          maxLength: 100
          minLength: 1
          title: Request Id
        text:
          type: string
          maxLength: 8000
          minLength: 1
          title: Text
      additionalProperties: false
      type: object
      required:
        - request_id
        - text
      title: TaskFollowUp
    TaskFollowUpResult:
      properties:
        task_id:
          type: string
          title: Task Id
        attempt_id:
          type: string
          title: Attempt Id
        session_id:
          type: string
          title: Session Id
        message_id:
          type: string
          title: Message Id
