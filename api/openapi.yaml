      summary: List Session Defaults
      description: >-
        The owner's default model and reasoning effort for new turns, by role (`main` for the main
        thread, `worker` for every task session) and provider profile. A turn uses the session's
        own `/model` or `/effort` override when set, else the default for its role and provider,
        else the provider's own default. Read at each turn, so a change reaches running sessions
        from their next turn.
      operationId: listSessionDefaults
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDefaults'
        '401':
