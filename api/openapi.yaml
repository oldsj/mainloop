  /main-thread/provider:
    get:
      tags:
        - chat
      summary: Get Main Provider
      description: >-
        The owner's main-thread provider: the selection, the provider that is confirmed running,
        and the state of any switch in progress. Creates the main thread's database rows if they
        are missing; it contacts no provider.
      operationId: getMainProvider
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MainProviderInfo'
    put:
      tags:
        - chat
      summary: Select Main Provider
      description: >-
        Select Claude or Codex for the main thread. Owner API only; there is no MCP tool. A switch
        needs an idle main and returns 409 without changing anything otherwise. Repeating the same
        selection is idempotent and recovers a pending switch with the same create contract.
        `restart_failed` admits a fresh native identity only once the pending target was seen
        absent or settled failed or deleted (`recoverable`). The response is the resulting state:
        a switch whose preparation did not finish returns 200 with status `pending` or `failed`.
      operationId: putMainProvider
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MainProviderSelection'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
