  /sessions/{session_id}/transcript:
    get:
      tags:
        - transcripts
      summary: Get Session Transcript
      description: >-
        A session's stored transcript entries in the order they were copied, with how far copying
        has got. A page starts after an entry id (`after`), ends before one (`before`), or is the
        last entries (`latest`); entries are always oldest first. Once the page reaches the last
        stored entry, the response also carries a live tail: the turns kagent has not finished or
        Mainloop has not copied yet, read through kagent's control plane, redacted and capped the
        same way, and not stored.
      operationId: getSessionTranscript
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            title: Session Id
        - name: after
          in: query
          required: false
          description: Return entries after this entry id; 0 starts from the beginning.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
            title: After
        - name: before
          in: query
          required: false
          description: Return the entries just before this entry id. Not with `after` or `latest`.
          schema:
            type: integer
            format: int64
            minimum: 1
            title: Before
        - name: latest
          in: query
          required: false
          description: Return the last entries. Not with `after` or `before`.
          schema:
            type: boolean
            default: false
            title: Latest
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
            title: Limit
        - name: live
          in: query
          required: false
          description: Read the live tail from kagent when the page reaches the end.
          schema:
            type: boolean
            default: true
            title: Live
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTranscript'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
