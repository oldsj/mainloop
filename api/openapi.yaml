    post:
      tags:
        - owner-memory
      summary: Decide Owner Memory Entry
      description: >-
        The owner's decision on one entry. accept activates a proposal (replacing the active entry
        it names); reject declines one; keep confirms an active entry, or makes a lapsed one active
        again; forget ends an active or lapsed entry; moved ends one the owner moved to their
        dotfiles; move_to_project adds the text to the project's memory as an active entry and
