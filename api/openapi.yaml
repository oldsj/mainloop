components:
  schemas:
    ActivityItem:
      properties:
        id:
          type: string
          title: Id
        title:
          type: string
          title: Title
        content:
          type: string
          title: Content
        href:
          anyOf:
            - type: string
            - type: 'null'
          title: Href
        created_at:
          type: string
          format: date-time
          title: Created At
        queue_item_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Queue Item Id
          description: The queue item behind this row, if any. Pass it to `dismissQueueDiagnostic`.
        dismissible:
          type: boolean
          title: Dismissible
          description: True when the owner may dismiss this row (an input notice with no structured request). The server decides; clients do not copy the rule.
      type: object
      required:
        - id
        - title
        - content
        - created_at
        - href
        - queue_item_id
        - dismissible
      title: ActivityItem
    AskUserAnswer:
      properties:
        answer:
          items:
            type: string
            maxLength: 8192
          type: array
          maxItems: 100
          title: Answer
      additionalProperties: false
      type: object
      required:
        - answer
      title: AskUserAnswer
    AskUserResponse:
      properties:
        type:
          type: string
          const: ask_user_response
          title: Type
        id:
          type: string
          maxLength: 2048
          minLength: 1
          title: Id
        answers:
          items:
            $ref: '#/components/schemas/AskUserAnswer'
          type: array
          maxItems: 100
          minItems: 1
          title: Answers
      additionalProperties: false
      type: object
      required:
        - type
        - id
        - answers
      title: AskUserResponse
    AttentionItem:
      properties:
        reason_code:
          description: Closed reason for reconciliation or merge approval attention; absent for other sources.
          type: string
          enum:
            - reconciliation
            - runtime_stop_unresolved
            - merge_approval
        id:
          type: string
          title: Id
        kind:
          type: string
          enum:
            - approval
            - question
            - owner_decision
          title: Kind
        title:
          type: string
          title: Title
        needed:
          type: string
          title: Needed
        href:
          type: string
          title: Href
        session_ids:
          # no cap in the code: sessions behind one item; limited only by the owner's data
          items:
            type: string
          type: array
          title: Session Ids
        task_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Task Id
        queue_item:
          anyOf:
            - $ref: '#/components/schemas/QueueItem'
            - type: 'null'
      type: object
      required:
        - id
        - kind
        - title
        - needed
        - href
        - session_ids
        - task_id
        - queue_item
      title: AttentionItem
    AttentionSnapshot:
      properties:
        items:
          # no cap in the code: one entry per open item; not paginated
          items:
            $ref: '#/components/schemas/AttentionItem'
          type: array
          title: Items
        count:
          type: integer
          title: Count
          default: 0
        sessions:
          # the owner's session list (every unfinished session and the newest finished ones, as GET /sessions), each with its own needs_owner; not paginated
          items:
            $ref: '#/components/schemas/Session'
          type: array
          title: Sessions
      type: object
      title: AttentionSnapshot
      required:
        - items
        - count
        - sessions
    CapabilityResult:
      properties:
        capability:
          type: string
          minLength: 1
          title: Capability
        state:
          $ref: '#/components/schemas/CapabilityState'
          default: unknown
        scope:
          type: string
          enum:
            - fixture
            - live
            - unverified
          title: Scope
          default: unverified
        evidence_ref:
          anyOf:
            - type: string
              minLength: 1
            - type: 'null'
          title: Evidence Ref
        detail:
          anyOf:
            - type: string
            - type: 'null'
          title: Detail
      additionalProperties: false
      type: object
      required:
        - capability
        - state
        - scope
        - evidence_ref
        - detail
      title: CapabilityResult
    CapabilityState:
      type: string
      enum:
        - proved
        - partial
        - unsupported
        - unknown
      title: CapabilityState
    ChatRequest:
      properties:
        message:
          type: string
          title: Message
          description: User message
        conversation_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Conversation Id
          description: Existing conversation ID
      type: object
      required:
        - message
      title: ChatRequest
      description: Request model for sending a message.
    ChatResponse:
      properties:
        conversation_id:
          type: string
          title: Conversation Id
        message:
          anyOf:
            - $ref: '#/components/schemas/Message'
            - type: 'null'
        spawned_session_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Spawned Session Id
        pending:
          type: boolean
          title: Pending
          default: false
        delivery_message_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Delivery Message Id
      type: object
      required:
        - conversation_id
        - message
        - spawned_session_id
        - pending
        - delivery_message_id
      title: ChatResponse
      description: Response model for chat interaction.
    CommitSummary:
      properties:
        sha:
          type: string
          title: Sha
        message:
          type: string
          title: Message
        author:
          type: string
          title: Author
        date:
          type: string
          format: date-time
          title: Date
        url:
          type: string
          title: Url
      type: object
      required:
        - sha
        - message
        - author
        - date
        - url
      title: CommitSummary
      description: Summary of a commit.
    Conversation:
      properties:
        id:
          type: string
          title: Id
          description: Unique conversation ID
        user_id:
          type: string
          title: User Id
          description: Owner ID (the single configured owner)
        title:
          anyOf:
            - type: string
            - type: 'null'
          title: Title
          description: Conversation title
        summary:
          anyOf:
            - type: string
            - type: 'null'
          title: Summary
          description: Compacted summary of older messages
        summarized_through_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Summarized Through Id
          description: ID of last message included in summary
        message_count:
          type: integer
          title: Message Count
          description: Total message count for compaction threshold
          default: 0
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: Last update timestamp
      type: object
      required:
        - id
        - user_id
        - title
        - summary
        - summarized_through_id
        - message_count
        - created_at
        - updated_at
      title: Conversation
      description: A conversation thread.
    ConversationResponse:
      properties:
        conversation:
          $ref: '#/components/schemas/Conversation'
        messages:
          # no cap in the code: the whole transcript; not paginated
          items:
            $ref: '#/components/schemas/Message'
          type: array
          title: Messages
      type: object
      required:
        - conversation
        - messages
      title: ConversationResponse
      description: Response model for conversation with messages.
    CreateWorkspaceRequest:
      properties:
        project_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Project Id
        repo:
          anyOf:
            - type: string
            - type: 'null'
          title: Repo
        branch:
          type: string
          title: Branch
          default: ''
        ref:
          type: string
          title: Ref
          default: ''
        depth:
          type: integer
          maximum: 1000.0
          minimum: 0.0
          title: Depth
          default: 0
        dev:
          $ref: '#/components/schemas/WorkspaceDev'
          default:
            ports: []
            idle_timeout_minutes: 30
        agent_kind:
          type: string
          maxLength: 80
          minLength: 1
          pattern: ^[a-z][a-z0-9_-]*$
          title: Agent Kind
          default: claude
      additionalProperties: false
      type: object
      title: CreateWorkspaceRequest
    DefinitionReference:
      properties:
        repository:
          type: string
          maxLength: 2048
          minLength: 1
          title: Repository
        commit_sha:
          type: string
          pattern: ^[0-9a-f]{40}$
          title: Commit Sha
        path:
          type: string
          maxLength: 1024
          minLength: 1
          title: Path
      additionalProperties: false
      type: object
      required:
        - repository
        - commit_sha
        - path
      title: DefinitionReference
    GrantRequest:
      properties:
        permission:
          type: string
          enum:
            - use
            - derive
          title: Permission
      additionalProperties: false
      type: object
      required:
        - permission
      title: GrantRequest
    HITLDecisionInput:
      properties:
        action_id:
          type: string
          maxLength: 2048
          minLength: 1
          title: Action Id
        response:
          oneOf:
            - $ref: '#/components/schemas/ToolApprovalResponse'
            - $ref: '#/components/schemas/AskUserResponse'
          title: Response
          discriminator:
            propertyName: type
            mapping:
              ask_user_response: '#/components/schemas/AskUserResponse'
              tool_approval_response: '#/components/schemas/ToolApprovalResponse'
      additionalProperties: false
      type: object
      required:
        - action_id
        - response
      title: HITLDecisionInput
    HTTPValidationError:
      properties:
        detail:
          # no cap in the code: FastAPI-generated validation error list
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    TopicLine:
      type: object
      properties:
        name:
          type: string
        status_line:
          type: string
        pending:
          type: integer
          minimum: 0
          description: Open pending records in the topic.
      required:
        - name
        - status_line
        - pending
      additionalProperties: false
    MainProvider:
      type: string
      enum:
        - claude
        - codex
      title: MainProvider
    MainProviderSelection:
      properties:
        provider:
          $ref: '#/components/schemas/MainProvider'
        restart_failed:
          type: boolean
          title: Restart Failed
          default: false
          description: >-
            Admit a fresh native identity for a pending target that is `recoverable`. Ignored
            otherwise: the original create contract is recovered.
      type: object
      required:
        - provider
      additionalProperties: false
      title: MainProviderSelection
    MainProviderHistoryEntry:
      properties:
        provider:
          type: string
          title: Provider
        kagent_session_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Kagent Session Id
      type: object
      required:
        - provider
        - kagent_session_id
      title: MainProviderHistoryEntry
    MainProviderInfo:
      properties:
        session_id:
          type: string
          title: Session Id
        desired_provider:
          $ref: '#/components/schemas/MainProvider'
        effective_provider:
          anyOf:
            - $ref: '#/components/schemas/MainProvider'
            - type: 'null'
          description: The provider whose native Session is confirmed; null while none is.
        status:
          type: string
          enum:
            - not_started
            - pending
            - ready
            - failed
          title: Status
        kagent_session_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Kagent Session Id
        error:
          anyOf:
            - type: string
              maxLength: 300
            - type: 'null'
          title: Error
        recoverable:
          type: boolean
          title: Recoverable
          default: false
        history:
          # one entry per provider switch of the main thread; not paginated
          items:
            $ref: '#/components/schemas/MainProviderHistoryEntry'
          type: array
          title: History
          default: []
      type: object
      required:
        - session_id
        - desired_provider
        - effective_provider
        - status
        - kagent_session_id
        - error
        - recoverable
        - history
      title: MainProviderInfo
    MainThreadInfo:
      properties:
        mode:
          type: string
          title: Mode
        session_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Session Id
        conversation_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Conversation Id
        native:
          anyOf:
            - $ref: '#/components/schemas/NativeSessionInfo'
            - type: 'null'
        provider:
          anyOf:
            - $ref: '#/components/schemas/MainProviderInfo'
            - type: 'null'
          description: The main-provider state; null before the main thread exists.
        topics:
          # no cap in the code: one entry per topic; not paginated
          items:
            $ref: '#/components/schemas/TopicLine'
          type: array
          title: Topics
          default: []
      type: object
      required:
        - mode
        - session_id
        - conversation_id
        - native
        - provider
        - topics
      title: MainThreadInfo
    MergePolicy:
      type: string
      enum:
        - auto
        - approval
      title: MergePolicy
    MergePolicyUpdate:
      properties:
        merge_policy:
          $ref: '#/components/schemas/MergePolicy'
        expected_version:
          type: integer
          minimum: 1.0
          title: Expected Version
      additionalProperties: false
      type: object
      required:
        - merge_policy
        - expected_version
      title: MergePolicyUpdate
    MergePolicyView:
      properties:
        writes_enabled:
          type: boolean
          title: Writes Enabled
          default: false
        merge_policy:
          $ref: '#/components/schemas/MergePolicy'
        merge_policy_version:
          type: integer
          minimum: 1.0
          title: Merge Policy Version
        protected_globs:
          items:
            type: string
          type: array
          title: Protected Globs
          default:
            - k8s/**
            - .github/**
            - '**/migrations/**'
          maxItems: 3
        protected_globs_version:
          type: integer
          const: 1
          title: Protected Globs Version
          default: 1
      type: object
      required:
        - merge_policy
        - merge_policy_version
        - writes_enabled
        - protected_globs
        - protected_globs_version
      title: MergePolicyView
    Message:
      properties:
        id:
          type: string
          title: Id
          description: Unique message ID
        conversation_id:
          type: string
          title: Conversation Id
          description: Parent conversation ID
        role:
          type: string
          enum:
            - user
            - assistant
          title: Role
          description: Message role
        content:
          type: string
          title: Content
          description: Message content
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Creation timestamp
      type: object
      required:
        - id
        - conversation_id
        - role
        - content
        - created_at
      title: Message
      description: A single message in a conversation.
    NativeDeliveryInfo:
      properties:
        message_id:
          type: string
          title: Message Id
        state:
          type: string
          title: State
          description: queued|recorded|sending|delivered|completed|uncertain|failed|cancelled
        task_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Task Id
        evidence_ref:
          anyOf:
            - type: string
            - type: 'null'
          title: Evidence Ref
        detail:
          anyOf:
            - type: string
            - type: 'null'
          title: Detail
        source:
          type: string
          title: Source
          default: user
      type: object
      required:
        - message_id
        - state
        - task_id
        - evidence_ref
        - detail
        - source
      title: NativeDeliveryInfo
      description: Delivery ledger row for one message sent to a native agent.
    NativePreparationTimestamp:
      properties:
        seconds:
          type: integer
          format: int64
          minimum: -62135596800
          maximum: 253402300799
          title: Seconds
        nanos:
          type: integer
          minimum: 0
          maximum: 999999999
          title: Nanos
      type: object
      required:
        - seconds
        - nanos
      additionalProperties: false
      title: NativePreparationTimestamp
      description: Present protobuf Timestamp, retaining epoch zero and nanosecond precision.
    NativeRuntimeAssociationInfo:
      properties:
        generation_id:
          type: string
          maxLength: 256
          minLength: 1
          pattern: ^[^\x00-\x1f\x7f]+$
          title: Generation Id
        actor_uid:
          type: string
          maxLength: 256
          minLength: 1
          pattern: ^[^\x00-\x1f\x7f]+$
          title: Actor Uid
        phase:
          type: string
          maxLength: 256
          minLength: 1
          pattern: ^[^\x00-\x1f\x7f]+$
          title: Phase
        current_active:
          type: boolean
          title: Current Active
      type: object
      required:
        - generation_id
        - actor_uid
        - phase
        - current_active
      additionalProperties: false
      title: NativeRuntimeAssociationInfo
      description: Observed active runtime identity; absence does not prove replacement.
    NativePreparationActionInfo:
      properties:
        session_id:
          type: string
          maxLength: 256
          minLength: 1
          pattern: ^[^\x00-\x1f\x7f]+$
          title: Session Id
        action_id:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9:._-]+$
          title: Action Id
        create_request_id:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[^\x00-\x1f\x7f]+$
          title: Create Request Id
        generation_id:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[^\x00-\x1f\x7f]+$
          title: Generation Id
        actor_uid:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[^\x00-\x1f\x7f]+$
          title: Actor Uid
        prepared_revision:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[^\x00-\x1f\x7f]+$
          title: Prepared Revision
        setup_profile:
          type: string
          enum:
            - supervisor
            - child
            - agent
          title: Setup Profile
        setup_digest:
          type: string
          pattern: ^[a-f0-9]{64}$
          title: Setup Digest
      type: object
      required:
        - session_id
      additionalProperties: false
