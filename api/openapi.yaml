    # kagent ScheduledRunService (fork commit ce402bf): proto/kagent/api/v1alpha1/scheduled_runs.proto.
    # Field limits are copied from that file; cron and time-zone rules are from go/api/scheduledrun/schedule.go.
    ScheduledRunAgentRef:
      # kagent: common.proto ResourceReference (the agent to run)
      properties:
        namespace:
          type: string
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          title: Namespace
        name:
          type: string
          maxLength: 253
          minLength: 1
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
          title: Name
      additionalProperties: false
      type: object
      required:
        - namespace
        - name
      title: ScheduledRunAgentRef
    ScheduledRunConfigInput:
      # kagent ScheduledRunConfig, input side: omitted fields take kagent's defaults
      properties:
        name:
          type: string
          maxLength: 200
          title: Name
          default: ''
        schedule:
          type: string
          maxLength: 256
          minLength: 1
          title: Schedule
          description: Five-field cron expression (minute hour day-of-month month day-of-week). Macros such as @daily are rejected.
        time_zone:
          type: string
          maxLength: 253
          title: Time Zone
          default: UTC
          description: IANA time zone name, for example Europe/London. Blank means UTC; Local is rejected.
        prompt:
          type: string
          maxLength: 32768
          minLength: 1
          pattern: \S
          title: Prompt
          description: Sent to the agent on each firing. At most 32768 bytes; maxLength counts characters, so the server also checks the byte count.
        paused:
          type: boolean
          title: Paused
          default: false
          description: Pauses the schedule. Config changes apply only to executions reserved after the update.
        execution_timeout_seconds:
          type: number
          format: double
          minimum: 0.000001
          maximum: 9223372036
          title: Execution Timeout Seconds
          default: 900
          description: Includes queueing and provisioning. Default 900 (15 minutes); the minimum is one microsecond.
      additionalProperties: false
      type: object
      required:
        - schedule
        - prompt
      title: ScheduledRunConfigInput
    ScheduledRunConfigOutput:
      # kagent ScheduledRunConfig, output side: every field is always sent
      properties:
        name:
          type: string
          maxLength: 200
          title: Name
        schedule:
          type: string
          maxLength: 256
          minLength: 1
          title: Schedule
          description: Five-field cron expression (minute hour day-of-month month day-of-week).
        time_zone:
          type: string
          maxLength: 253
          title: Time Zone
        prompt:
          type: string
          maxLength: 32768
          minLength: 1
          pattern: \S
          title: Prompt
        paused:
          type: boolean
          title: Paused
        execution_timeout_seconds:
          type: number
          format: double
          minimum: 0.000001
          maximum: 9223372036
          title: Execution Timeout Seconds
      additionalProperties: false
      type: object
      required:
        - name
        - schedule
        - time_zone
        - prompt
        - paused
        - execution_timeout_seconds
      title: ScheduledRunConfigOutput
    ScheduledRunCreate:
      # kagent CreateScheduledRunRequest: agent, request_id (1-128) and config are required
      properties:
        request_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Request Id
          description: Idempotency key for this create. Use a new value per create; a retry must reuse it.
        agent:
          $ref: '#/components/schemas/ScheduledRunAgentRef'
        config:
          $ref: '#/components/schemas/ScheduledRunConfigInput'
      additionalProperties: false
      type: object
      required:
        - request_id
        - agent
        - config
      title: ScheduledRunCreate
    ScheduledRunOutput:
      # kagent ScheduledRun. Omitted on purpose: creator (always the caller), request_hash (internal)
      # and deleted_at (a deleted schedule is returned as 404).
      properties:
        id:
          type: string
          title: Id
          description: Schedule UUID.
        agent:
          $ref: '#/components/schemas/ScheduledRunAgentRef'
        config:
          $ref: '#/components/schemas/ScheduledRunConfigOutput'
        etag:
          type: string
          title: Etag
          description: UUID that changes on every update. Send it back quoted as If-Match.
        next_execution_time:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Next Execution Time
          description: Null when kagent has no next firing time.
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      additionalProperties: false
      type: object
      required:
        - id
        - agent
        - config
        - etag
        - next_execution_time
        - created_at
        - updated_at
      title: ScheduledRunOutput
    ScheduledRunTriggerRequest:
      # kagent TriggerScheduledRunRequest.request_id: 1-128 characters
      properties:
        request_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Request Id
          description: Idempotency key. A repeated request_id returns the execution it already created.
      additionalProperties: false
      type: object
      required:
        - request_id
      title: ScheduledRunTriggerRequest
    ScheduledRunExecutionOutput:
      # kagent ScheduledRunExecution. Omitted: creator (the schedule's owner) and the
      # UNSPECIFIED state, which a stored execution never has.
      properties:
        id:
          type: string
          title: Id
          description: Execution UUIDv7, so ids are time-ordered.
        scheduled_run_id:
          type: string
          title: Scheduled Run Id
        scheduled_time:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Scheduled Time
          description: Set for a cron firing; null for a manual trigger.
        manual_request_id:
          anyOf:
            - type: string
              maxLength: 128
              minLength: 1
            - type: 'null'
          title: Manual Request Id
          description: Set for a manual trigger; null for a cron firing.
        prompt:
          type: string
          title: Prompt
          description: The prompt this execution was reserved with.
        created_at:
          type: string
          format: date-time
          title: Created At
        deadline:
          type: string
          format: date-time
          title: Deadline
          description: When the execution times out if it has not finished.
        session_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Session Id
          description: The Mainloop session the execution became; null until it is adopted, which happens within one sweep period of kagent reserving a session for it. Kept after that session is deleted, so it is history, not proof the session still exists.
        state:
          type: string
          enum:
            - pending
            - running
            - succeeded
            - failed
            - timed_out
          title: State
        task_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Task Id
          description: Original A2A task. Null until set; does not change when the conversation continues.
        completed_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Completed At
        failure_reason:
          anyOf:
            - type: string
            - type: 'null'
          title: Failure Reason
          description: Stable explanation of a failure; null when there is none.
      additionalProperties: false
      type: object
      required:
        - id
        - scheduled_run_id
        - scheduled_time
        - manual_request_id
        - prompt
        - created_at
        - deadline
        - session_id
        - state
        - task_id
        - completed_at
        - failure_reason
      title: ScheduledRunExecutionOutput
    ScheduledRunPage:
      properties:
        items:
          # no cap in kagent beyond PageRequest.limit (at most 100 per page)
          items:
            $ref: '#/components/schemas/ScheduledRunOutput'
          type: array
          maxItems: 100
          title: Items
        next_page_token:
          anyOf:
            - type: string
              maxLength: 128
            - type: 'null'
          title: Next Page Token
          description: Send as page_token for the next page; null on the last page.
      additionalProperties: false
      type: object
      required:
        - items
        - next_page_token
      title: ScheduledRunPage
    ScheduledRunExecutionPage:
      properties:
        items:
          # kagent PageRequest.limit is at most 100 per page
          items:
            $ref: '#/components/schemas/ScheduledRunExecutionOutput'
          type: array
          maxItems: 100
          title: Items
        next_page_token:
          anyOf:
            - type: string
              maxLength: 128
            - type: 'null'
          title: Next Page Token
          description: Send as page_token for the next page; null on the last page.
      additionalProperties: false
      type: object
      required:
        - items
        - next_page_token
      title: ScheduledRunExecutionPage
    SelectEnvironment:
      properties:
        environment_id:
          type: string
          title: Environment Id
        version_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Version Id
        follow_default:
          type: boolean
          title: Follow Default
          default: false
        expected_version:
          type: integer
          minimum: 0.0
          title: Expected Version
      additionalProperties: false
      type: object
      required:
        - environment_id
        - expected_version
      title: SelectEnvironment
    Session:
      properties:
        id:
          type: string
          title: Id
          description: Unique session ID
        user_id:
          type: string
          title: User Id
          description: Owner ID (the single configured owner)
        title:
          type: string
          title: Title
          description: Short title for the session
        description:
          type: string
          title: Description
          description: What the session is for
        prompt:
          type: string
          title: Prompt
          description: Initial prompt that started the session
        parent_session_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Parent Session Id
          description: Parent session (delegation)
        topic:
          anyOf:
            - type: string
            - type: 'null'
          title: Topic
          description: Topic this session works for
        agent_kind:
          anyOf:
            - type: string
              maxLength: 80
              minLength: 1
              pattern: ^[a-z][a-z0-9_-]*$
            - type: 'null'
          title: Agent Kind
          description: Native runtime kind from the session binding
        status:
          $ref: '#/components/schemas/SessionStatus'
          description: Session status
          default: pending
        needs_owner:
          type: boolean
          title: Needs Owner
          description: Current owner attention projection
          default: false
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Creation timestamp
        started_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Started At
          description: Start timestamp
        completed_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Completed At
          description: Completion timestamp
        archived_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Archived At
          description: When the session was cleared from the list; kept for audit, never deleted
        summary:
          anyOf:
            - type: string
            - type: 'null'
          title: Summary
          description: Summary posted to main thread on completion
        error:
          anyOf:
            - type: string
            - type: 'null'
          title: Error
          description: Error message if failed
        repo_url:
          anyOf:
            - type: string
            - type: 'null'
          title: Repo Url
          description: GitHub repository URL
        project_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Project Id
          description: Associated project ID
        branch_name:
          anyOf:
            - type: string
            - type: 'null'
          title: Branch Name
          description: Branch to create/work on
        base_branch:
          type: string
          title: Base Branch
          description: Base ref; empty means the remote's default branch
          default: main
        model:
          anyOf:
            - type: string
            - type: 'null'
          title: Model
          description: Claude model to use (haiku, sonnet, opus)
        commit_sha:
          anyOf:
            - type: string
            - type: 'null'
          title: Commit Sha
          description: Final commit SHA
        color:
          anyOf:
            - type: string
            - type: 'null'
          title: Color
          description: Assigned color for inline display (hex or name)
        result:
          anyOf:
            - additionalProperties: true
              type: object
            - type: 'null'
          title: Result
          description: Session result data
      type: object
      required:
        - user_id
        - title
        - description
        - prompt
        - id
        - parent_session_id
        - topic
        - agent_kind
        - status
        - needs_owner
        - created_at
        - started_at
        - completed_at
        - archived_at
        - summary
        - error
        - repo_url
        - project_id
        - branch_name
        - base_branch
        - model
        - commit_sha
        - color
        - result
      title: Session
      description: |-
        A background task that runs independently from the main thread.

        Sessions can be:
        - Simple Claude conversations (no repo_url)
        - Code work with GitHub integration (with repo_url)

        Both types have their own conversation and can notify the user when input is needed.
    SessionConversationResponse:
      properties:
        session:
          $ref: '#/components/schemas/Session'
        messages:
          # no cap in the code: the whole transcript; not paginated
          items:
            $ref: '#/components/schemas/Message'
          type: array
          title: Messages
      type: object
      required:
        - session
        - messages
      title: SessionConversationResponse
      description: Response for session conversation.
    SessionCreate:
      properties:
        title:
          type: string
          title: Title
          description: Short title for the session
        description:
          type: string
          title: Description
          description: What the session is for
        prompt:
          type: string
          title: Prompt
          description: Initial prompt for the session
        repo_url:
          anyOf:
            - type: string
            - type: 'null'
          title: Repo Url
          description: GitHub repository URL for code work
        agent_kind:
          anyOf:
            - type: string
              maxLength: 80
              minLength: 1
              pattern: ^[a-z][a-z0-9_-]*$
            - type: 'null'
          title: Agent Kind
          description: Native agent kind; defaults to Claude Code
        model:
          anyOf:
            - type: string
              pattern: ^[A-Za-z0-9._:/-]{1,200}$
            - type: 'null'
          title: Model
          description: >-
            The session's model override, set before its first turn (as `POST
            /sessions/{session_id}/model` would set it afterwards). Omitted or null: the provider's
            default. kagent validates the model when the turn starts.
        hidden:
          type: boolean
          title: Hidden
          description: >-
            A session Mainloop runs for itself, such as the canary: left out of `GET /sessions`
            (and the session list the attention snapshot carries) unless `hidden=true` is asked
            for. Set at create only.
      type: object
      required:
        - title
        - description
        - prompt
      title: SessionCreate
      description: Request to create a new session.
    SessionMessageRequest:
      properties:
        message:
          type: string
          title: Message
        message_id:
          type: string
          format: uuid
          title: Message Id
          description: >-
            The client's id for the message, its idempotency key: sending the same id again returns the
            first result and records nothing twice. Omitted, the server picks one.
        steer:
          type: boolean
          title: Steer
          description: >-
            Join the session's running turn at its next tool boundary, as a message typed while Claude
            Code works does, instead of queueing behind it. It joins only when the session's agent
            takes steers, a turn is running, and the message is not a slash command; otherwise it is an
            ordinary message. A steer that cannot join after all runs as the next turn, once.
      type: object
      required:
        - message
      title: SessionMessageRequest
      description: Request to send a message to a session.
    SessionModelRequest:
      properties:
        model:
          anyOf:
            - type: string
              pattern: ^[A-Za-z0-9._:/-]{1,200}$
            - type: 'null'
          title: Model
      type: object
      required:
        - model
      title: SessionModelRequest
      description: Request to set (or, null, clear) a session's model override.
    SessionEffortRequest:
      properties:
        effort:
          anyOf:
            - $ref: '#/components/schemas/EffortLevel'
            - type: 'null'
          title: Effort
      type: object
      required:
        - effort
      title: SessionEffortRequest
      description: Request to set (or, null, clear) a session's reasoning-effort override.
    SessionDefaultRole:
      type: string
      enum:
        - main
        - worker
      title: SessionDefaultRole
      description: Which sessions a default applies to, the main thread or every task session.
    Seen:
      additionalProperties: false
      properties:
        since:
          format: date-time
          type: string
          title: Since
          description: When the owner's record started; a task that last changed before it is seen.
        last_visit:
          anyOf:
            - format: date-time
              type: string
            - type: 'null'
          title: Last Visit
          description: The most recent recorded visit.
        previous_visit:
          anyOf:
            - format: date-time
              type: string
            - type: 'null'
          title: Previous Visit
          description: The visit before last_visit.
        tasks:
          items:
            $ref: '#/components/schemas/SeenTask'
          type: array
          title: Tasks
      required:
        - since
        - last_visit
        - previous_visit
        - tasks
      title: Seen
      type: object
    SeenTask:
      additionalProperties: false
      properties:
        task_id:
          maxLength: 100
          minLength: 1
          title: Task Id
          type: string
        seen_at:
          format: date-time
          type: string
          title: Seen At
      required:
        - task_id
        - seen_at
      title: SeenTask
      type: object
    SessionDefault:
      properties:
        role:
          $ref: '#/components/schemas/SessionDefaultRole'
        provider:
          type: string
          maxLength: 80
          minLength: 1
          pattern: ^[a-z][a-z0-9_-]*$
          title: Provider
          description: A provider profile id (`GET /providers`).
        model:
          anyOf:
            - type: string
              pattern: ^[A-Za-z0-9._:/-]{1,200}$
            - type: 'null'
          title: Model
        effort:
          anyOf:
            - $ref: '#/components/schemas/EffortLevel'
            - type: 'null'
          title: Effort
      type: object
      required:
        - role
        - provider
        - model
        - effort
      title: SessionDefault
      description: The default model and effort for one role and provider profile.
    SessionDefaults:
      properties:
        defaults:
          # bounded by roles (2) x configured provider profiles
          items:
            $ref: '#/components/schemas/SessionDefault'
          type: array
          title: Defaults
      type: object
      required:
        - defaults
      title: SessionDefaults
      description: Every session default the owner set.
    SessionModelEffort:
      properties:
        session_id:
          type: string
          title: Session Id
        model:
          anyOf:
            - type: string
            - type: 'null'
          title: Model
        effort:
          anyOf:
            - $ref: '#/components/schemas/EffortLevel'
            - type: 'null'
          title: Effort
      type: object
      required:
        - session_id
        - model
        - effort
      title: SessionModelEffort
      description: A session's model and reasoning-effort override state, after a write.
    SessionWebFetchRequest:
      properties:
        enabled:
          type: boolean
          title: Enabled
      additionalProperties: false
      type: object
      required:
        - enabled
      title: SessionWebFetchRequest
    SessionWebFetch:
      properties:
        session_id:
          type: string
          title: Session Id
        enabled:
          type: boolean
          title: Enabled
          description: The session's own flag, which POST /sessions/{session_id}/web-fetch sets.
        from_task:
          type: boolean
          title: From Task
          description: The task this session runs was created with web_fetch, which this flag cannot turn off.
      type: object
      required:
        - session_id
        - enabled
        - from_task
      title: SessionWebFetch
      description: >-
        Whether a session's agent holds the open-web web_fetch tool: it does when either flag is
        set (docs/specs/web-fetch.md).
    SessionDotfiles:
      properties:
        status:
          type: string
          enum:
            - ready
            - none
            - unavailable
            - refused
          title: Status
          description: |-
            `ready`: the source's directory at `commit` was exported; `digest` names the bundle.
            `none`: no source applies to the session. `unavailable`: the source could not be read
            when the Session was created (see `reason`). `refused`: the commit's directory cannot be
            exported (see `reason`).
        reason:
          type: string
          maxLength: 64
          title: Reason
          description: Why there is no bundle, empty when `status` is `ready` or `none`. One of `app_not_installed`, `ref_not_found`, `repository_unavailable`, `over_limits`, `unsupported_file`, `nothing_to_export`, `secret_found` or `invalid_settings`.
        repository:
          type: string
          maxLength: 140
          title: Repository
          description: The source's repository, "owner/name"; empty when `status` is `none`.
        ref:
          type: string
          maxLength: 255
          title: Ref
          description: The configured branch, tag or commit; empty means the default branch.
        path:
          type: string
          maxLength: 255
          title: Path
          description: The configured directory; empty means the repository root.
        commit:
          anyOf:
            - type: string
              pattern: ^[0-9a-f]{40}$
            - type: 'null'
          title: Commit
          description: The commit `ref` named when the dotfiles were pinned.
        digest:
          anyOf:
            - type: string
              pattern: ^sha256:[0-9a-f]{64}$
            - type: 'null'
          title: Digest
          description: The SHA-256 of the exported bundle, when `status` is `ready`.
      additionalProperties: false
      type: object
      required:
        - status
        - reason
        - repository
        - ref
        - path
        - commit
        - digest
      title: SessionDotfiles
      description: The agent dotfiles a native Session holds, pinned when its create was first sent or by its latest applied refresh; a fork has its source's.
    SessionStatus:
      type: string
      enum:
        - pending
        - active
        - idle
        - superseded
        - completed
        - failed
        - cancelled
        - waiting_on_user
      title: SessionStatus
      description: Status of a session.
    CheckpointState:
      type: string
