      summary: Read Events
      operationId: healthEvents
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
            title: Session Id
        - name: hours
          in: query
          required: false
          schema:
            type: integer
            maximum: 8760
            minimum: 1
            default: 24
