      summary: Set Session Model
      description: >-
        Set, or clear (`null`, "default"), this session's model override: which model its native
        provider's next turn runs on. Sticky until changed and durable across reloads and restarts.
        Takes effect from the session's next turn; a turn already sending keeps the value it
        started with. The main thread is a session like any other here. kagent validates the model
        itself and rejects an unknown one when the turn starts (see the delivery's failure detail),
