            type: string
            title: Project Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /environments/{environment_id}/refresh:
    post:
      tags:
        - environments
      summary: Refresh Tag
      operationId: refreshEnvironment
      parameters:
        - name: environment_id
          in: path
