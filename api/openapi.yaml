  /orchestration-health:
    get:
      tags:
        - health
      summary: Read Health
      operationId: orchestrationHealth
      parameters:
        - name: project_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Project Id
        - name: task_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Task Id
        - name: session_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Session Id
        - name: attempt_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Attempt Id
        - name: provider
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                pattern: ^(claude|codex)$
              - type: 'null'
            title: Provider
        - name: hours
          in: query
          required: false
          schema:
            type: integer
            maximum: 8760
            minimum: 1
            default: 24
