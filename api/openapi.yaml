# trunk-ignore-begin(checkov/CKV_OPENAPI_4,checkov/CKV_OPENAPI_5): no global security scheme; auth is
# network reachability plus the Host/Origin guards, so the empty security list is intended.
# Mainloop API contract, v1 (OpenAPI 3.1). Source of truth for the Go server and the React client.
# Exported from the Python app, then typed: every response has a schema, errors are HTTPError or
# TaskError, and Pydantic limits are copied in.
# Auth is not an HTTP security scheme: owner identity comes from network reachability plus the
# Host and Origin guards, so the root security requirement is empty on purpose.
openapi: 3.1.0
info:
  title: Mainloop API
  description: Mainloop control-plane API
  version: 0.2.0
servers:
  - url: /
security: []
# trunk-ignore-end(checkov/CKV_OPENAPI_4,checkov/CKV_OPENAPI_5)
tags:
  - name: health
    description: Liveness and orchestration-health rollups.
  - name: events
    description: Owner-scoped live update stream (server-sent events).
  - name: chat
    description: Main thread and chat delivery.
  - name: attention
    description: Needs-you items, activity and queue responses.
  - name: hitl
    description: Native approvals and questions, and observer status.
  - name: projects
    description: Projects, merge policy, provider preference and smoke data.
  - name: sessions
    description: Native-bound sessions and provider profiles.
  - name: workspaces
    description: Workspace lifecycle and preview ports.
  - name: environments
    description: Development environments, versions, grants and selection.
  - name: tasks
    description: Task reads, task operations and task actions.
paths:
  /activity:
    get:
      tags:
        - attention
      summary: Owner Activity
      operationId: listActivity
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ActivityItem'
                type: array
                title: Response Owner Activity Activity Get
                maxItems: 100
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
  /attention:
    get:
      tags:
        - attention
      summary: Owner Attention
      operationId: getAttention
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttentionSnapshot'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
  /chat:
    post:
      tags:
        - chat
      summary: Chat
      description: Record and deliver a message to the user's native main session.
      operationId: sendMessage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /conversations/{conversation_id}:
    get:
      tags:
        - chat
      summary: Get Conversation
      description: Get a conversation with its messages.
      operationId: getConversation
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
            title: Conversation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /environments:
    get:
      tags:
        - environments
      summary: List Environments
      operationId: listEnvironments
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                # trunk-ignore(checkov/CKV_OPENAPI_21): no cap in the code: unpaginated owner-scoped list
                type: array
                items:
                  $ref: '#/components/schemas/DevEnvironment'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
    post:
      tags:
        - environments
      summary: Register
      operationId: registerEnvironment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterEnvironment'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredEnvironment'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/HTTPValidationError'
                  - $ref: '#/components/schemas/HTTPError'
  /environments/{environment_id}:
    get:
      tags:
        - environments
      summary: Get Environment
      operationId: getEnvironment
      parameters:
        - name: environment_id
          in: path
          required: true
          schema:
            type: string
            title: Environment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevEnvironment'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /environments/{environment_id}/default:
    put:
      tags:
        - environments
      summary: Set Default
      operationId: acceptEnvironmentDefault
      parameters:
        - name: environment_id
          in: path
          required: true
          schema:
            type: string
            title: Environment Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevEnvironment'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/HTTPValidationError'
                  - $ref: '#/components/schemas/HTTPError'
  /environments/{environment_id}/grants/{project_id}:
    put:
      tags:
        - environments
      summary: Grant
      operationId: grantEnvironmentToProject
      parameters:
        - name: environment_id
          in: path
          required: true
          schema:
            type: string
            title: Environment Id
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEnvironmentGrant'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
        - environments
      summary: Revoke
      operationId: revokeEnvironmentFromProject
      parameters:
        - name: environment_id
          in: path
          required: true
          schema:
            type: string
            title: Environment Id
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            title: Project Id
      responses:
        '204':
          description: Successful Response
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /environments/{environment_id}/refresh:
    post:
      tags:
        - environments
      summary: Refresh Tag
      operationId: refreshEnvironment
      parameters:
        - name: environment_id
          in: path
          required: true
          schema:
            type: string
            title: Environment Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentVersion'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/HTTPValidationError'
                  - $ref: '#/components/schemas/HTTPError'
  /environments/{environment_id}/versions:
    get:
      tags:
        - environments
      summary: Versions
      operationId: listEnvironmentVersions
      parameters:
        - name: environment_id
          in: path
          required: true
          schema:
            type: string
            title: Environment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                # No cap in the code: unpaginated owner-scoped list
                type: array
                items:
                  $ref: '#/components/schemas/EnvironmentVersion'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /environments/{environment_id}/versions/{version_id}:
    get:
      tags:
        - environments
      summary: Version
      operationId: getEnvironmentVersion
      parameters:
        - name: environment_id
          in: path
          required: true
          schema:
            type: string
            title: Environment Id
        - name: version_id
          in: path
          required: true
          schema:
            type: string
            title: Version Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentVersion'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /events:
    get:
      tags:
        - events
      summary: Sse Events
      description: 'SSE endpoint for real-time updates.


        Streams events for:

        - inbox:updated - when inbox items change

        - heartbeat - periodic keepalive (every 30s)


        The client should reconnect automatically on disconnect.

        EventSource handles this natively.'
      operationId: getEvents
      responses:
        '200':
          description: Server-sent event stream; each frame has `id`, `event` and a JSON `data` line.
          content:
            text/event-stream:
              schema:
                description: The JSON `data` line of one frame; x-sse-events maps each event name to its payload.
                oneOf:
                  - $ref: '#/components/schemas/EventConnected'
                  - $ref: '#/components/schemas/EventHeartbeat'
                  - $ref: '#/components/schemas/EventInboxUpdated'
                  - $ref: '#/components/schemas/EventSessionMessage'
                  - $ref: '#/components/schemas/EventTaskUpdated'
                  - $ref: '#/components/schemas/EventWorkspaceUpdated'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
      x-sse-events:
        connected:
          $ref: '#/components/schemas/EventConnected'
        heartbeat:
          $ref: '#/components/schemas/EventHeartbeat'
        inbox:updated:
          $ref: '#/components/schemas/EventInboxUpdated'
        session:message:
          $ref: '#/components/schemas/EventSessionMessage'
        task:updated:
          $ref: '#/components/schemas/EventTaskUpdated'
        workspace:updated:
          $ref: '#/components/schemas/EventWorkspaceUpdated'
  /health:
    get:
      tags:
        - health
      summary: Health
      description: Health check endpoint.
      operationId: getHealth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
  /hitl-observer/status:
    get:
      tags:
        - hitl
      summary: Get Hitl Observer Status
      operationId: getHITLObserverStatus
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HITLObserverStatus'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
  /hitl/{request_id}:
    get:
      tags:
        - hitl
      summary: Get Hitl Request
      operationId: getHITL
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
            title: Request Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HITLView'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /hitl/{request_id}/merge/{proposal_id}/details:
    get:
      tags:
        - hitl
      summary: Get Hitl Merge Details
      description: Read bounded, immutable proposal details for this owner's exact HITL card.
      operationId: getHITLMergeDetails
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
            title: Request Id
        - name: proposal_id
          in: path
          required: true
          schema:
            type: string
            title: Proposal Id
        - name: section
          in: query
          required: true
          schema:
            enum:
              - description
              - files
              - checks
            type: string
            title: Section
        - name: cursor
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
            title: Cursor
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 50
            minimum: 1
            default: 50
            title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HITLMergeDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /hitl/{request_id}/respond:
    post:
      tags:
        - hitl
      summary: Respond To Hitl
      operationId: respondHITL
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
            title: Request Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HITLDecisionInput'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HITLView'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
  /main-thread:
    get:
      tags:
        - chat
      summary: Get Main Thread Info
      description: Main-thread mode, native identity strip, and the topic index.
      operationId: getMainThread
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MainThreadInfo'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
  /orchestration-health:
    get:
      tags:
        - health
      summary: Read Health
      operationId: orchestrationHealth
      parameters:
        - name: project_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Project Id
        - name: task_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Task Id
        - name: session_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Session Id
        - name: attempt_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Attempt Id
        - name: provider
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                pattern: ^(claude|codex)$
              - type: 'null'
            title: Provider
        - name: hours
          in: query
          required: false
          schema:
            type: integer
            maximum: 8760
            minimum: 1
            default: 24
            title: Hours
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthView'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /orchestration-health/events:
    get:
      tags:
        - health
      summary: Read Events
      operationId: healthEvents
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
            title: Session Id
        - name: hours
          in: query
          required: false
          schema:
            type: integer
            maximum: 8760
            minimum: 1
            default: 24
            title: Hours
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEvents'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects:
    get:
      tags:
        - projects
      summary: List Projects
      description: List user's projects ordered by last used.
      operationId: listProjects
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                # No cap in the code: unpaginated owner-scoped list
                type: array
                items:
                  $ref: '#/components/schemas/Project'
                title: Response List Projects Projects Get
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
        - projects
      summary: Import Project
      description: Import the owner's repository without admitting a workspace or session.
      operationId: importProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectImportRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{project_id}:
    get:
      tags:
        - projects
      summary: Get Project
      description: Get a project by ID.
      operationId: getProject
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{project_id}/default-provider:
    get:
      tags:
        - projects
      summary: Get Preference
      operationId: getProjectDefaultProvider
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectProviderPreference'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TaskError'
                  - $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
        - projects
      summary: Set Preference
      operationId: updateProjectDefaultProvider
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            title: Project Id
      requestBody:
        required: true
        content:
