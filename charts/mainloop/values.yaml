# Defaults render a generic install: the Go server and the web app, reading credentials from the
# mainloop-secrets Secret and connecting to an external PostgreSQL. A deployment sets its domains,
# database and integrations through its own values file; see docs/production-rollout.md.

images:
  # tag defaults to the chart's appVersion. A digest, when set, replaces the tag; published charts
  # carry the digests their release built.
  backend:
    repository: ghcr.io/oldsj/mainloop-backend
    tag: ''
    digest: ''
  frontend:
    repository: ghcr.io/oldsj/mainloop-frontend
    tag: ''
    digest: ''
  # Applies to every container. Empty leaves the Kubernetes default.
  pullPolicy: ''

imagePullSecrets:
  - name: ghcr-secret

# Renders the release namespace as an object. Leave it on for a GitOps owner that already tracks
# the Namespace, so a sync never prunes it.
createNamespace: false

nodeSelector: {}

# Non-secret settings for every server container (ConfigMap mainloop-config). A key set to null
# drops the default.
config:
  HOST: 0.0.0.0
  PORT: '8000'
  DB_PORT: '5432'
  DB_NAME: mainloop
  FRONTEND_DOMAIN: mainloop.example.com
  # Merge tools and owner write routes remain off pending deployed authority proof.
  MAINLOOP_MERGE_TOOLS_ENABLED: 'false'
  MAINLOOP_MERGE_CONFIGURATIONS: '[]'
  # Pinned explicitly so a value baked into an image (e.g. by an ENV in a Dockerfile) can never
  # win over the deployed config. Enable only through this checked-in config, not the image.
  MAINLOOP_MERGE_PROTECTED_AUTO: 'false'
  # The live dev loop (dev_sync and the lease tools) stays off except where a deployment turns it on.
  MAINLOOP_DEVLOOP_ENABLED: 'false'
  # Privileged actions (docs/specs/privileged-actions.md): off unless a deployment turns them on,
  # and serve-api refuses them unless MAINLOOP_AUTH_MODE is enforce.
  MAINLOOP_PRIVILEGED_ACTIONS_ENABLED: 'false'
  # Accepts the executor types (onepassword.*). The chart sets it true with executor.enabled.
  MAINLOOP_PRIVILEGED_EXECUTOR_ENABLED: 'false'
  MAINLOOP_PRIVILEGED_EXECUTOR_KUBERNETES_ENABLED: 'false'
  # Owner API authentication (docs/specs/authentication.md): observe verifies and logs what enforce
  # would refuse, and refuses nothing. serve-api will not start outside development without a mode.
  # A deployment sets enforce once it has MAINLOOP_AUTH_OIDC_* and its machine callers carry tokens.
  MAINLOOP_AUTH_MODE: observe

database:
  # DB_HOST when neither database below is enabled.
  host: mainloop-db-pooler.mainloop
  # Where DB_USER and DB_PASSWORD come from. With cnpg.enabled and no name set, the CNPG-generated
  # <cluster>-app Secret (keys username, password).
  credentials:
    secretName: ''
    usernameKey: ''
    passwordKey: ''
  # A single-instance CloudNativePG Cluster. The server connects to its rw Service directly: one
  # client app, and no pooler whose pool could stall DBOS LISTEN/NOTIFY sessions.
  cnpg:
    enabled: false
    name: mainloop-pg
    instances: 1
    storage:
      size: 10Gi
      storageClass: ''
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: '1'
        memory: 1Gi
    # The Cluster's spec.affinity (CNPG's AffinityConfiguration: nodeSelector, tolerations,
    # nodeAffinity, ...), e.g. nodeSelector: {kubernetes.io/arch: amd64} to keep the instance on
    # one architecture's nodes. Empty: CNPG's defaults.
    affinity: {}
  # A throwaway PostgreSQL StatefulSet for the local Kind stack.
  local:
    enabled: false
    image: postgres:16-alpine
    storage: 1Gi

# The three listeners and the migrate initContainer, all from the backend image.
server:
  # Pod-level settings for Deployment mainloop-backend.
  strategy: {}
  podAnnotations: {}
  # An existing PriorityClass for the backend pod. The chart does not create it (it is cluster-wide).
  # The backend is one replica, so with none it waits behind any app when its node is drained or full.
  priorityClassName: ''
  # Imports every key of mainloop-secrets as env vars. Turn off to read only the keys named below.
  importSecretEnv: true
  # Added after mainloop-config in every server container's envFrom (e.g. a site ConfigMap).
  extraEnvFrom: []
  # GitHub App credentials from mainloop-secrets (github-app-id, github-app-private-key).
  # Optional lets the server start without them.
  githubAppOptional: false
  extraEnv: []
  extraVolumeMounts: []
  extraVolumes: []
  # Replaces /usr/local/bin/mainloop; the listener's subcommand is passed as args.
  command: []
  workingDir: ''
  # Merged over each listener's probes. Override timing fields only: the probe handler differs
  # per listener (the API's liveness is tcpSocket, the others httpGet), and adding a handler
  # here gives that probe two, which the API server rejects.
  livenessProbe: {}
  readinessProbe: {}
  # Timing fields for an optional startup probe on each listener, using that listener's
  # liveness handler. Empty: no startup probe. Set it when a container builds before it serves
  # (the live dev instance runs `go run`), so liveness does not kill a slow cold build.
  startupProbe: {}
  api:
    resources:
      requests:
        memory: 1Gi
        cpu: 250m
      limits:
        memory: 2Gi
        cpu: 1000m
  mcp:
    resources:
      requests:
        memory: 1Gi
        cpu: 250m
      limits:
        memory: 2Gi
        cpu: 1000m
  git:
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
        ephemeral-storage: 1Gi
      limits:
        memory: 2Gi
        cpu: 1000m
        ephemeral-storage: 3Gi
  # Brings the schema to the latest version before any listener starts. `migrate up` takes the
  # migrator lock, so a restart racing another pod waits instead of failing.
  migrate:
    command: [/usr/local/bin/mainloop, migrate, up]
    workingDir: ''
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 500m

frontend:
  # The full env list of the web container.
  env:
    - name: ORIGIN
      value: https://mainloop.example.com
  command: []
  workingDir: ''
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 250m
  livenessProbe: {}
  readinessProbe: {}

# Machine callers of the owner API (docs/specs/authentication.md). Each sends a projected token of
# its own ServiceAccount for this audience, and the backend checks it with a TokenReview.
auth:
  audience: mainloop-api
  serviceAccounts:
    # Lets the backend create TokenReviews (a ClusterRole named after the release namespace) and
    # allows the chart's ServiceAccounts in MAINLOOP_AUTH_SERVICE_ACCOUNTS: mainloop-canary (canary
    # scope, when the canary is on), mainloop-backend (read, for `smoke --read-only` in the pod) and
    # mainloop-operator (owner, for break-glass and `smoke --live`; no pod runs as it, an operator
    # mints its token with `kubectl create token`). Setting MAINLOOP_AUTH_SERVICE_ACCOUNTS in config
    # replaces the list.
    enabled: true
    # More namespace/name=scope entries, such as another instance's canary.
    extra: []

# Authenticated, TLS calls to kagent's control gateway. The backend sends a projected token of its
# own ServiceAccount, for the audience below, which kagent verifies by TokenReview. Needs Secret
# kagent-control-ca (key ca.crt) in the release namespace.
kagentControlAuth:
  enabled: false
  audience: kagent-invocation
  gatewayURL: https://kagent-control.kagent.svc.cluster.local
  userID: mainloop

# Mutual TLS to the Substrate 1.0 router, which the preview proxy and the live relay reach with
# CONNECT on port 8444 (SUBSTRATE_ROUTER_ADDRESS). The backend container gets a pod certificate
# from signer podidentity.podcert.ate.dev/identity and the servicedns.podcert.ate.dev/identity
# trust bundle for the router's serving certificate. The router admits only SPIFFE IDs in the
# Substrate chart's atenetRouter.ingressAllowedSPIFFEIDs, so
# spiffe://cluster.local/ns/<release namespace>/sa/mainloop-backend must be listed there.
substrateRouterAuth:
  enabled: false

# A CronJob that runs one cheap synthetic turn (smallest model, one-word prompt) through this
# instance's API and posts to ntfy when a step fails or the reply is slow. See docs/specs/canary.md.
canary:
  enabled: false
  # Names this instance in alerts.
  name: prod
  schedule: '*/10 * * * *'
  # More name=url[@host] targets, such as another instance's API.
  extraTargets: []
  # Extra flags, such as --slow=120s or --model=haiku.
  args: []
  # MAINLOOP_NTFY_URL, MAINLOOP_NTFY_TOPIC and MAINLOOP_NTFY_TOKEN (from a Secret). No ntfy: the
  # run only logs and exits non-zero on failure.
  env: []

# A headless Chromium for the preview_screenshot MCP tool (docs/specs/workspaces.md, "Preview
# screenshots"). Needs the preview host (SUBSTRATE_PREVIEW_BASE_URL). Enabling it sets
# MAINLOOP_SCREENSHOT_BROWSER_URL, which offers the tool to workspace agents.
screenshots:
  enabled: false
  image:
    repository: docker.io/chromedp/headless-shell
    tag: 159.0.8154.13
    digest: sha256:381353d3530ab9d579d2fe8b9c0f4519c995617f5a71daf6bb649e2d12005bd9
  # Required when enabled: NetworkPolicy "to" peers for the preview host's gateway. The browser
  # may reach these on previewEgressPorts, and DNS, and nothing else. In-cluster traffic to a
  # load-balancer IP is translated to the gateway's pods before the policy applies (kube-proxy and
  # Cilium alike), so name those pods (namespaceSelector plus podSelector) rather than the IP.
  previewEgress: []
  # The ports the gateway's pods listen on for the preview listener: the Service's targetPort, not
  # its port, for the same reason (Envoy Gateway's 443 listener is 10443 on the pod).
  previewEgressPorts: [443]
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: 1000m

networkPolicy:
  # Ingress to the REST and MCP listeners. The git listeners have their own fixed policy, open only
  # to the actor egress proxy.
  backendIngress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ate-system
          podSelector:
            matchLabels:
              app: atenet-egress
      ports:
        - protocol: TCP
          port: 8002
    - from:
        - podSelector:
            matchLabels:
              app: mainloop-frontend
      ports:
        - protocol: TCP
          port: 8000
  # Peers (NetworkPolicy "from" entries) let in to the metrics listener on 9100, such as the
  # cluster's Prometheus scraper. Empty, the default, adds no policy, so no one is let in.
  metricsIngress: []

# serve-executor (docs/specs/privileged-actions.md): runs the privileged actions whose credential
# serve-api must not hold (onepassword.item_to_secret). Off by default. It needs, outside the
# chart: its namespace; a database role mainloop_executor (`mainloop migrate up` grants it its
# privileges once it exists); and in its namespace the Secrets named below.
executor:
  enabled: false
  # Its own namespace, never the release's.
  namespace: ''
  # Its image; empty uses images.backend. It runs the compiled binary, so a deployment whose
  # backend image is a -dev (go run) image points this at a published mainloop-backend image.
  image:
    repository: ''
    tag: ''
    digest: ''
  # DB_HOST, fully qualified; empty uses the server's, which must then resolve from another
  # namespace.
  dbHost: ''
  # Keys username (mainloop_executor) and password.
  # trunk-ignore(checkov/CKV_SECRET_6): the Secret's name, not a value
  dbSecret: mainloop-executor-db
  # Key token: a read-only 1Password Service Account token.
  # trunk-ignore(checkov/CKV_SECRET_6): the Secret's name, not a value
  onePasswordSecret: mainloop-executor-1password
  # Namespaces onepassword.item_to_secret may write Secrets in; a Role is rendered in each. Some
  # (kube-*, mainloop*, onepassword*, argocd*, default) are always refused, and the chart fails on
  # the executor's or the release's namespace.
  secretNamespaces: []
  # The typed Kubernetes actions (k8s.rollout_restart, k8s.scale, k8s.delete, k8s.patch,
  # k8s.apply), argocd.sync and command.kubectl. On, it renders their narrow ServiceAccounts with
  # cluster-wide roles (named after the executor's namespace), an admin account bound to
  # cluster-admin for approved kubectl commands, and an admission policy that keeps them all off the
  # executor's own namespace and objects; the executor mints short-lived tokens for them.
  kubernetes:
    enabled: false
    # Shown on the cards, e.g. internal-01.
    clusterName: ''
  nodeSelector: {}
  affinity: {}
  tolerations: []
  # E.g. a Multus network for a dedicated source address.
  podAnnotations: {}
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 512Mi
