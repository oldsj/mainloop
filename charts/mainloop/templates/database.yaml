{{- with .Values.database.cnpg }}
{{- if .enabled }}
# CNPG generates the application credentials in Secret <name>-app (keys username, password).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
spec:
  instances: {{ .instances }}
  storage:
    size: {{ .storage.size }}
    {{- with .storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  bootstrap:
    initdb:
      database: mainloop
      owner: mainloop
  resources:
    {{- toYaml .resources | nindent 4 }}
{{- end }}
{{- end }}
{{- with .Values.database.local }}
{{- if .enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: mainloop-postgres
  namespace: {{ $.Release.Namespace }}
spec:
  clusterIP: None
  selector:
    app: mainloop-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mainloop-postgres
  namespace: {{ $.Release.Namespace }}
spec:
  serviceName: mainloop-postgres
  replicas: 1
  selector:
    matchLabels:
      app: mainloop-postgres
  template:
    metadata:
      labels:
        app: mainloop-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .image }}
          env:
            - name: POSTGRES_DB
              value: mainloop
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: mainloop-secrets
                  key: db-username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mainloop-secrets
                  key: db-password
          ports:
            - containerPort: 5432
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            exec:
              command: [sh, -c, pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .storage }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mainloop-postgres-ingress
  namespace: {{ $.Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: mainloop-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: mainloop-backend
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
{{- end }}
