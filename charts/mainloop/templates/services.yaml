{{- if .Values.createNamespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mainloop-backend
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Service
metadata:
  name: mainloop-backend
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: mainloop-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: mainloop-mcp
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: mainloop-backend
  ports:
    - name: mcp
      port: 80
      targetPort: 8002
---
apiVersion: v1
kind: Service
metadata:
  name: mainloop-git-read
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: mainloop-backend
  ports:
    - name: git-read
      port: 80
      targetPort: 8003
---
apiVersion: v1
kind: Service
metadata:
  name: mainloop-git-push
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: mainloop-backend
  ports:
    - name: git-push
      port: 80
      targetPort: 8004
---
apiVersion: v1
kind: Service
metadata:
  name: mainloop-frontend
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: mainloop-frontend
  ports:
    - port: 3000
      targetPort: 3000
