{{- if .Values.auth.serviceAccounts.enabled }}
# Machine callers of the owner API (docs/specs/authentication.md).
#
# mainloop-operator: owner scope, for break-glass and `smoke --live` from an operator machine. No pod
# runs as it; a namespace admin mints a short-lived token:
#   kubectl -n {{ .Release.Namespace }} create token mainloop-operator --audience {{ .Values.auth.audience }} --duration 1h
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mainloop-operator
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: false
---
# The backend checks every ServiceAccount token with a TokenReview: create on tokenreviews and
# nothing else. Named after the release namespace, so each instance in a cluster owns its own.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mainloop-tokenreview-{{ .Release.Namespace }}
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mainloop-tokenreview-{{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mainloop-tokenreview-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: mainloop-backend
    namespace: {{ .Release.Namespace }}
{{- end }}
