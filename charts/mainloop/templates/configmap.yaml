apiVersion: v1
kind: ConfigMap
metadata:
  name: mainloop-config
  namespace: {{ .Release.Namespace }}
data:
  {{- $data := merge (dict) .Values.config }}
  {{- if not (hasKey $data "MAINLOOP_AUTH_SA_AUDIENCE") }}
  {{- $_ := set $data "MAINLOOP_AUTH_SA_AUDIENCE" .Values.auth.audience }}
  {{- end }}
  {{- if and .Values.auth.serviceAccounts.enabled (not (hasKey $data "MAINLOOP_AUTH_SERVICE_ACCOUNTS")) }}
  {{- $_ := set $data "MAINLOOP_AUTH_SERVICE_ACCOUNTS" (include "mainloop.authServiceAccounts" .) }}
  {{- end }}
  {{- if .Values.executor.enabled }}
  {{- $_ := set $data "MAINLOOP_PRIVILEGED_EXECUTOR_ENABLED" "true" }}
  {{- if .Values.executor.kubernetes.enabled }}
  {{- $_ := set $data "MAINLOOP_PRIVILEGED_EXECUTOR_KUBERNETES_ENABLED" "true" }}
  {{- end }}
  {{- if .Values.executor.omni.enabled }}
  {{- $_ := set $data "MAINLOOP_PRIVILEGED_EXECUTOR_OMNI_ENABLED" "true" }}
  {{- end }}
  {{- with .Values.executor.approvalKeys }}
  {{- $_ := set $data "MAINLOOP_PRIVILEGED_APPROVAL_KEYS" (toJson .) }}
  {{- end }}
  {{- end }}
  {{- if and .Values.screenshots.enabled (not (hasKey $data "MAINLOOP_SCREENSHOT_BROWSER_URL")) }}
  {{- $_ := set $data "MAINLOOP_SCREENSHOT_BROWSER_URL" (printf "http://mainloop-screenshots.%s.svc.cluster.local:9222" .Release.Namespace) }}
  {{- end }}
  {{- if not (hasKey $data "DB_HOST") }}
  {{- $_ := set $data "DB_HOST" (include "mainloop.dbHost" .) }}
  {{- end }}
  {{- range $k, $v := $data }}
  {{- if not (kindIs "invalid" $v) }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
  {{- end }}
