{{- with .Values.executor }}
{{- if .enabled }}
{{- if not .namespace }}{{ fail "executor.namespace is required when executor.enabled" }}{{ end }}
{{- if eq .namespace $.Release.Namespace }}{{ fail "executor.namespace must not be the release namespace" }}{{ end }}
{{- if $.Values.database.local.enabled }}{{ fail "the executor cannot reach the local database" }}{{ end }}
{{- range .secretNamespaces }}
{{- if or (eq . $.Values.executor.namespace) (eq . $.Release.Namespace) }}{{ fail (printf "executor.secretNamespaces must not hold the executor's or the release's namespace (%s)" .) }}{{ end }}
{{- end }}
{{- $image := $.Values.images.backend }}
{{- if .image.repository }}{{ $image = .image }}{{ end }}
# serve-executor (docs/specs/privileged-actions.md): runs the privileged actions that need a
# credential serve-api must not hold. Its own namespace, created outside the chart; no Service, and
# ingress is denied. One replica, replaced rather than rolled, so two never hold one action.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mainloop-executor
  namespace: {{ .namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mainloop-executor
  namespace: {{ .namespace }}
  labels:
    app: mainloop-executor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mainloop-executor
  template:
    metadata:
      labels:
        app: mainloop-executor
      {{- with .podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: mainloop-executor
      securityContext:
        fsGroup: 1000
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: executor
          image: {{ include "mainloop.image" (dict "image" $image "root" $) }}
          {{- include "mainloop.pullPolicy" $ | nindent 10 }}
          args: [serve-executor]
          {{- include "mainloop.securityContext" $ | nindent 10 }}
            readOnlyRootFilesystem: true
          env:
            - name: DB_HOST
              value: {{ .dbHost | default (include "mainloop.dbHost" $) | quote }}
            - name: DB_PORT
              value: {{ $.Values.config.DB_PORT | default "5432" | quote }}
            - name: DB_NAME
              value: {{ $.Values.config.DB_NAME | default "mainloop" | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .dbSecret }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .dbSecret }}
                  key: password
            - name: MAINLOOP_OWNER_ID
              value: {{ $.Values.config.MAINLOOP_OWNER_ID | default "local-dev-user" | quote }}
            - name: MAINLOOP_EXECUTOR_OP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .onePasswordSecret }}
                  key: token
            - name: MAINLOOP_EXECUTOR_SECRET_NAMESPACES
              value: {{ join "," .secretNamespaces | quote }}
            - name: MAINLOOP_EXECUTOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .kubernetes.enabled }}
            - name: MAINLOOP_EXECUTOR_KUBERNETES_ENABLED
              value: "true"
            - name: MAINLOOP_EXECUTOR_CLUSTER
              value: {{ .kubernetes.clusterName | quote }}
            {{- end }}
            # The root filesystem is read-only; /tmp is the only writable path.
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- with .resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
# Nothing connects to the executor.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mainloop-executor-deny-ingress
  namespace: {{ .namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
{{- range .secretNamespaces }}
---
# onepassword.item_to_secret may read and write Secrets here, and nowhere else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mainloop-executor-secrets
  namespace: {{ . }}
rules:
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mainloop-executor-secrets
  namespace: {{ . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mainloop-executor-secrets
subjects:
  - kind: ServiceAccount
    name: mainloop-executor
    namespace: {{ $.Values.executor.namespace }}
{{- end }}
{{- if .kubernetes.enabled }}
{{- $ns := .namespace }}
{{- $accounts := dict "workloads" "mainloop-executor-workloads" "delete" "mainloop-executor-delete" "writer" "mainloop-executor-writer" "argo" "mainloop-executor-argo" }}
{{- range $role, $account := $accounts }}
---
# The k8s.* types' narrow ServiceAccounts. Nothing runs as them: the executor mints a 10-minute
# token for one per run, and its own account may do nothing else with them.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $account }}
  namespace: {{ $ns }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  # Named after the executor's namespace, so two releases on one cluster do not collide, and so the
  # executor refuses to delete it (it never changes its own objects).
  name: {{ $ns }}-{{ $role }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $ns }}-{{ $role }}
subjects:
  - kind: ServiceAccount
    name: {{ $account }}
    namespace: {{ $ns }}
{{- end }}
---
# k8s.rollout_restart and k8s.scale: read and patch workloads, and see their autoscalers.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $ns }}-workloads
rules:
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, patch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [list]
---
# k8s.delete: read (metadata only, as the executor asks) and delete any object. The executor refuses
# its own namespace and these roles; RBAC cannot express "all but", so that guard is the executor's.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $ns }}-delete
rules:
  - apiGroups: ['*']
    resources: ['*']
    verbs: [get, delete]
---
# k8s.patch and k8s.apply: read, create and patch any object, server-side dry runs included. The
# executor refuses Secrets (a dry run would read the value), its own namespace and these roles.
# escalate and bind let an approved change write roles and bindings beyond this role's own rights,
# as an admin's would.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $ns }}-writer
rules:
  - apiGroups: ['*']
    resources: ['*']
    verbs: [get, create, patch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, clusterroles]
    verbs: [escalate, bind]
---
# argocd.sync: read Applications and patch one to start a sync (its operation field), as the argocd
# CLI does. Nothing else of Argo CD: not its projects, clusters or repositories.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $ns }}-argo
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, patch]
---
# The executor's own account may mint tokens for the narrow accounts, and nothing else here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mainloop-executor-tokens
  namespace: {{ $ns }}
rules:
  - apiGroups: ['']
    resources: [serviceaccounts/token]
    resourceNames: [{{ join ", " (values $accounts | sortAlpha) }}]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mainloop-executor-tokens
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mainloop-executor-tokens
subjects:
  - kind: ServiceAccount
    name: mainloop-executor
    namespace: {{ $ns }}
{{- end }}
{{- end }}
{{- end }}
