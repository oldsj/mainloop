{{- with .Values.executor }}
{{- if .enabled }}
{{- if not .namespace }}{{ fail "executor.namespace is required when executor.enabled" }}{{ end }}
{{- if eq .namespace $.Release.Namespace }}{{ fail "executor.namespace must not be the release namespace" }}{{ end }}
{{- if $.Values.database.local.enabled }}{{ fail "the executor cannot reach the local database" }}{{ end }}
{{- range .secretNamespaces }}
{{- if or (eq . $.Values.executor.namespace) (eq . $.Release.Namespace) }}{{ fail (printf "executor.secretNamespaces must not hold the executor's or the release's namespace (%s)" .) }}{{ end }}
{{- end }}
{{- $image := $.Values.images.backend }}
{{- if .image.repository }}{{ $image = .image }}{{ end }}
# serve-executor (docs/specs/privileged-actions.md): runs the privileged actions that need a
# credential serve-api must not hold. Its own namespace, created outside the chart; no Service, and
# ingress is denied. One replica, replaced rather than rolled, so two never hold one action.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mainloop-executor
  namespace: {{ .namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mainloop-executor
  namespace: {{ .namespace }}
  labels:
    app: mainloop-executor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mainloop-executor
  template:
    metadata:
      labels:
        app: mainloop-executor
      {{- with .podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: mainloop-executor
      securityContext:
        fsGroup: 1000
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: executor
          image: {{ include "mainloop.image" (dict "image" $image "root" $) }}
          {{- include "mainloop.pullPolicy" $ | nindent 10 }}
          args: [serve-executor]
          {{- include "mainloop.securityContext" $ | nindent 10 }}
            readOnlyRootFilesystem: true
          env:
            - name: DB_HOST
              value: {{ .dbHost | default (include "mainloop.dbHost" $) | quote }}
            - name: DB_PORT
              value: {{ $.Values.config.DB_PORT | default "5432" | quote }}
            - name: DB_NAME
              value: {{ $.Values.config.DB_NAME | default "mainloop" | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .dbSecret }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .dbSecret }}
                  key: password
            - name: MAINLOOP_OWNER_ID
              value: {{ $.Values.config.MAINLOOP_OWNER_ID | default "local-dev-user" | quote }}
            - name: MAINLOOP_EXECUTOR_OP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .onePasswordSecret }}
                  key: token
            - name: MAINLOOP_EXECUTOR_SECRET_NAMESPACES
              value: {{ join "," .secretNamespaces | quote }}
            - name: MAINLOOP_EXECUTOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .kubernetes.enabled }}
            - name: MAINLOOP_EXECUTOR_KUBERNETES_ENABLED
              value: "true"
            - name: MAINLOOP_EXECUTOR_CLUSTER
              value: {{ .kubernetes.clusterName | quote }}
            {{- end }}
            {{- if .omni.enabled }}
            {{- if not (hasPrefix "https://" .omni.endpoint) }}
            {{- fail "executor.omni.endpoint must be Omni's https URL" }}
            {{- end }}
            - name: MAINLOOP_EXECUTOR_OMNI_ENABLED
              value: "true"
            - name: MAINLOOP_EXECUTOR_OMNI_ENDPOINT
              value: {{ .omni.endpoint | quote }}
            - name: MAINLOOP_EXECUTOR_OMNI_CLUSTERS
              value: {{ join "," .omni.clusters | quote }}
            - name: MAINLOOP_EXECUTOR_OMNI_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .omni.keySecret }}
                  key: service-account-key
            {{- end }}
            {{- with .approvalKeys.pinned }}
            - name: MAINLOOP_PRIVILEGED_APPROVAL_KEYS
              value: {{ toJson . | quote }}
            {{- end }}
            {{- if .approvalKeys.required }}
            - name: MAINLOOP_PRIVILEGED_APPROVAL_KEYS_REQUIRED
              value: "true"
            {{- end }}
            {{- if .ssh.enabled }}
            {{- if not .ssh.hosts }}
            {{- fail "executor.ssh.hosts must name a host when executor.ssh.enabled is true" }}
            {{- end }}
            {{- $hosts := list }}
            {{- range .ssh.hosts }}
            {{- if not (regexMatch "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$" (toString .name)) }}
            {{- fail (printf "executor.ssh.hosts: %q is not a DNS label" (toString .name)) }}
            {{- end }}
            {{- if not .address }}
            {{- fail (printf "executor.ssh.hosts: %s has no address" .name) }}
            {{- end }}
            {{- $hosts = append $hosts (printf "%s=%s" .name .address) }}
            {{- end }}
            - name: MAINLOOP_EXECUTOR_SSH_ENABLED
              value: "true"
            - name: MAINLOOP_EXECUTOR_SSH_HOSTS
              value: {{ join "," $hosts | quote }}
            - name: MAINLOOP_EXECUTOR_SSH_DIR
              value: /etc/mainloop-executor/ssh
            {{- end }}
            {{- if .unifi.enabled }}
            {{- if not (regexMatch "^([0-9]{1,3}[.]){3}[0-9]{1,3}:[0-9]{1,5}$|^\\[[0-9a-fA-F:.]+\\]:[0-9]{1,5}$" (toString .unifi.address)) }}
            {{- fail "executor.unifi.address must be the console's IP:port when executor.unifi.enabled is true" }}
            {{- end }}
            - name: MAINLOOP_EXECUTOR_UNIFI_ENABLED
              value: "true"
            - name: MAINLOOP_EXECUTOR_UNIFI_ADDRESS
              value: {{ .unifi.address | quote }}
            - name: MAINLOOP_EXECUTOR_UNIFI_DIR
              value: /etc/mainloop-executor/unifi
            {{- end }}
            # The root filesystem is read-only; /tmp is the only writable path.
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .ssh.enabled }}
            {{- range .ssh.hosts }}
            - name: ssh-{{ .name }}
              mountPath: /etc/mainloop-executor/ssh/{{ .name }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if .unifi.enabled }}
            - name: unifi
              mountPath: /etc/mainloop-executor/unifi
              readOnly: true
            {{- end }}
          {{- with .resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        {{- if .ssh.enabled }}
        {{- range .ssh.hosts }}
        # The executor reads these fresh for each connection, so a rotated Secret needs no restart.
        - name: ssh-{{ .name }}
          secret:
            secretName: mainloop-executor-ssh-{{ .name }}
            defaultMode: 0440
            items:
              - key: private-key
                path: private-key
              - key: user
                path: user
              - key: known-hosts
                path: known-hosts
        {{- end }}
        {{- end }}
        {{- if .unifi.enabled }}
        # Read fresh for each request, like the ssh credentials.
        - name: unifi
          secret:
            secretName: mainloop-executor-unifi
            defaultMode: 0440
            items:
              - key: api-key
                path: api-key
              - key: certificate
                path: certificate
        {{- end }}
---
# Nothing connects to the executor.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mainloop-executor-deny-ingress
  namespace: {{ .namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
{{- range .secretNamespaces }}
---
# onepassword.item_to_secret may read and write Secrets here, and nowhere else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mainloop-executor-secrets
  namespace: {{ . }}
rules:
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mainloop-executor-secrets
  namespace: {{ . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mainloop-executor-secrets
subjects:
  - kind: ServiceAccount
    name: mainloop-executor
    namespace: {{ $.Values.executor.namespace }}
{{- end }}
{{- if .kubernetes.enabled }}
{{- $ns := .namespace }}
{{- $accounts := dict "workloads" "mainloop-executor-workloads" "delete" "mainloop-executor-delete" "writer" "mainloop-executor-writer" "argo" "mainloop-executor-argo" "admin" "mainloop-executor-admin" }}
{{- range $role, $account := $accounts }}
---
# The k8s.* types' narrow ServiceAccounts, and command.kubectl's admin. Nothing runs as them: the
# executor mints a short-lived token for one per run, and its own account may do nothing else with
# them.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $account }}
  namespace: {{ $ns }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  # Named after the executor's namespace, so two releases on one cluster do not collide, and so the
  # executor refuses to delete it (it never changes its own objects).
  name: {{ $ns }}-{{ $role }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  # command.kubectl runs an owner-approved command as cluster-admin. The executor holds the token
  # in its own proxy and refuses its own namespace and objects there; the policy below is a safety
  # net, not the boundary.
  name: {{ if eq $role "admin" }}cluster-admin{{ else }}{{ $ns }}-{{ $role }}{{ end }}
subjects:
  - kind: ServiceAccount
    name: {{ $account }}
    namespace: {{ $ns }}
{{- end }}
---
# A safety net, not a boundary: it denies the executor's accounts writes to the executor's namespace
# and anything in it (its pods, Secrets, tokens), that Namespace, and the cluster-wide roles and
# bindings named after it. The API server exempts admission policies and bindings from policies made
# through the API, so this one cannot protect itself, and it matches the requesting user, which
# impersonation changes. The executor's own checks hold those lines: its kubectl proxy refuses
# admission writes and impersonation. Reads are not admission requests: the executor refuses
# commands naming its namespace, and Secrets, before they run.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $ns }}-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ['*']
        apiVersions: ['*']
        operations: ['*']
        resources: ['*/*']
  matchConditions:
    # The narrow accounts and admin, not the executor's own account (which mints their tokens).
    - name: executor-accounts
      expression: request.userInfo.username.startsWith('system:serviceaccount:{{ $ns }}:mainloop-executor-')
  validations:
    - expression: request.namespace != '{{ $ns }}'
      message: the executor's own namespace changes only through GitOps
    - expression: "!(request.resource.group == '' && request.resource.resource == 'namespaces' && request.name == '{{ $ns }}')"
      message: the executor's own namespace changes only through GitOps
    # admissionregistration covers webhook configurations; policies and bindings are exempt.
    - expression: "!(request.resource.group in ['rbac.authorization.k8s.io', 'admissionregistration.k8s.io'] && request.name.startsWith('{{ $ns }}-'))"
      message: the executor's own roles, bindings and webhooks change only through GitOps
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $ns }}-guard
spec:
  policyName: {{ $ns }}-guard
  validationActions: [Deny]
---
# k8s.rollout_restart and k8s.scale: read and patch workloads, and see their autoscalers.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $ns }}-workloads
rules:
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, patch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [list]
---
# k8s.delete: read (metadata only, as the executor asks) and delete any object. The executor refuses
# its own namespace and these roles; RBAC cannot express "all but", so that guard is the executor's.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $ns }}-delete
rules:
  - apiGroups: ['*']
    resources: ['*']
    verbs: [get, delete]
---
# k8s.patch and k8s.apply: read, create and patch any object, server-side dry runs included. The
# executor refuses Secrets (a dry run would read the value), its own namespace and these roles.
# escalate and bind let an approved change write roles and bindings beyond this role's own rights,
# as an admin's would.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $ns }}-writer
rules:
  - apiGroups: ['*']
    resources: ['*']
    verbs: [get, create, patch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, clusterroles]
    verbs: [escalate, bind]
---
# argocd.sync: read Applications and patch one to start a sync (its operation field), as the argocd
# CLI does. Nothing else of Argo CD: not its projects, clusters or repositories.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $ns }}-argo
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, patch]
---
# The executor's own account may mint tokens for the narrow accounts and admin, and nothing else here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mainloop-executor-tokens
  namespace: {{ $ns }}
rules:
  - apiGroups: ['']
    resources: [serviceaccounts/token]
    resourceNames: [{{ join ", " (values $accounts | sortAlpha) }}]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mainloop-executor-tokens
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mainloop-executor-tokens
subjects:
  - kind: ServiceAccount
    name: mainloop-executor
    namespace: {{ $ns }}
{{- end }}
{{- end }}
{{- end }}
