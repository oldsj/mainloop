syntax = "proto3";

package kagent.api.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "kagent/api/v1/common.proto";
import "kagent/api/v1/runtime.proto";

option go_package = "github.com/kagent-dev/kagent/go/api/gen/kagent/api/v1;apiv1";

// Lifecycle mutations execute inline. After a retryable error, repeat the same
// mutation; CreateSession retries must keep the same request_id and input.
// GetSession only observes state. A timeout does not roll back runtime effects.
// Pending issued work blocks conflicting lifecycle, task, and checkpoint work
// until a client retry completes it. Automatic idle suspension is independent.
service SessionService {
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  // PrepareSessionWorkspace checks out the Session's exact workspace commit and
  // installs its fixed setup in the current runtime generation, then returns a
  // receipt of what the runtime observed. A stale generation_id or actor_uid
  // fails with FAILED_PRECONDITION or ABORTED (a sleeping runtime is woken
  // first); the caller re-reads the Session and retries with the same action_id.
  rpc PrepareSessionWorkspace(PrepareSessionWorkspaceRequest) returns (PrepareSessionWorkspaceResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc UpdateSessionName(UpdateSessionNameRequest) returns (UpdateSessionNameResponse);
  // Restores a crashed runtime to its last snapshot without replaying its turn.
  rpc RevertSession(RevertSessionRequest) returns (RevertSessionResponse);
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);
  rpc CreateSessionShare(CreateSessionShareRequest) returns (CreateSessionShareResponse);
  rpc ListSessionShares(ListSessionSharesRequest) returns (ListSessionSharesResponse);
  rpc RevokeSessionShare(RevokeSessionShareRequest) returns (RevokeSessionShareResponse);
}

message Failure {
  string reason = 1;
  string message = 2;
}

message Session {
  string id = 1;
  string creator = 2;
  // Output only. Agent identity captured from this Session's pinned revision.
  AgentProvenance agent = 15;
  string prepared_revision = 5;
  string a2a_authority = 6;
  RuntimeState state = 7;
  RuntimeOperation operation = 8;
  Failure failure = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  // Reader-supplied display name for the conversation. Empty means unnamed.
  string name = 13;
  // Output only. A2A conversation ID, equal to this session's ID.
  // Forks receive a new conversation ID and new task IDs.
  string context_id = 14;
  // Git checkout the runtime establishes before the first turn. Unset means
  // the Session starts with an empty workspace.
  Workspace workspace = 16;
  // Secret references only; forks do not inherit these bindings.
  repeated SessionCredential credentials = 17;
  // Output only. The development image this Session runs in, as selected at
  // creation. Unset for Sessions on the Agent's single-image revision. Forks
  // keep it.
  DevelopmentEnvironment development_environment = 18;
  // Output only. The operator's runtime payload pinned at creation; set exactly
  // when development_environment is.
  RuntimeComposition runtime_composition = 19;
  // Output only. Set only by GetSession, from a fresh observation of the
  // Session's runtime Actor. Absent means no association was verified by this
  // read; it is never a creation or fork input.
  RuntimeAssociation runtime_association = 20;
  // Output only. The latest workspace preparation receipt, if one was issued.
  WorkspacePreparationReceipt workspace_preparation = 21;
  // Output only. Set on a fork created with a fresh conversation: its restored
  // data keeps the workspace, but the runtime discards native conversation state.
  bool fresh_conversation = 22;
}

// RuntimeAssociation is a bounded observation of the runtime Actor that serves
// a Session, not a grant: callers recheck with their own fencing before
// runtime work.
message RuntimeAssociation {
  // Stable identity of the Session's current runtime: a name-based UUID of the
  // Session ID and the Actor UID. It changes only if the Actor is replaced.
  string generation_id = 1;
  string atespace = 2;
  string actor_name = 3;
  string actor_uid = 4;
  // "active" while the observed Actor is the Session's recorded runtime.
  string phase = 5;
  // True while the Actor is running; false while it is suspended or otherwise
  // not serving. A sleeping Session stays READY and reports false here.
  bool current_active = 6;
}

// SecretKeyReference identifies a key in the Agent's namespace. The value is
// the complete HTTP header value, including any authorization scheme prefix.
message SecretKeyReference {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 253
    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$"
  }];
  string key = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 253
    pattern: "^[A-Za-z0-9._-]+$"
  }];
}

// SessionCredential binds a same-namespace Secret to an existing egress origin.
// Injection must be supported by the gateway dataplane for the origin's protocol.
// Stock agentgateway supports HTTP injection; stock Envoy skips it.
message SessionCredential {
  string origin = 1 [(buf.validate.field).string = {
    max_len: 2048
    pattern: "^https?://[A-Za-z0-9.-]+(:[0-9]{1,5})?$"
  }];
  // Header names are case-insensitive and canonicalized to lowercase.
  string header = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
    pattern: "^[!#$%&'*+.^_`|~0-9A-Za-z-]+$"
  }];
  SecretKeyReference secret_ref = 3 [(buf.validate.field).required = true];
}

message AgentProvenance {
  ResourceReference ref = 1;
  string uid = 2;
}

message CreateSessionRequest {
  ResourceReference agent = 5 [(buf.validate.field).required = true];
  string request_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  // Optional display name. Empty means unnamed.
  string name = 4 [(buf.validate.field).string = {
    max_len: 200
    pattern: "^(?:$|[^\\p{Z}\\p{Cc}](?:[^\\p{Cc}]*[^\\p{Z}\\p{Cc}])?)$"
  }];
  // Optional Git checkout to establish before the first turn. Its host must be
  // one of the Agent's Git origins.
  Workspace workspace = 6;
  // Per-session headers for origins already allowed by the Agent revision.
  repeated SessionCredential credentials = 7 [(buf.validate.field).repeated.max_items = 4];
  // Optional development image to run the Agent's Claude or Codex harness in.
  // The harness, its CLI and helpers come from the operator's runtime payload.
  // Selection requires the controller's session policy to allow its registry.
  DevelopmentEnvironment development_environment = 8;
}

// DevelopmentEnvironment selects the image a composed Session runs in.
message DevelopmentEnvironment {
  // Digest-pinned image reference.
  string image = 1 [(buf.validate.field).string = {
    max_len: 512
    pattern: "^[A-Za-z0-9][A-Za-z0-9./_:-]*@sha256:[a-f0-9]{64}$"
  }];
  string platform = 2 [(buf.validate.field).string = {
    in: [
      "linux/amd64",
      "linux/arm64"
    ]
  }];
  // Caller-owned immutable identity of the policy the image was admitted
  // under, such as a registration revision. It is part of the revision identity.
  string policy_identity = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
    pattern: "^\\S(.*\\S)?$"
  }];
}

// RuntimeComposition is the operator-resolved runtime payload a composed
// Session runs its harness from.
message RuntimeComposition {
  // Digest-pinned payload image from the operator catalog.
  string payload_image = 1;
  // Harness provider the payload serves: claude or codex.
  string provider = 2;
  // Payload contract schema.
  uint32 schema = 3;
  // CLI version the payload carries.
  string cli_version = 4;
}

message CreateSessionResponse {
  Session session = 1;
}

message GetSessionRequest {
  string session_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetSessionResponse {
  Session session = 1;
}

message ListSessionsRequest {
  // Includes sessions created by other users when authorized.
  bool all_creators = 2;
  PageRequest page = 3;
  // Filters by the Agent that produced each session's pinned revision.
  ResourceReference agent = 6;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
  PageResponse page = 2;
}

message UpdateSessionNameRequest {
  string session_id = 1 [(buf.validate.field).string.uuid = true];
  // The new display name. Empty clears the name, returning the conversation to
  // being identified by its id.
  string name = 2 [(buf.validate.field).string = {
    max_len: 200
    pattern: "^(?:$|[^\\p{Z}\\p{Cc}](?:[^\\p{Cc}]*[^\\p{Z}\\p{Cc}])?)$"
  }];
}

message UpdateSessionNameResponse {
  Session session = 1;
}

message RevertSessionRequest {
  string session_id = 1 [(buf.validate.field).string.uuid = true];
}

message RevertSessionResponse {
  Session session = 1;
}

message DeleteSessionRequest {
  string session_id = 1 [(buf.validate.field).string.uuid = true];
  // Terminate ongoing turns instead of rejecting deletion while they are active.
  // Authorization and conflicting lifecycle operations are still checked.
  bool force = 2;
}

message DeleteSessionResponse {
  Session session = 1;
}

// Grants read-only access to a session, including A2A get, list, and subscribe.
message SessionShare {
  string id = 1;
  string session_id = 2;
  google.protobuf.Timestamp created_at = 3;
  // When the share's token stops granting access. Unset means never.
  google.protobuf.Timestamp expires_at = 4;
}

message CreateSessionShareRequest {
  string session_id = 1 [(buf.validate.field).string.uuid = true];
  // How long the share's token grants access, from its creation. Unset takes the
  // controller's maximum share lifetime; without one, the share grants access
  // until it is revoked or the session deleted.
  google.protobuf.Duration ttl = 2 [(buf.validate.field).duration.gt = {}];
}

message CreateSessionShareResponse {
  SessionShare share = 1;
  // Returned only when the share is created.
  string token = 2;
}

message ListSessionSharesRequest {
  string session_id = 1 [(buf.validate.field).string.uuid = true];
  PageRequest page = 2;
}

message ListSessionSharesResponse {
  repeated SessionShare shares = 1;
  PageResponse page = 2;
}

message RevokeSessionShareRequest {
  string share_id = 1 [(buf.validate.field).string.uuid = true];
}

message RevokeSessionShareResponse {}

message PrepareSessionWorkspaceRequest {
  string session_id = 1 [(buf.validate.field).string.uuid = true];
  // Idempotency key: retries with the same request bytes join one preparation.
  string action_id = 2 [(buf.validate.field).string = {min_len: 1, max_len: 128, pattern: "^[A-Za-z0-9:._-]+$"}];
  // The CreateSession request_id that created this Session (not a fork).
  string create_request_id = 3 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
  // From Session.runtime_association.
  string generation_id = 4 [(buf.validate.field).string.uuid = true];
  string actor_uid = 5 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
  // The Session's own prepared_revision, workspace, environment and composition.
  string prepared_revision = 6 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
  Workspace workspace = 7 [(buf.validate.field).required = true];
  DevelopmentEnvironment development_environment = 8 [(buf.validate.field).required = true];
  RuntimeComposition runtime_composition = 9 [(buf.validate.field).required = true];
  string setup_profile = 10 [(buf.validate.field).string = {in: ["supervisor", "child", "agent"]}];
  // SHA-256 of the fixed standing-context text for setup_profile.
  string setup_digest = 11 [(buf.validate.field).string = {pattern: "^[a-f0-9]{64}$"}];
  option (buf.validate.message).cel = {
    id: "preparation.exact_checkout"
    message: "preparation requires a full commit SHA and named branch"
    expression: "this.workspace.ref.matches('^[a-f0-9]{40}$') && this.workspace.branch != ''"
  };
}

message PrepareSessionWorkspaceResponse {
  WorkspacePreparationReceipt receipt = 1;
}

// WorkspacePreparationReceipt is bounded evidence of one preparation. It never
// contains command output, prompt text or configuration documents.
message WorkspacePreparationReceipt {
  PrepareSessionWorkspaceRequest original = 1;
  // SHA-256 of the deterministic encoding of original.
  string request_digest = 2;
  string execution_id = 3;
  string context_id = 4;
  string atespace = 5;
  string actor_name = 6;
  // pending, uncertain, confirmed or definite-failure.
  string classification = 7;
  // Identifies the latest observation of an already confirmed preparation.
  string challenge_id = 8;
  uint64 observation_sequence = 9;
  // Runtime-observed checkout and setup facts.
  string head = 10;
  string branch = 11;
  string transport_digest = 12;
  string config_digest = 13;
  string mcp_digest = 14;
  string native_hook = 15;
  // When the checkout and setup effect was first observed.
  google.protobuf.Timestamp effect_observed_at = 16;
  // When the latest observation committed; unset while it is pending.
  google.protobuf.Timestamp observed_at = 17;
  // True when the receipt describes an earlier runtime generation.
  bool historical = 18;
}
