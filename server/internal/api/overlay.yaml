overlay: 1.0.0
info:
  title: Stopgap for untyped responses
  version: 1.0.0
# The baseline contract still has `schema: {}` on some 200 responses, which oapi-codegen turns
# into `interface{}`; Go cannot attach the strict-server visitor methods to that. Give those
# schemas a raw-JSON type until the contract types them (the generated file imports encoding/json). Typed schemas do not match the filter.
actions:
  - target: $.paths.*.*.responses.*.content["application/json"].schema[?(!@.type && !@['$ref'] && !@.allOf && !@.anyOf && !@.oneOf)]
    update:
      x-go-type: json.RawMessage
