apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kagent-postgres
  namespace: kagent
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:53a4ece3bb160ec8e0612c484e2b4111fc4e0e443e522fd3d0394fc683dacd86
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: kagent
      owner: kagent
      secret:
        name: kagent-postgres-owner
  managed:
    roles:
      - name: kagent
        inRoles:
          - kagent_owner
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: kagent-postgres-owner
  postgresql:
    parameters:
      password_encryption: scram-sha-256
      ssl_min_protocol_version: TLSv1.2
    pg_hba:
      - hostnossl all all all reject
      - hostssl kagent kagent all scram-sha-256
      # Logins created by kagent's setup.sql for the ported controller.
      - hostssl kagent kagent_owner_user,kagent_readwrite_user all scram-sha-256
  smartShutdownTimeout: 15
  probes:
    liveness:
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
      isolationCheck:
        enabled: true
        requestTimeout: 5000
        connectionTimeout: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  storage:
    size: 1Gi
