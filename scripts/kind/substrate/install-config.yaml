# Config for `kubectl ate install` (Substrate v1.0.1) on Kind. install.sh supplies the database
# before the installer runs, hence `external`. The microVM sandbox class needs KVM, which Docker
# on macOS does not have, so this stack runs gVisor only.
postgres: external
objectStore: rustfs
timeout: 10m
releases:
  substrate:
    values:
      # kagent sets a snapshot location on each ActorTemplate and needs golden egress policies.
      preview:
        - PerTemplateSnapshotLocation
        - GoldenEgressPolicy
      # As in production: the kagent controller creates atespaces, templates and actors. With
      # its Substrate client certificate it calls the API as its SPIFFE ID.
      ateApi:
        authorization:
          bootstrapOwners:
            - system:serviceaccount:ate-system:ate-client
            - system:serviceaccount:kagent:kagent-controller
            - spiffe://cluster.local/ns/kagent/sa/kagent-controller
      # The router denies every caller that is not listed. `kubectl ate proxy actor` requests its
      # client certificate as ServiceAccount atenet-client, which install.sh creates.
      atenetRouter:
        ingressAllowedSPIFFEIDs:
          - spiffe://cluster.local/ns/ate-system/sa/atenet-client
          - spiffe://cluster.local/ns/kagent/sa/kagent-controller
      # As in production: kagent Actors may resolve only labeled Secrets in namespace kagent.
      credentialProvider:
        namespacePolicies:
          - atespace: kagent
            allowedNamespaces: [kagent]
            secretSelector:
              matchLabels:
                mainloop.dev/actor-egress: "true"
          - atespace: kagent
            allowedNamespaces: [kagent]
            secretSelector:
              matchLabels:
                kagent.dev/runtime-injection: "true"
      otel:
        traces:
          enabled: false
        metrics:
          enabled: false
        logs:
          enabled: false
