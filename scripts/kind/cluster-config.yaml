# Single-node Kind cluster for trying Mainloop locally. The name comes from KIND_CLUSTER_NAME
# (create-cluster.sh passes it), and the apps are reached through port forwards, so no host
# ports are mapped.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # Substrate needs PodCertificateRequest and ClusterTrustBundle from certificates.k8s.io/v1,
    # which Kubernetes 1.37 serves by default.
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
# `kubectl ate install` checks for certificates.k8s.io/v1beta1 before it installs, although the
# components prefer v1.
runtimeConfig:
  'certificates.k8s.io/v1beta1': 'true'
