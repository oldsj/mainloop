version: v2beta1
name: mainloop

# Variables from .env
vars:
  GITHUB_TOKEN:
    source: env
    default: ''
  # Live profile: the dev harness image, else the production pin from the manifest.
  DEV_CLAUDE_HARNESS_IMAGE:
    command: scripts/dev-live-harness.sh
    args: [image, claude]
  DEV_CODEX_HARNESS_IMAGE:
    command: scripts/dev-live-harness.sh
    args: [image, codex]
  # Live profile: the deployment's own config for its live instance, kept outside this repository
  # (docs/dev-environment.md#live-dev-instance). A directory holding values.yaml for the chart and
  # kagent/, a kustomization of the instance's dev agents; and the only kube context it may use.
  MAINLOOP_DEV_CONFIG:
    source: env
    default: ''
  DEV_LIVE_CONTEXT:
    source: env
    default: ''

# Local Kind stack (`make dev`; see docs/dev-environment.md#kind). Builds the Go server and the React
# app from this checkout, loads both into the Kind cluster and deploys the chart with
# charts/mainloop/values-kind.yaml. The live profile below replaces this whole section.

# Images - built locally, then loaded into Kind by DevSpace. No constant tag: each build gets a new
# generated tag, so a changed image rolls the pods. A fixed tag would leave them on the old image.
images:
  backend:
    image: mainloop-backend
    dockerfile: server/Dockerfile
    context: server
    docker:
      useBuildKit: true
      args:
        - --target=prod

  frontend:
    image: mainloop-frontend
    dockerfile: web/Dockerfile
    context: .
    docker:
      useBuildKit: true
      args:
        # Baked into the bundle at build time; must match the API port forward below.
        - --build-arg=VITE_API_URL=http://localhost:8000

deployments:
  mainloop:
    namespace: mainloop
    helm:
      chart:
        name: ./charts/mainloop
      valuesFiles:
        - charts/mainloop/values-kind.yaml
      # The images DevSpace just built and loaded, under their generated tags.
      values:
        images:
          backend:
            repository: ${runtime.images.backend.image}
            tag: ${runtime.images.backend.tag}
          frontend:
            repository: ${runtime.images.frontend.image}
            tag: ${runtime.images.frontend.tag}

# Port forwards: the web app on localhost:5173 and the API on localhost:8000. Ctrl-C stops them.
dev:
  frontend:
    labelSelector:
      app: mainloop-frontend
    namespace: mainloop
    container: frontend
    ports:
      - port: 5173:3000
  backend:
    labelSelector:
      app: mainloop-backend
    namespace: mainloop
    container: backend
    ports:
      - port: 8000:8000

# Cluster bootstrap and secrets. DevSpace loads each built image into a kind cluster itself, so
# no image-load hook is needed.
hooks:
  - name: ensure-kind-cluster
    events:
      - before:deploy
      - before:dev
    command: ./scripts/kind/create-cluster.sh

  - name: create-secrets
    events:
      - before:deploy
      - before:dev
    command: ./scripts/kind/create-secrets.sh

# Commands: `devspace run <name>`. The live profile removes this section.
commands:
  reset:
    command: ./scripts/kind/reset-data.sh
    description: Wipe the Kind database and restart the backend

# Profiles
profiles:
  # Shared live instance (`make dev-live`). No local builds: images come from ghcr (CI publishes
  # the --target=dev images on pushes to main). DevSpace owns the instance's workloads and its
  # *-dev kagent agents directly; values and agents come from MAINLOOP_DEV_CONFIG.
  - name: live
    patches:
      - op: remove
        path: images
      - op: remove
        path: hooks
      - op: remove
        path: commands
      # v2beta1 has no kube-context key, so every live pipeline starts with this pin:
      # it refuses any context or namespace other than DEV_LIVE_CONTEXT/mainloop-dev
      # (pass --kube-context "$DEV_LIVE_CONTEXT" -n mainloop-dev, as scripts/dev-live.sh does).
      - op: add
        path: functions
        value:
          require_live_target: |-
            if [ -z "${MAINLOOP_DEV_CONFIG}" ] || [ -z "${DEV_LIVE_CONTEXT}" ]; then
              echo "profile live needs MAINLOOP_DEV_CONFIG and DEV_LIVE_CONTEXT (see docs/dev-environment.md#live-dev-instance)" >&2
              exit 1
            fi
            if [ "${DEVSPACE_CONTEXT}" != "${DEV_LIVE_CONTEXT}" ] || [ "${DEVSPACE_NAMESPACE}" != "mainloop-dev" ]; then
              echo "profile live runs only against context ${DEV_LIVE_CONTEXT}, namespace mainloop-dev (got ${DEVSPACE_CONTEXT}/${DEVSPACE_NAMESPACE})" >&2
              exit 1
            fi
      # dev and deploy touch only mainloop-dev; the shared kagent namespace changes
      # only through the explicit deploy-agents pipeline (`make dev-agents`).
      - op: add
        path: pipelines
        value:
          # build is overridden too: DevSpace's default build pipeline writes its cache
          # object to the target namespace even with no images.
          build: |-
            require_live_target
          dev: |-
            require_live_target
            create_deployments mainloop
            start_dev --all
          deploy: |-
            require_live_target
            create_deployments mainloop
          deploy-agents: |-
            require_live_target
            create_deployments dev-agents
          purge: |-
            require_live_target
            stop_dev --all
            purge_deployments --all
      - op: replace
        path: deployments
        value:
          mainloop:
            namespace: mainloop-dev
            helm:
              chart:
                name: ./charts/mainloop
              valuesFiles:
                - ${MAINLOOP_DEV_CONFIG}/values.yaml
              # Adopts objects an earlier kubectl deployment of the instance created.
              upgradeArgs:
                - --take-ownership
          dev-agents:
            namespace: kagent
            kubectl:
              kustomize: true
              manifests:
                - ${MAINLOOP_DEV_CONFIG}/kagent
              # `make dev-harness` records dev images under .devspace/dev-harness/.
              patches:
                - target:
                    apiVersion: api.kagent.dev/v1alpha3
                    kind: Harness
                    name: claude-workspace-dev-harness
                  op: replace
                  path: spec.workload.image
                  value: ${DEV_CLAUDE_HARNESS_IMAGE}
                - target:
                    apiVersion: api.kagent.dev/v1alpha3
                    kind: Harness
                    name: codex-workspace-dev-harness
                  op: replace
                  path: spec.workload.image
                  value: ${DEV_CODEX_HARNESS_IMAGE}
      # The Go server and the React app replace the Kind profile's Python and Svelte dev
      # containers. Each server container runs watchexec over `go run`, so a synced change
      # rebuilds and restarts only that listener. The image already holds the source it was
      # built from, so a pod serves before the first sync lands.
      - op: replace
        path: dev
        value:
          backend: &server
            container: backend
            labelSelector:
              app: mainloop-backend
            namespace: mainloop-dev
            sync: &server-sync
              - path: ./server:/src
                excludePaths:
                  - .git/
                  - bin/
                  - tmp/
                  - '*.test'
                  - '*_test.go'
                  - testdata/
                disableDownload: true
                onUpload:
                  exec:
                    - command: sh
                      args:
                        - -c
                        - cd /src && go mod download
                      onChange:
                        - go.mod
                        - go.sum
            command: &watch
              - watchexec
              - --restart
              - --exts
              - go,sql
              - --stop-timeout
              - 5s
              - --
              - go
              - run
              - ./cmd/mainloop
            args: [serve-api]
            logs: {}
          mcp:
            <<: *server
            container: mcp
            args: [serve-mcp]
          git:
            <<: *server
            container: git
            args: [serve-git]
          frontend:
            labelSelector:
              app: mainloop-frontend
            namespace: mainloop-dev
            container: frontend
            sync:
              - path: ./web:/app/web
                excludePaths:
                  - node_modules/
                  - dist/
                  - e2e/
                  - playwright-report/
                  - test-results/
                disableDownload: true
                onUpload:
                  exec:
                    - command: sh
                      args:
                        - -c
                        - cd /app && pnpm install --frozen-lockfile --filter 'web...' || pnpm install --filter 'web...'
                      onChange:
                        - package.json
              - path: ./pnpm-lock.yaml:/app/pnpm-lock.yaml
                file: true
                disableDownload: true
                onUpload:
                  execRemote:
                    command: sh
                    args:
                      - -c
                      - cd /app && pnpm install --frozen-lockfile --filter 'web...' || pnpm install --filter 'web...'
            command:
              - /app/web/node_modules/.bin/vite
            env:
              - name: VITE_API_URL
                value: /api
              - name: MAINLOOP_API_PROXY
                value: http://mainloop-backend:8000
            logs: {}
