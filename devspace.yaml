version: v2beta1
name: mainloop

# Variables from .env
vars:
  GITHUB_TOKEN:
    source: env
    default: ''
  # Live profile: the dev harness image, else the production pin from the manifest.
  DEV_CLAUDE_HARNESS_IMAGE:
    command: scripts/dev-live-harness.sh
    args: [image, claude]
  DEV_CODEX_HARNESS_IMAGE:
    command: scripts/dev-live-harness.sh
    args: [image, codex]

# Images - build locally, load into Kind
images:
  backend:
    image: mainloop-backend
    tags:
      - dev
    dockerfile: backend/Dockerfile
    context: .
    rebuildStrategy: ignoreContextChanges
    docker:
      useBuildKit: true
      args:
        - --target=dev

  frontend:
    image: mainloop-frontend
    tags:
      - dev
    dockerfile: frontend/Dockerfile
    context: .
    rebuildStrategy: ignoreContextChanges
    docker:
      useBuildKit: true
      args:
        - --target=dev

# Deployments using Kustomize
deployments:
  mainloop:
    namespace: mainloop
    kubectl:
      kustomize: true
      manifests:
        - k8s/apps/mainloop/overlays/dev

# Development mode configuration
dev:
  backend:
    container: backend
    labelSelector:
      app: mainloop-backend
    namespace: mainloop
    devImage: mainloop-backend:dev
    # Sync source files for hot reload
    sync:
      - path: ./backend/src:/app/src
        excludePaths:
          - __pycache__/
          - '*.pyc'
          - .pytest_cache/
          - .venv/
        disableDownload: true
      - path: ./models:/models
        excludePaths:
          - __pycache__/
          - '*.pyc'
          - .venv/
        disableDownload: true
      # Auto-install deps when pyproject.toml or uv.lock changes
      - path: ./backend/pyproject.toml:/app/pyproject.toml
        file: true
        disableDownload: true
        onUpload:
          execRemote:
            command: sh
            args:
              - -c
              - cd /app && uv sync
      - path: ./backend/uv.lock:/app/uv.lock
        file: true
        disableDownload: true
        onUpload:
          execRemote:
            command: sh
            args:
              - -c
              - cd /app && uv sync
    # Override command for dev mode with hot reload
    command:
      - uvicorn
      - mainloop.api:app
      - --host
      - 0.0.0.0
      - --port
      - '8000'
      - --reload
      - --reload-dir
      - /app/src
      - --reload-dir
      - /models
      - --timeout-graceful-shutdown
      - '3'
    logs: {}

  mcp:
    container: mcp
    labelSelector:
      app: mainloop-backend
    namespace: mainloop
    devImage: mainloop-backend:dev
    # Sync source files for hot reload
    sync:
      - path: ./backend/src:/app/src
        excludePaths:
          - __pycache__/
          - '*.pyc'
          - .pytest_cache/
          - .venv/
        disableDownload: true
      - path: ./models:/models
        excludePaths:
          - __pycache__/
          - '*.pyc'
          - .venv/
        disableDownload: true
      # Auto-install deps when pyproject.toml or uv.lock changes
      - path: ./backend/pyproject.toml:/app/pyproject.toml
        file: true
        disableDownload: true
        onUpload:
          execRemote:
            command: sh
            args:
              - -c
              - cd /app && uv sync
      - path: ./backend/uv.lock:/app/uv.lock
        file: true
        disableDownload: true
        onUpload:
          execRemote:
            command: sh
            args:
              - -c
              - cd /app && uv sync
    # Override command for dev mode with hot reload
    command:
      - uvicorn
      - mainloop.mcp_app:app
      - --host
      - 0.0.0.0
      - --port
      - '8002'
      - --reload
      - --reload-dir
      - /app/src
      - --reload-dir
      - /models
      - --timeout-graceful-shutdown
      - '3'
    logs: {}

  frontend:
    labelSelector:
      app: mainloop-frontend
    namespace: mainloop
    container: frontend
    devImage: mainloop-frontend:dev
    sync:
      - path: ./frontend/src:/app/frontend/src
        excludePaths:
          - .svelte-kit/
          - node_modules/
        disableDownload: true
      - path: ./frontend/vite.config.ts:/app/frontend/vite.config.ts
        file: true
        disableDownload: true
      - path: ./packages:/app/packages
        excludePaths:
          - __pycache__/
          - node_modules/
        disableDownload: true
      # Auto-install deps when package files change
      - path: ./frontend/package.json:/app/frontend/package.json
        file: true
        disableDownload: true
        onUpload:
          execRemote:
            command: sh
            args:
              - -c
              - cd /app && pnpm install --frozen-lockfile || pnpm install
      - path: ./pnpm-lock.yaml:/app/pnpm-lock.yaml
        file: true
        disableDownload: true
        onUpload:
          execRemote:
            command: sh
            args:
              - -c
              - cd /app && pnpm install --frozen-lockfile || pnpm install
    command:
      - pnpm
      - dev
      - --host
      - 0.0.0.0
      - --port
      - '3000'
    env:
      - name: VITE_API_URL
        value: http://localhost:8081
    logs: {}

# Hooks for Kind cluster management
hooks:
  - name: ensure-kind-cluster
    events:
      - before:deploy
      - before:dev
    command: |
      if ! kind get clusters 2>/dev/null | grep -q "^mainloop-test$"; then
        echo "Creating Kind cluster..."
        ./scripts/kind/create-cluster.sh
      fi

  - name: create-secrets
    events:
      - before:deploy
      - before:dev
    command: ./scripts/kind/create-secrets.sh

  - name: load-images
    events:
      - after:build
    command: |
      echo "Loading images into Kind..."
      kind load docker-image mainloop-backend:dev --name mainloop-test
      kind load docker-image mainloop-frontend:dev --name mainloop-test

# Commands
commands:
  reset:
    command: ./scripts/kind/reset-data.sh
    description: Reset database and task namespaces

  logs:
    command: kubectl --context kind-mainloop-test logs -n mainloop deployment/mainloop-backend -f
    description: Tail backend logs

  shell:
    command: kubectl --context kind-mainloop-test exec -it -n mainloop deployment/mainloop-backend -- bash
    description: Open shell in backend pod

# Profiles
profiles:
  # Test profile - deploy only, no sync (for CI and Playwright)
  - name: test
    patches:
      - op: replace
        path: deployments.mainloop.kubectl.manifests
        value:
          - k8s/apps/mainloop/overlays/test
      - op: remove
        path: dev

  # Shared live instance on internal-01 (`make dev-live`). No local builds: images
  # come from ghcr (CI publishes the --target=dev images on pushes to main).
  # DevSpace owns namespace mainloop-dev and the *-dev kagent agents directly.
  - name: live
    patches:
      - op: remove
        path: images
      - op: remove
        path: hooks
      - op: remove
        path: commands
      # v2beta1 has no kube-context key, so every live pipeline starts with this pin:
      # it refuses any context or namespace other than admin@internal-01/mainloop-dev
      # (pass --kube-context admin@internal-01 -n mainloop-dev, as scripts/dev-live.sh does).
      - op: add
        path: functions
        value:
          require_live_target: |-
            if [ "${DEVSPACE_CONTEXT}" != "admin@internal-01" ] || [ "${DEVSPACE_NAMESPACE}" != "mainloop-dev" ]; then
              echo "profile live runs only against context admin@internal-01, namespace mainloop-dev (got ${DEVSPACE_CONTEXT}/${DEVSPACE_NAMESPACE})" >&2
              exit 1
            fi
      # dev and deploy touch only mainloop-dev; the shared kagent namespace changes
      # only through the explicit deploy-agents pipeline (`make dev-agents`).
      - op: add
        path: pipelines
        value:
          # build is overridden too: DevSpace's default build pipeline writes its cache
          # object to the target namespace even with no images.
          build: |-
            require_live_target
          dev: |-
            require_live_target
            create_deployments mainloop
            start_dev --all
          deploy: |-
            require_live_target
            create_deployments mainloop
          deploy-agents: |-
            require_live_target
            create_deployments dev-agents
          purge: |-
            require_live_target
            stop_dev --all
            purge_deployments --all
      - op: replace
        path: deployments
        value:
          mainloop:
            namespace: mainloop-dev
            kubectl:
              kustomize: true
              manifests:
                - k8s/apps/mainloop/overlays/dev-live
          dev-agents:
            namespace: kagent
            kubectl:
              kustomize: true
              manifests:
                - k8s/apps/mainloop/overlays/dev-live/kagent
              # `make dev-harness` records dev images under .devspace/dev-harness/.
              patches:
                - target:
                    apiVersion: api.kagent.dev/v1alpha3
                    kind: Harness
                    name: claude-workspace-dev-harness
                  op: replace
                  path: spec.workload.image
                  value: ${DEV_CLAUDE_HARNESS_IMAGE}
                - target:
                    apiVersion: api.kagent.dev/v1alpha3
                    kind: Harness
                    name: codex-workspace-dev-harness
                  op: replace
                  path: spec.workload.image
                  value: ${DEV_CODEX_HARNESS_IMAGE}
      - op: replace
        path: dev.backend.namespace
        value: mainloop-dev
      - op: replace
        path: dev.mcp.namespace
        value: mainloop-dev
      - op: replace
        path: dev.frontend.namespace
        value: mainloop-dev
      - op: remove
        path: dev.backend.devImage
      - op: remove
        path: dev.mcp.devImage
      - op: remove
        path: dev.frontend.devImage
      - op: replace
        path: dev.frontend.env
        value:
          - name: VITE_API_URL
            value: /api
          - name: MAINLOOP_API_PROXY
            value: http://mainloop-backend:8000
          - name: __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
            value: mainloop-dev.olds.network
