# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  definitions:
    - name: prettier
      runtime: node
      package: prettier
      extra_packages:
        - prettier-plugin-tailwindcss
  ignore:
    # CLAUDE.md only imports AGENTS.md and intentionally has no top-level heading
    - linters: [markdownlint]
      paths:
        - CLAUDE.md
    # K8s security best practices - remaining issues are acceptable for internal Tailscale-only services
    # Fixed: container security contexts, health probes, RBAC over-permissions
    # Remaining: image tags/digests, readOnlyRootFilesystem, NetworkPolicy, etc.
    - linters: [checkov, trivy]
      paths:
        - k8s/**
    # DL3008: Pinning apt versions causes build failures when versions are removed from repos
    # Terrascan Docker checks have platform differences (Linux vs macOS) and false positives
    # for multi-stage builds with --chown flags
    - linters: [hadolint, terrascan]
      paths:
        - '**/*Dockerfile*'
    # Written by the TanStack Router plugin on every vite run; its output is committed as written
    - linters: [ALL]
      paths:
        - web/src/routeTree.gen.ts
  enabled:
    - checkov@3.2.497
    - git-diff-check
    - hadolint@2.14.0
    - markdownlint@0.47.0
    - osv-scanner@2.3.1
    - oxipng@10.0.0
    - prettier@3.7.4
    - shellcheck@0.11.0
    - shfmt@3.6.0
    - taplo@0.10.0
    - terrascan@1.19.9
    - trivy@0.74.0
    - trufflehog@3.92.4
    - yamllint@1.37.1
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
plugins:
  sources:
    - id: trunk
      ref: v1.7.4
      uri: https://github.com/trunk-io/plugins
