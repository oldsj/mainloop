# Mainloop-owned ingress boundary for the Substrate router. NetworkPolicy ports
# are pod ports: Service port 80 maps to the router's HTTP listener on 8080.
# The agentgateway router forwards requests to api.ate-system.svc:443 itself;
# actor/provider egress goes through atenet-egress, so neither ate-system worker
# pods nor the egress gateway are router ingress clients in this install.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atenet-router-mainloop-ingress
  namespace: ate-system
spec:
  podSelector:
    matchLabels:
      app: atenet-router
  policyTypes:
  - Ingress
  ingress:
  # Trusted Mainloop backend. It uses HTTP plus the Substrate CONNECT listener
  # for actor control and arbitrary-port workspace traffic.
  - from:
    - namespaceSelector:
        matchLabels:
          mainloop.dev/role: control
    ports:
    - { protocol: TCP, port: 8080 }
    - { protocol: TCP, port: 8081 }
    - { protocol: TCP, port: 8443 }
    - { protocol: TCP, port: 8444 }
  # The fixed NGINX preview proxy injects ate-target-actor and only needs HTTP.
  - from:
    - namespaceSelector:
        matchLabels:
          mainloop.dev/role: workspace
      podSelector:
        matchLabels:
          app: preview-proxy
    ports:
    - { protocol: TCP, port: 8080 }
  # The installer annotates the router for Prometheus scraping on 15020.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: otel-system
    ports:
    - { protocol: TCP, port: 15020 }
